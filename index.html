<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Exam-Axis - Professional SSC Mock Tests for CGL, CHSL, CPO and DP Constable preparation">
    <meta name="theme-color" content="#6366f1">
    <title>Exam-Axis | SSC Mock Tests</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CSS VARIABLES - Light & Dark Theme
           ============================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            
            /* Brand Colors */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            
            /* Exam Colors - CGL */
            --cgl-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --cgl-glow: rgba(99, 102, 241, 0.3);
            
            /* Exam Colors - CHSL */
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --chsl-glow: rgba(16, 185, 129, 0.3);
            
            /* Exam Colors - CPO */
            --cpo-color: #ec4899;
            --cpo-gradient: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            --cpo-glow: rgba(236, 72, 153, 0.3);
            
            /* Exam Colors - DP */
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --dp-glow: rgba(245, 158, 11, 0.3);
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15);
            
            /* Spacing & Sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Container */
            --container-max: 1320px;
            --nav-height: 72px;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: #1e293b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
            transition: opacity var(--transition-slow);
        }

        .dark-mode::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent);
        }

        body.exam-chsl::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(16, 185, 129, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(52, 211, 153, 0.06), transparent);
        }

        body.exam-cpo::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(236, 72, 153, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(244, 114, 182, 0.06), transparent);
        }

        body.exam-dp::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(245, 158, 11, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(251, 191, 36, 0.06), transparent);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            height: var(--nav-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-normal);
        }

        .dark-mode .top-nav {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: var(--border-color);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform var(--transition-normal);
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .brand-logo {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .brand-logo {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Theme Switch */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            transition: all var(--transition-normal);
        }

        .theme-switch-wrapper:hover {
            border-color: var(--primary);
        }

        .theme-switch-wrapper span {
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: transform var(--transition-normal);
        }

        .theme-switch-wrapper:hover span:first-of-type {
            transform: rotate(-15deg) scale(1.1);
        }

        .theme-switch-wrapper:hover span:last-of-type {
            transform: rotate(15deg) scale(1.1);
        }

        .theme-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: var(--transition-normal);
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(20px);
        }

        /* Nav Buttons */
        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }

        .login-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .login-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        body.exam-chsl .login-btn {
            color: var(--chsl-color);
            border-color: var(--chsl-color);
        }

        body.exam-chsl .login-btn:hover {
            background: var(--chsl-color);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-chsl .signup-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-cpo .login-btn {
            color: var(--cpo-color);
            border-color: var(--cpo-color);
        }

        body.exam-cpo .login-btn:hover {
            background: var(--cpo-color);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-cpo .signup-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-dp .login-btn {
            color: var(--dp-color);
            border-color: var(--dp-color);
        }

        body.exam-dp .login-btn:hover {
            background: var(--dp-color);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        body.exam-dp .signup-btn {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .main-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 40px 24px 100px;
        }

        /* Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .header-title-section strong {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .sub-heading {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub-heading::before,
        .sub-heading::after {
            content: '';
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 1px;
        }

        /* ============================================
           EXAM SELECTOR BUTTONS
           ============================================ */
        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .exam-btn {
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exam-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px var(--cgl-glow);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        .exam-btn.active.cpo {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 24px var(--cpo-glow);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        /* ============================================
           MODE SELECTOR (Mock / Chapterwise Toggle)
           ============================================ */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            padding: 6px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-btn {
            flex: 1;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: 2px solid transparent;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .mode-btn.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 16px var(--cgl-glow);
            border-color: transparent;
        }

        body.exam-chsl .mode-btn.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 16px var(--chsl-glow);
        }

        body.exam-cpo .mode-btn.active {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 16px var(--cpo-glow);
        }

        body.exam-dp .mode-btn.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 16px var(--dp-glow);
        }

        /* ============================================
           SUBJECT TABS
           ============================================ */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 36px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: none;
            background: transparent;
        }

        .tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-cpo .tab.active {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* Top 100 Tab Special */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .tab.chsl-only:hover {
            transform: translateY(-2px);
        }

        /* ============================================
           CHAPTERWISE SECTION CONTAINER
           ============================================ */
        .chapterwise-container {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Chapterwise Subject Tabs */
        .chapterwise-subjects {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .chapterwise-subjects::-webkit-scrollbar {
            display: none;
        }

        .chapter-subject-btn {
            padding: 14px 28px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: 2px solid transparent;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-subject-btn:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .chapter-subject-btn.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        body.exam-chsl .chapter-subject-btn.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-cpo .chapter-subject-btn.active {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-dp .chapter-subject-btn.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* ============================================
           CHAPTERS GRID
           ============================================ */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARDS GRID
           ============================================ */
        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARD - Premium Design
           ============================================ */
        .test-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card hover glow effect */
        .test-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        body.exam-chsl .test-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-cpo .test-card::before {
            background: var(--cpo-gradient);
        }

        body.exam-dp .test-card::before {
            background: var(--dp-gradient);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .test-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .test-card:hover::after {
            left: 125%;
        }

        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--cgl-glow);
            border-color: transparent;
        }

        body.exam-chsl .test-card:hover {
            box-shadow: 0 20px 40px var(--chsl-glow);
        }

        body.exam-cpo .test-card:hover {
            box-shadow: 0 20px 40px var(--cpo-glow);
        }

        body.exam-dp .test-card:hover {
            box-shadow: 0 20px 40px var(--dp-glow);
        }

        /* Card Glow Background */
        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity var(--transition-normal);
            pointer-events: none;
            z-index: -1;
        }

        .test-card:hover .card-glow {
            opacity: 0.5;
        }

        /* Badges */
        .new-badge, .attempted-badge, .top100-badge {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 10;
        }

        .new-badge {
            right: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .attempted-badge {
            right: 16px;
            background: var(--success);
            color: white;
        }

        .attempted-badge::before {
            content: "✓ ";
        }

        .top100-badge {
            left: 16px;
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: white;
        }

        /* Card Title */
        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin: 12px 0 20px;
            color: var(--text-primary);
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .test-card hr {
            width: 50%;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 0 auto 24px;
            opacity: 0.3;
        }

        body.exam-chsl .test-card hr {
            background: linear-gradient(90deg, transparent, var(--chsl-color), transparent);
        }

        body.exam-cpo .test-card hr {
            background: linear-gradient(90deg, transparent, var(--cpo-color), transparent);
        }

        body.exam-dp .test-card hr {
            background: linear-gradient(90deg, transparent, var(--dp-color), transparent);
        }

        /* Stats Grid */
        .card-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            flex: 1;
            max-width: 90px;
            padding: 14px 8px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.04));
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
            transition: all var(--transition-normal);
        }

        body.exam-chsl .stat-item {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(52, 211, 153, 0.04));
            border-color: rgba(16, 185, 129, 0.1);
        }

        body.exam-cpo .stat-item {
            background: linear-gradient(145deg, rgba(236, 72, 153, 0.08), rgba(244, 114, 182, 0.04));
            border-color: rgba(236, 72, 153, 0.1);
        }

        body.exam-dp .stat-item {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.04));
            border-color: rgba(245, 158, 11, 0.1);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-item .value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        body.exam-chsl .stat-item .value {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .stat-item .value {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .stat-item .value {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Last Score */
        .last-score {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 10px 18px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .last-score::before {
            content: "📊";
        }

        .last-score.not-attempted {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.15);
        }

        .last-score.not-attempted::before {
            content: "📝";
        }

        /* Attempt Button */
        .attempt-btn {
            background: var(--cgl-gradient);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            max-width: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition-normal);
            box-shadow: 0 8px 20px var(--cgl-glow);
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .attempt-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }

        .attempt-btn:hover::before {
            left: 100%;
        }

        .attempt-btn::after {
            content: "→";
            font-size: 1.1rem;
            transition: transform var(--transition-normal);
        }

        .attempt-btn:hover::after {
            transform: translateX(4px);
        }

        .attempt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px var(--cgl-glow);
        }

        body.exam-chsl .attempt-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 20px var(--chsl-glow);
        }

        body.exam-chsl .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--chsl-glow);
        }

        body.exam-cpo .attempt-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 20px var(--cpo-glow);
        }

        body.exam-cpo .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--cpo-glow);
        }

        body.exam-dp .attempt-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 20px var(--dp-glow);
        }

        body.exam-dp .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--dp-glow);
        }

        /* ============================================
           CHAPTER CARD - Premium Design
           ============================================ */
        .chapter-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        /* Chapter card hover glow effect */
        .chapter-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        body.exam-chsl .chapter-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-cpo .chapter-card::before {
            background: var(--cpo-gradient);
        }

        body.exam-dp .chapter-card::before {
            background: var(--dp-gradient);
        }

        .chapter-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .chapter-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .chapter-card:hover::after {
            left: 125%;
        }

        .chapter-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--cgl-glow);
            border-color: transparent;
        }

        body.exam-chsl .chapter-card:hover {
            box-shadow: 0 20px 40px var(--chsl-glow);
        }

        body.exam-cpo .chapter-card:hover {
            box-shadow: 0 20px 40px var(--cpo-glow);
        }

        body.exam-dp .chapter-card:hover {
            box-shadow: 0 20px 40px var(--dp-glow);
        }

        /* Chapter Icon */
        .chapter-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            line-height: 1;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            transition: transform var(--transition-normal);
        }

        .chapter-card:hover .chapter-icon {
            transform: scale(1.15) rotate(5deg);
        }

        /* Chapter Title */
        .chapter-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            line-height: 1.3;
        }

        /* Chapter Stats */
        .chapter-stats {
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .chapter-test-count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            border-radius: var(--radius-full);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        body.exam-chsl .chapter-test-count {
            color: var(--chsl-color);
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
        }

        body.exam-cpo .chapter-test-count {
            color: var(--cpo-color);
            background: rgba(236, 72, 153, 0.1);
            border-color: rgba(236, 72, 153, 0.2);
        }

        body.exam-dp .chapter-test-count {
            color: var(--dp-color);
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.2);
        }

        /* ============================================
           PROGRESS BAR
           ============================================ */
        .chapter-progress {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--cgl-gradient);
            border-radius: var(--radius-full);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.3),
                transparent
            );
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        body.exam-chsl .progress-fill {
            background: var(--chsl-gradient);
        }

        body.exam-cpo .progress-fill {
            background: var(--cpo-gradient);
        }

        body.exam-dp .progress-fill {
            background: var(--dp-gradient);
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Chapter Card Attempt Button */
        .chapter-card .attempt-btn {
            padding: 12px 32px;
            font-size: 0.9rem;
            max-width: 200px;
        }

        /* ============================================
           NO TESTS MESSAGE
           ============================================ */
        .no-tests-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 2px dashed var(--border-color);
        }

        .no-tests-message .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .no-tests-message h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .no-tests-message p {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ============================================
           TOP 100 SECTION HEADER
           ============================================ */
        .section-header.top100-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 36px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: var(--radius-xl);
            color: white;
            margin-bottom: 8px;
            box-shadow: 0 12px 32px rgba(249, 115, 22, 0.3);
            position: relative;
            overflow: hidden;
        }

        .section-header.top100-header::before {
            content: "🔥";
            position: absolute;
            font-size: 8rem;
            opacity: 0.15;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
        }

        .section-header.top100-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .section-header.top100-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .test-card.top100-card {
            border-color: #f97316;
        }

        .test-card.top100-card::before {
            background: linear-gradient(135deg, #f97316, #ea580c);
            opacity: 1;
        }

        /* ============================================
           HELP BUTTON
           ============================================ */
        .help-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            background: var(--cgl-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--cgl-glow);
            transition: all var(--transition-normal);
            z-index: 999;
            border: none;
        }

        .help-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 32px var(--cgl-glow);
        }

        body.exam-chsl .help-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        body.exam-cpo .help-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 24px var(--cpo-glow);
        }

        body.exam-dp .help-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        /* Footer decoration */
        .footer-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--cgl-gradient);
            z-index: 100;
        }

        body.exam-chsl .footer-decoration {
            background: var(--chsl-gradient);
        }

        body.exam-cpo .footer-decoration {
            background: var(--cpo-gradient);
        }

        body.exam-dp .footer-decoration {
            background: var(--dp-gradient);
        }

        /* ============================================
           LOADING STATE
           ============================================ */
        .test-grid-container.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .loading-skeleton {
            grid-column: 1 / -1;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .skeleton-card {
            width: 320px;
            height: 400px;
            background: linear-gradient(
                90deg,
                var(--bg-card) 0%,
                var(--border-light) 50%,
                var(--bg-card) 100%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-xl);
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .main-container {
                padding: 32px 20px 80px;
            }

            .test-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }

            .chapters-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .top-nav {
                padding: 0 16px;
                height: 64px;
            }

            .brand-logo {
                font-size: 1.3rem;
            }

            .brand-logo::before {
                font-size: 1.2rem;
            }

            .nav-right {
                gap: 10px;
            }

            .theme-switch-wrapper {
                padding: 4px 10px;
            }

            .theme-switch-wrapper span {
                font-size: 0.9rem;
            }

            .theme-switch {
                width: 38px;
                height: 20px;
            }

            .slider::before {
                height: 14px;
                width: 14px;
            }

            input:checked + .slider::before {
                transform: translateX(18px);
            }

            .nav-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }

            .main-container {
                padding: 24px 16px 80px;
            }

            .header-container {
                margin-bottom: 28px;
            }

            .sub-heading::before,
            .sub-heading::after {
                width: 24px;
            }

            .exam-selector {
                gap: 8px;
                margin-bottom: 24px;
            }

            .exam-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
                flex: 1;
                min-width: 100px;
                justify-content: center;
            }

            .mode-selector {
                max-width: 100%;
                gap: 6px;
                padding: 5px;
            }

            .mode-btn {
                padding: 12px 16px;
                font-size: 0.8rem;
                gap: 6px;
            }

            .tabs-container {
                padding: 6px;
                margin-bottom: 28px;
                justify-content: flex-start;
            }

            .tab {
                padding: 10px 18px;
                font-size: 0.8rem;
            }

            .chapterwise-subjects {
                padding: 6px;
                gap: 6px;
                justify-content: flex-start;
            }

            .chapter-subject-btn {
                padding: 10px 18px;
                font-size: 0.8rem;
            }

            .test-grid-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .chapters-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 16px;
            }

            .test-card {
                padding: 24px 20px;
            }

            .chapter-card {
                padding: 24px 20px;
            }

            .chapter-icon {
                font-size: 2.5rem;
            }

            .chapter-title {
                font-size: 1.05rem;
            }

            .chapter-card .attempt-btn {
                padding: 10px 24px;
                font-size: 0.85rem;
            }

            .card-title {
                font-size: 1.05rem;
            }

            .stat-item .value {
                font-size: 1.35rem;
            }

            .attempt-btn {
                padding: 12px 32px;
                font-size: 0.9rem;
            }

            .help-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
                bottom: 20px;
                right: 20px;
            }

            .section-header.top100-header {
                padding: 28px 20px;
            }

            .section-header.top100-header h2 {
                font-size: 1.4rem;
            }

            .section-header.top100-header::before {
                font-size: 5rem;
                right: 10px;
            }

            /* Reduce animations on mobile */
            .test-card::after,
            .chapter-card::after,
            .attempt-btn::before {
                display: none;
            }

            .test-card:hover,
            .chapter-card:hover {
                transform: translateY(-4px);
            }

            .chapter-card:hover .chapter-icon {
                transform: scale(1.1);
            }

            .progress-fill::after {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .top-nav {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
                gap: 12px;
            }

            .nav-right {
                width: 100%;
                justify-content: space-between;
            }

            .exam-btn {
                padding: 10px 14px;
                font-size: 0.8rem;
            }

            .mode-selector {
                flex-direction: column;
            }

            .mode-btn {
                width: 100%;
            }

            .chapterwise-subjects {
                flex-wrap: nowrap;
                justify-content: flex-start;
            }

            .chapter-subject-btn {
                padding: 10px 16px;
                font-size: 0.75rem;
                min-width: max-content;
            }

            .test-card {
                padding: 20px 16px;
            }

            .chapter-card {
                padding: 20px 16px;
            }

            .chapter-icon {
                font-size: 2.2rem;
                margin-bottom: 12px;
            }

            .chapter-title {
                font-size: 1rem;
            }

            .chapter-test-count {
                font-size: 0.8rem;
                padding: 6px 12px;
            }

            .progress-text {
                font-size: 0.7rem;
            }

            .chapters-grid {
                grid-template-columns: 1fr;
            }

            .stat-item {
                padding: 10px 6px;
            }

            .stat-item .value {
                font-size: 1.25rem;
            }

            .stat-item .label {
                font-size: 0.6rem;
            }

            .no-tests-message {
                padding: 60px 24px;
            }

            .no-tests-message .icon {
                font-size: 3rem;
            }

            .no-tests-message h3 {
                font-size: 1.25rem;
            }
        }

        /* ============================================
           ACCESSIBILITY & PERFORMANCE
           ============================================ */
        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .test-card,
            .chapter-card {
                border-width: 2px;
            }

            .tab.active,
            .exam-btn.active,
            .mode-btn.active,
            .chapter-subject-btn.active {
                outline: 2px solid white;
                outline-offset: 2px;
            }
        }

        /* Focus visible for keyboard navigation */
        .exam-btn:focus-visible,
        .tab:focus-visible,
        .attempt-btn:focus-visible,
        .nav-btn:focus-visible,
        .mode-btn:focus-visible,
        .chapter-subject-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        body.exam-cpo .mode-btn:focus-visible,
        body.exam-cpo .chapter-subject-btn:focus-visible {
            outline-color: var(--cpo-color);
        }

        /* ============================================
           PRINT STYLES
           ============================================ */
        @media print {
            .top-nav,
            .help-btn,
            .footer-decoration,
            .theme-switch-wrapper,
            .mode-selector,
            .chapterwise-subjects {
                display: none !important;
            }

            body::before {
                display: none;
            }

            .test-card,
            .chapter-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
            }

            .test-card::before,
            .test-card::after,
            .chapter-card::before,
            .chapter-card::after {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Footer decoration line -->
<div class="footer-decoration"></div>

<!-- Navigation Bar -->
<nav class="top-nav">
    <a href="#" class="brand-logo">EXAM-AXIS</a>
    <div class="nav-right">
        <div class="theme-switch-wrapper">
            <span>☀️</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                <span class="slider"></span>
            </label>
            <span>🌙</span>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login-btn">Login</a>
            <a href="signup.html" class="nav-btn signup-btn">Create Account</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="main-container">
    <!-- Header Section -->
    <header class="header-container">
        <div class="header-title-section">
            <h1 id="main-title">SSC <strong>CGL</strong> Mock Tests</h1>
            <p class="sub-heading">Assess Your Preparation: Start a Test Now</p>
        </div>
    </header>

    <!-- Exam Selector -->
    <div class="exam-selector" role="tablist" aria-label="Select exam type">
        <button class="exam-btn active" data-exam="CGL" id="btn-cgl" role="tab" aria-selected="true">🎓 SSC CGL</button>
        <button class="exam-btn chsl" data-exam="CHSL" id="btn-chsl" role="tab" aria-selected="false">📘 SSC CHSL</button>
        <button class="exam-btn cpo" data-exam="CPO" id="btn-cpo" role="tab" aria-selected="false">🚔 SSC CPO</button>
        <button class="exam-btn dp" data-exam="DP" id="btn-dp" role="tab" aria-selected="false">👮 DP Constable</button>
    </div>

    <!-- Test Type Selector (3 Sections) -->
    <div class="test-type-selector" role="tablist" aria-label="Select test type">
        <button class="type-btn active" data-type="shiftwise" id="btn-shiftwise" role="tab" aria-selected="true">
            📊 Shift-wise Tests
        </button>
        <button class="type-btn" data-type="chapterwise" id="btn-chapterwise" role="tab" aria-selected="false">
            📚 Chapter-wise Tests
        </button>
        <button class="type-btn" data-type="fullmock" id="btn-fullmock" role="tab" aria-selected="false">
            📝 Full Mock Tests
        </button>
    </div>

    <!-- Subject Tabs (for Shift-wise and Chapter-wise) -->
    <div class="tabs-container" id="subject-tabs" role="tablist" aria-label="Select subject">
        <button class="tab active" data-subject="Maths" role="tab" aria-selected="true">📐 Maths</button>
        <button class="tab" data-subject="Reasoning" role="tab" aria-selected="false">🧩 Reasoning</button>
        <button class="tab" data-subject="English" role="tab" aria-selected="false">📖 English</button>
        <button class="tab" data-subject="GK" role="tab" aria-selected="false">🌍 GK</button>
    </div>

    <!-- Test Cards Grid -->
    <div id="test-grid-container" class="test-grid-container" role="list" aria-label="Available tests"></div>
</main>

<!-- Help Button -->
<button class="help-btn" aria-label="Get help">💬</button>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/tests-list.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM Elements
    const mainTitle = document.getElementById('main-title');
    const gridContainer = document.getElementById('test-grid-container');
    const tabs = document.querySelectorAll('.tab');
    const themeToggle = document.getElementById('theme-toggle');
    const btnCGL = document.getElementById('btn-cgl');
    const btnCHSL = document.getElementById('btn-chsl');
    const btnCPO = document.getElementById('btn-cpo');
    const btnDP = document.getElementById('btn-dp');
    
    // Test type selector elements
    const btnShiftwise = document.getElementById('btn-shiftwise');
    const btnChapterwise = document.getElementById('btn-chapterwise');
    const btnFullmock = document.getElementById('btn-fullmock');
    const subjectTabs = document.getElementById('subject-tabs');

    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';
    let currentTestType = 'shiftwise'; // 'shiftwise', 'chapterwise', 'fullmock'
    let historyMap = {};
    let isHistoryLoaded = false;

    // Configuration
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 60,
        "FullMock": 60
    };

    // Chapterwise Test IDs Configuration (to be added to tests-list.js)
    const CHAPTER_TEST_IDS = {
        Maths: {
            'percentage': ['CGL_MATH_PER_1', 'CGL_MATH_PER_2', 'CGL_MATH_PER_3'],
            'profit-loss': ['CGL_MATH_PL_1', 'CGL_MATH_PL_2', 'CGL_MATH_PL_3'],
            'si-ci': ['CGL_MATH_SICI_1', 'CGL_MATH_SICI_2'],
            'ratio-proportion': ['CGL_MATH_RP_1', 'CGL_MATH_RP_2'],
            'time-work': ['CGL_MATH_TW_1', 'CGL_MATH_TW_2'],
            'time-distance': ['CGL_MATH_TD_1', 'CGL_MATH_TD_2'],
            'number-system': ['CGL_MATH_NS_1', 'CGL_MATH_NS_2', 'CGL_MATH_NS_3'],
            'algebra': ['CGL_MATH_ALG_1', 'CGL_MATH_ALG_2'],
            'geometry': ['CGL_MATH_GEO_1', 'CGL_MATH_GEO_2', 'CGL_MATH_GEO_3'],
            'trigonometry': ['CGL_MATH_TRIG_1', 'CGL_MATH_TRIG_2'],
            'mensuration': ['CGL_MATH_MENS_1', 'CGL_MATH_MENS_2'],
            'data-interpretation': ['CGL_MATH_DI_1', 'CGL_MATH_DI_2']
        },
        Reasoning: {
            'analogy': ['CGL_REAS_ANA_1', 'CGL_REAS_ANA_2'],
            'classification': ['CGL_REAS_CLASS_1', 'CGL_REAS_CLASS_2'],
            'series': ['CGL_REAS_SER_1', 'CGL_REAS_SER_2'],
            'coding-decoding': ['CGL_REAS_CD_1', 'CGL_REAS_CD_2'],
            'blood-relation': ['CGL_REAS_BR_1', 'CGL_REAS_BR_2'],
            'direction': ['CGL_REAS_DIR_1', 'CGL_REAS_DIR_2']
        },
        English: {
            'vocab': ['CGL_ENG_VOC_1', 'CGL_ENG_VOC_2'],
            'synonyms': ['CGL_ENG_SYN_1', 'CGL_ENG_SYN_2'],
            'antonyms': ['CGL_ENG_ANT_1', 'CGL_ENG_ANT_2'],
            'idioms': ['CGL_ENG_IDI_1', 'CGL_ENG_IDI_2'],
            'error-spotting': ['CGL_ENG_ERR_1', 'CGL_ENG_ERR_2'],
            'fill-blanks': ['CGL_ENG_FB_1', 'CGL_ENG_FB_2']
        },
        GK: {
            'history': ['CGL_GK_HIST_1', 'CGL_GK_HIST_2'],
            'geography': ['CGL_GK_GEO_1', 'CGL_GK_GEO_2'],
            'polity': ['CGL_GK_POL_1', 'CGL_GK_POL_2'],
            'economy': ['CGL_GK_ECO_1', 'CGL_GK_ECO_2'],
            'science': ['CGL_GK_SCI_1', 'CGL_GK_SCI_2'],
            'current-affairs': ['CGL_GK_CA_1', 'CGL_GK_CA_2']
        }
    };

    // Full Mock Test IDs Configuration
    const FULLMOCK_TEST_IDS = {
        'CGL': ['CGL_FULL_MOCK_1', 'CGL_FULL_MOCK_2', 'CGL_FULL_MOCK_3', 'CGL_FULL_MOCK_4', 'CGL_FULL_MOCK_5'],
        'CHSL': ['CHSL_FULL_MOCK_1', 'CHSL_FULL_MOCK_2', 'CHSL_FULL_MOCK_3', 'CHSL_FULL_MOCK_4'],
        'CPO': ['CPO_FULL_MOCK_1', 'CPO_FULL_MOCK_2', 'CPO_FULL_MOCK_3'],
        'DP': ['DP_FULL_MOCK_1', 'DP_FULL_MOCK_2', 'DP_FULL_MOCK_3']
    };

    // Chapter Information
    const CHAPTER_INFO = {
        Maths: [
            { id: 'percentage', name: 'Percentage', icon: '📊' },
            { id: 'profit-loss', name: 'Profit & Loss', icon: '💰' },
            { id: 'si-ci', name: 'SI & CI', icon: '🏦' },
            { id: 'ratio-proportion', name: 'Ratio & Proportion', icon: '⚖️' },
            { id: 'time-work', name: 'Time & Work', icon: '⏱️' },
            { id: 'time-distance', name: 'Time & Distance', icon: '🚗' },
            { id: 'number-system', name: 'Number System', icon: '🔢' },
            { id: 'algebra', name: 'Algebra', icon: '📈' },
            { id: 'geometry', name: 'Geometry', icon: '📐' },
            { id: 'trigonometry', name: 'Trigonometry', icon: '📏' },
            { id: 'mensuration', name: 'Mensuration', icon: '📦' },
            { id: 'data-interpretation', name: 'Data Interpretation', icon: '📉' }
        ],
        Reasoning: [
            { id: 'analogy', name: 'Analogy', icon: '🔗' },
            { id: 'classification', name: 'Classification', icon: '📁' },
            { id: 'series', name: 'Series', icon: '🔢' },
            { id: 'coding-decoding', name: 'Coding-Decoding', icon: '🔐' },
            { id: 'blood-relation', name: 'Blood Relation', icon: '👨‍👩‍👧' },
            { id: 'direction', name: 'Direction', icon: '🧭' }
        ],
        English: [
            { id: 'vocab', name: 'Vocabulary', icon: '📖' },
            { id: 'synonyms', name: 'Synonyms', icon: '🔤' },
            { id: 'antonyms', name: 'Antonyms', icon: '🔡' },
            { id: 'idioms', name: 'Idioms & Phrases', icon: '💬' },
            { id: 'error-spotting', name: 'Error Spotting', icon: '🔍' },
            { id: 'fill-blanks', name: 'Fill in the Blanks', icon: '📝' }
        ],
        GK: [
            { id: 'history', name: 'History', icon: '🏛️' },
            { id: 'geography', name: 'Geography', icon: '🌍' },
            { id: 'polity', name: 'Polity', icon: '⚖️' },
            { id: 'economy', name: 'Economy', icon: '💹' },
            { id: 'science', name: 'General Science', icon: '🔬' },
            { id: 'current-affairs', name: 'Current Affairs', icon: '📰' }
        ]
    };

    // ==================== THEME MANAGEMENT ====================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        themeToggle.checked = isDark;
        
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0f172a' : '#6366f1');
        }
    }
    
    themeToggle.addEventListener('change', () => {
        const newTheme = themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // ==================== DISPLAY FUNCTIONS ====================
    function displayTests() {
        gridContainer.style.opacity = '0';

        requestAnimationFrame(() => {
            let html = '';
            
            if (currentTestType === 'shiftwise') {
                const filteredTests = ALL_TESTS.filter(test => 
                    test.exam === currentExam && test.subject === currentSubject && test.testType === 'shiftwise'
                );
                html = filteredTests.map((test, i) => generateShiftwiseCardHTML(test, i)).join('');
            } 
            else if (currentTestType === 'chapterwise') {
                const chapters = CHAPTER_INFO[currentSubject] || [];
                html = chapters.map((chapter, i) => generateChapterCardHTML(chapter, i)).join('');
            } 
            else if (currentTestType === 'fullmock') {
                const mockTestIds = FULLMOCK_TEST_IDS[currentExam] || [];
                const mockTests = mockTestIds.map(id => ALL_TESTS.find(t => t.id === id)).filter(Boolean);
                html = mockTests.map((test, i) => generateFullMockCardHTML(test, i)).join('');
            }

            gridContainer.innerHTML = html || `
                <div class="no-tests-message">
                    <div class="icon">📭</div>
                    <h3>Coming Soon!</h3>
                    <p>Tests will be available soon!</p>
                </div>`;

            requestAnimationFrame(() => {
                gridContainer.style.opacity = '1';
            });
        });
    }

    function generateShiftwiseCardHTML(test, index) {
        const questions = test.questions || 25;
        const time = SUBJECT_DISPLAY_TIMES[test.subject] || 25;
        const maxDelay = Math.min(index * 0.05, 0.4);

        return `
            <article class="test-card" role="listitem" style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                <h3 class="card-title">${test.date} ${test.title}</h3>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Test</a>
            </article>`;
    }

    function generateChapterCardHTML(chapter, index) {
        const testIds = CHAPTER_TEST_IDS[currentSubject]?.[chapter.id] || [];
        const maxDelay = Math.min(index * 0.05, 0.4);
        
        return `
            <article class="chapter-card" role="listitem" style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                <div class="chapter-icon">${chapter.icon}</div>
                <h3 class="chapter-title">${chapter.name}</h3>
                <div class="chapter-stats">
                    <span class="chapter-test-count">${testIds.length} Tests Available</span>
                </div>
                <div class="chapter-tests">
                    ${testIds.map((testId, i) => `
                        <a href="test.html?testId=${testId}" class="chapter-test-link">
                            Test ${i + 1}
                        </a>
                    `).join('')}
                </div>
            </article>`;
    }

    function generateFullMockCardHTML(test, index) {
        const questions = 100; // Full mock has 100 questions
        const time = 60; // 60 minutes for full mock
        const maxDelay = Math.min(index * 0.05, 0.4);

        return `
            <article class="test-card fullmock-card" role="listitem" style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                <div class="fullmock-badge">📝 FULL MOCK</div>
                <h3 class="card-title">Full Mock Test ${index + 1}</h3>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                <div class="subjects-included">
                    📐 Maths | 🧩 Reasoning | ${currentExam !== 'DP' ? '📖 English | ' : ''}🌍 GK
                </div>
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Full Mock</a>
            </article>`;
    }

    function updateTitle() {
        const examNames = {
            'CGL': 'SSC <strong>CGL</strong>',
            'CHSL': 'SSC <strong>CHSL</strong>',
            'CPO': 'SSC <strong>CPO</strong>',
            'DP': '<strong>DP Constable</strong>'
        };
        
        const typeText = {
            'shiftwise': 'Shift-wise Tests',
            'chapterwise': 'Chapter-wise Tests',
            'fullmock': 'Full Mock Tests'
        }[currentTestType];
        
        mainTitle.innerHTML = `${examNames[currentExam]} ${typeText}`;
    }

    function updateSubjectTabs() {
        // Show/hide subject tabs based on test type
        if (currentTestType === 'fullmock') {
            subjectTabs.style.display = 'none';
        } else {
            subjectTabs.style.display = 'flex';
            
            // Hide English for DP exam
            tabs.forEach(tab => {
                const subject = tab.dataset.subject;
                if (currentExam === "DP" && subject === "English") {
                    tab.style.display = "none";
                } else {
                    tab.style.display = "block";
                }
            });

            // Reset to Maths if current subject is hidden
            if (currentExam === "DP" && currentSubject === "English") {
                currentSubject = "Maths";
                tabs.forEach(tab => {
                    const isActive = tab.dataset.subject === "Maths";
                    tab.classList.toggle("active", isActive);
                    tab.setAttribute('aria-selected', isActive);
                });
            }
        }
    }

    function switchTestType(type) {
        currentTestType = type;
        
        // Update buttons
        [btnShiftwise, btnChapterwise, btnFullmock].forEach(btn => {
            const isActive = btn.dataset.type === type;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive);
        });
        
        updateTitle();
        updateSubjectTabs();
        displayTests();
    }

    function switchExam(exam) {
        currentExam = exam;

        [btnCGL, btnCHSL, btnCPO, btnDP].forEach(btn => {
            const isActive = btn.dataset.exam === exam;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive);
        });

        document.body.classList.remove('exam-chsl', 'exam-cpo', 'exam-dp');
        if (exam === 'CHSL') document.body.classList.add('exam-chsl');
        if (exam === 'CPO') document.body.classList.add('exam-cpo');
        if (exam === 'DP') document.body.classList.add('exam-dp');

        updateTitle();
        updateSubjectTabs();
        displayTests();
    }

    // ==================== EVENT LISTENERS ====================
    btnCGL.addEventListener('click', () => switchExam('CGL'));
    btnCHSL.addEventListener('click', () => switchExam('CHSL'));
    btnCPO.addEventListener('click', () => switchExam('CPO'));
    btnDP.addEventListener('click', () => switchExam('DP'));
    
    // Test type switching
    btnShiftwise.addEventListener('click', () => switchTestType('shiftwise'));
    btnChapterwise.addEventListener('click', () => switchTestType('chapterwise'));
    btnFullmock.addEventListener('click', () => switchTestType('fullmock'));

    // Subject tabs
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            currentSubject = tab.dataset.subject;
            displayTests();
        });
    });

    // ==================== INITIAL LOAD ====================
    displayTests();
});
</script>
