    <style>
        /* ============================================
           CSS VARIABLES - Light & Dark Theme
           ============================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;

            html.dark-mode body,
            body.dark-mode {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-card: #1e293b;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: #334155;
    --border-light: #1e293b;
}
            
            /* Brand Colors */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            
            /* Exam Colors */
            --cgl-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --cgl-glow: rgba(99, 102, 241, 0.3);
            
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --chsl-glow: rgba(16, 185, 129, 0.3);
            
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --dp-glow: rgba(245, 158, 11, 0.3);
            
            /* Section Colors */
            --sectional-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --sectional-glow: rgba(99, 102, 241, 0.3);
            
            --fullmock-gradient: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            --fullmock-glow: rgba(245, 158, 11, 0.3);
            
            --chapterwise-gradient: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
            --chapterwise-glow: rgba(16, 185, 129, 0.3);
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15);
            
            /* Spacing & Sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Container */
            --container-max: 1320px;
            --nav-height: 72px;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: #1e293b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
            transition: opacity var(--transition-slow);
        }

        .dark-mode::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent);
        }

        body.exam-chsl::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(16, 185, 129, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(52, 211, 153, 0.06), transparent);
        }

        body.exam-dp::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(245, 158, 11, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(251, 191, 36, 0.06), transparent);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            height: var(--nav-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-normal);
        }

        .dark-mode .top-nav {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: var(--border-color);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform var(--transition-normal);
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .brand-logo {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Theme Switch - defined in style.css */
        .theme-switch {
            position: relative;
            width: 54px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: var(--transition-normal);
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(28px);
        }

        /* Nav Buttons */
        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }

        .login-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .login-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        body.exam-chsl .login-btn {
            color: var(--chsl-color);
            border-color: var(--chsl-color);
        }

        body.exam-chsl .login-btn:hover {
            background: var(--chsl-color);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-chsl .signup-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .main-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 40px 24px 100px;
        }

        /* Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .sub-heading {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub-heading::before,
        .sub-heading::after {
            content: '';
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 1px;
        }

        /* ============================================
           EXAM SELECTOR BUTTONS
           ============================================ */
        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .exam-btn {
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exam-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px var(--cgl-glow);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }
        /* ============================================
   PERFORMANCE OPTIMIZATIONS
   ============================================ */

/* GPU acceleration for animated elements */
.test-card,
.tab,
.section-tab,
.exam-btn,
.attempt-btn {
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
}

/* Reduce repaints on hover */
.test-card {
    contain: layout style paint;
}

/* Faster transitions */
.test-grid-container {
    transition: opacity 0.15s ease-out;
}

/* Optimize card animations - faster */
@keyframes cardFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.test-card {
    animation: cardFadeIn 0.3s ease forwards;
}

/* Theme toggle styles defined in style.css */

.theme-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    transition: border-color 0.15s ease;
    flex-shrink: 0;
}

/* Disable heavy effects on mobile */
@media (max-width: 768px) {
    .test-card::after,
    .attempt-btn::before,
    .card-glow {
        display: none !important;
    }
    
    .test-card {
        will-change: auto;
        animation-duration: 0.2s;
    }
    
    .test-card:hover {
        transform: translateY(-4px);
    }
    
    /* Faster mobile transitions */
    .test-card,
    .tab,
    .section-tab,
    .exam-btn {
        transition-duration: 0.15s;
    }
}

/* Reduce motion for users who prefer it */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    
    .test-card {
        animation: none;
        opacity: 1;
    }
}

/* Content visibility for off-screen cards */
.test-card {
    content-visibility: auto;
    contain-intrinsic-size: 400px;
}

        /* ============================================
           SUBJECT TABS
           ============================================ */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: none;
            background: transparent;
        }

        .tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* Top 100 Tab Special */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .tab.chsl-only:hover {
            transform: translateY(-2px);
        }

        /* ============================================
           SECTION TABS (NEW - Sectional/Full Mock/Chapterwise)
           ============================================ */
        .section-tabs-wrapper {
            margin-bottom: 24px;
        }

        .section-tabs-container {
            display: flex;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .section-tabs-container::-webkit-scrollbar {
            display: none;
        }

        .section-tab {
            flex: 1;
            min-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            position: relative;
        }

        .section-tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .section-tab.active {
            color: white;
            border-color: transparent;
        }

        .section-tab.active[data-section="sectional"] {
            background: var(--sectional-gradient);
            box-shadow: 0 6px 20px var(--sectional-glow);
        }

        .section-tab.active[data-section="fullmock"] {
            background: var(--fullmock-gradient);
            box-shadow: 0 6px 20px var(--fullmock-glow);
        }

        .section-tab.active[data-section="chapterwise"] {
            background: var(--chapterwise-gradient);
            box-shadow: 0 6px 20px var(--chapterwise-glow);
        }

        .section-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .section-text {
            font-weight: 700;
        }

        .section-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }

        .section-tab:not(.active) .section-count {
            background: var(--border-light);
            color: var(--text-muted);
        }

        /* ============================================
           SECTION INFO BANNER
           ============================================ */
        .section-info-banner {
            margin-bottom: 28px;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-info-content {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            border-radius: var(--radius-lg);
            border-left: 5px solid;
        }

        .section-info-banner.section-sectional .section-info-content {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.05));
            border-left-color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-left: 5px solid var(--primary);
        }

        .section-info-banner.section-fullmock .section-info-content {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(249, 115, 22, 0.05));
            border-left-color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-left: 5px solid #f59e0b;
        }

        .section-info-banner.section-chapterwise .section-info-content {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(20, 184, 166, 0.05));
            border-left-color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-left: 5px solid var(--success);
        }

        .section-info-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .section-info-text h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .section-info-text p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }

        /* ============================================
           TEST CARDS GRID
           ============================================ */
        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARD - Premium Design
           ============================================ */
        .test-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card hover glow effect */
        .test-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;

    </header>

    <!-- Exam Selector -->
    <div class="exam-selector" role="tablist" aria-label="Select exam type">
        <button class="exam-btn active" data-exam="CGL" id="btn-cgl" role="tab" aria-selected="true">🎓 SSC CGL</button>
        <button class="exam-btn chsl" data-exam="CHSL" id="btn-chsl" role="tab" aria-selected="false">📘 SSC CHSL</button>
        <button class="exam-btn dp" data-exam="DP" id="btn-dp" role="tab" aria-selected="false">👮 DP Constable</button>
    </div>

    <!-- Subject Tabs -->
    <div class="tabs-container" role="tablist" aria-label="Select subject">
        <button class="tab active" data-subject="Maths" role="tab" aria-selected="true">📐 Maths</button>
        <button class="tab" data-subject="Reasoning" role="tab" aria-selected="false">🧩 Reasoning</button>
        <button class="tab" data-subject="English" role="tab" aria-selected="false">📖 English</button>
        <button class="tab" data-subject="GK" role="tab" aria-selected="false">🌍 GK</button>
        <button class="tab chsl-only" data-subject="Top100Maths" style="display: none;" role="tab" aria-selected="false">🔥 Maths Top 100</button>
    </div>

    <!-- Section Tabs (NEW - Sectional/Full Mock/Chapterwise) -->
    <div class="section-tabs-wrapper">
        <div class="section-tabs-container" role="tablist" aria-label="Select test type">
            <button class="section-tab active" data-section="sectional" role="tab" aria-selected="true">
                <span class="section-icon">📋</span>
                <span class="section-text">Sectional Tests</span>
                <span class="section-count" id="sectional-count">0</span>
            </button>
            <button class="section-tab" data-section="fullmock" role="tab" aria-selected="false">
                <span class="section-icon">📝</span>
                <span class="section-text">Full Mock Tests</span>
                <span class="section-count" id="fullmock-count">0</span>
            </button>
            <button class="section-tab" data-section="chapterwise" role="tab" aria-selected="false">
                <span class="section-icon">📚</span>
                <span class="section-text">Chapterwise Tests</span>
                <span class="section-count" id="chapterwise-count">0</span>
            </button>
        </div>
    </div>

    <!-- Section Info Banner -->
    <div class="section-info-banner section-sectional" id="section-info-banner">
        <div class="section-info-content">
            <span class="section-info-icon" id="section-info-icon">📋</span>
            <div class="section-info-text">
                <h3 id="section-info-title">Sectional Tests</h3>
                <p id="section-info-desc">Practice Subject-wise questions to strengthen your fundamentals</p>
            </div>
        </div>
    </div>

    <!-- Test Cards Grid -->
    <div id="test-grid-container" class="test-grid-container" role="list" aria-label="Available tests"></div>
</main>

<!-- Help Button -->
<button class="help-btn" aria-label="Get help">💬</button>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/tests-list.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // ==================== PERFORMANCE: Apply theme BEFORE paint ====================
    (function() {
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }
    })();

    // DOM Elements - Cache all at once
    const elements = {
        mainTitle: document.getElementById('main-title'),
        gridContainer: document.getElementById('test-grid-container'),
        tabs: document.querySelectorAll('.tab'),
        sectionTabs: document.querySelectorAll('.section-tab'),
        themeToggle: document.getElementById('themeToggle'),
        btnCGL: document.getElementById('btn-cgl'),
        btnCHSL: document.getElementById('btn-chsl'),
        btnDP: document.getElementById('btn-dp'),
        sectionInfoBanner: document.getElementById('section-info-banner'),
        sectionInfoIcon: document.getElementById('section-info-icon'),
        sectionInfoTitle: document.getElementById('section-info-title'),
        sectionInfoDesc: document.getElementById('section-info-desc')
    };

    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';
    let currentSection = 'sectional';
    let historyMap = {};
    let isHistoryLoaded = false;
    
    // ==================== PERFORMANCE: Debounce function ====================
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // ==================== PERFORMANCE: Throttle for scroll events ====================
    function throttle(func, limit) {
        let inThrottle;
        return function(...args) {
            if (!inThrottle) {
                func.apply(this, args);
                inThrottle = true;
                setTimeout(() => inThrottle = false, limit);
            }
        };
    }

    // Configuration
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 25,
        "Top100Maths": 60
    };

    const SECTION_CONFIG = {
        sectional: {
            icon: '📋',
            title: 'Sectional Tests',
            description: 'Practice topic-wise questions to strengthen your fundamentals'
        },
        fullmock: {
            icon: '📝',
            title: 'Full Mock Tests',
            description: 'Complete exam simulation with all subjects and real exam pattern'
        },
        chapterwise: {
            icon: '📚',
            title: 'Chapterwise Tests',
            description: 'Master each chapter with focused practice tests'
        }
    };

    // ==================== THEME MANAGEMENT (Optimized) ====================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        
        // Use requestAnimationFrame to prevent layout thrashing
        requestAnimationFrame(() => {
            document.body.classList.toggle('dark-mode', isDark);
            elements.themeToggle.checked = isDark;
            
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) {
                metaTheme.setAttribute('content', isDark ? '#0f172a' : '#6366f1');
            }
        });
    }
    
    elements.themeToggle.addEventListener('change', () => {
        const newTheme = elements.themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // ==================== DATA VALIDATION ====================
    if (typeof ALL_TESTS === 'undefined' || !Array.isArray(ALL_TESTS)) {
        elements.mainTitle.innerHTML = `Tests are currently <strong>Unavailable</strong>`;
        elements.gridContainer.innerHTML = `
            <div class="no-tests-message">
                <div class="icon">⚠️</div>
                <h3>Data Not Found</h3>
                <p>The test data file is missing or invalid. Please try again later.</p>
            </div>`;
        return;
    }

    // ==================== LOAD USER HISTORY (NON-BLOCKING) ====================
    function loadHistory() {
        if (!window.ExamAxisAPI || !ExamAxisAPI.isLoggedIn()) {
            historyMap = {};
            isHistoryLoaded = true;
            return Promise.resolve();
        }

        return ExamAxisAPI.getTestHistory()
            .then(res => {
                historyMap = {};
                if (res.success && res.data?.attempts) {
                    res.data.attempts.forEach(a => {
                        const key = String(a.testId);
                        const existing = historyMap[key];
                        if (!existing || new Date(a.createdAt) > new Date(existing.createdAt)) {
                            historyMap[key] = a;
                        }
                    });
                }
                isHistoryLoaded = true;
                displayTests();
            })
            .catch(err => {
                console.error('Failed to load history:', err);
                historyMap = {};
                isHistoryLoaded = true;
            });
    }

    // ==================== HELPER FUNCTIONS ====================
    function getFilteredTests(exam, subject, section) {
        if (exam === 'CHSL' && subject === 'Top100Maths') {
            return ALL_TESTS.filter(test => 
                test.exam === 'CHSL_TOP_100_MATHS' && 
                (test.section === section || (!test.section && section === 'sectional'))
            );
        }
        
        return ALL_TESTS.filter(test => {
            const examMatch = test.exam === exam;
            const subjectMatch = (section === 'fullmock' && test.subject === 'All') 
                                 || test.subject === subject;
            const sectionMatch = (test.section === section) || 
                                 (!test.section && section === 'sectional');
            return examMatch && subjectMatch && sectionMatch;
        });
    }

    function getTestCountBySection(exam, subject) {
        const counts = { sectional: 0, fullmock: 0, chapterwise: 0 };

        if (exam === 'CHSL' && subject === 'Top100Maths') {
            ALL_TESTS.filter(test => test.exam === 'CHSL_TOP_100_MATHS').forEach(test => {
                const section = test.section || 'sectional';
                if (counts[section] !== undefined) counts[section]++;
            });
        } else {
            ALL_TESTS.filter(test => {
                const examMatch = test.exam === exam;
                const subjectMatch = (test.section === 'fullmock' && test.subject === 'All') 
                                     || test.subject === subject;
                return examMatch && subjectMatch;
            }).forEach(test => {
                const section = test.section || 'sectional';
                if (counts[section] !== undefined) counts[section]++;
            });
        }

        return counts;
    }

    function updateSectionCounts() {
        const counts = getTestCountBySection(currentExam, currentSubject);
        document.getElementById('sectional-count').textContent = counts.sectional;
        document.getElementById('fullmock-count').textContent = counts.fullmock;
        document.getElementById('chapterwise-count').textContent = counts.chapterwise;
    }

    function updateSectionInfoBanner() {
        const config = SECTION_CONFIG[currentSection];
        elements.sectionInfoIcon.textContent = config.icon;
        elements.sectionInfoTitle.textContent = config.title;
        elements.sectionInfoDesc.textContent = config.description;
        elements.sectionInfoBanner.className = `section-info-banner section-${currentSection}`;
    }

    // ==================== PERFORMANCE: Use DocumentFragment for batch DOM updates ====================
    function generateCardHTML(test, index) {
        const fullTitle = test.date ? `${test.date} ${test.title}` : test.title;
        const questions = test.questions || 25;
        
        let time;
        if (currentSection === 'fullmock') {
            time = 60;
        } else if (test.exam === 'CHSL_TOP_100_MATHS') {
            time = 60;
        } else {
            time = SUBJECT_DISPLAY_TIMES[test.subject] || SUBJECT_DISPLAY_TIMES["General"];
        }
        
        const attempt = historyMap[String(test.id)];
        
        const badges = [];
        if (test.isNew) badges.push('<div class="new-badge">✨ NEW</div>');
        if (test.exam === 'CHSL_TOP_100_MATHS') badges.push('<div class="top100-badge">🔥 TOP 100</div>');
        if (attempt && isHistoryLoaded) badges.push('<div class="attempted-badge">Attempted</div>');
        
        if (currentSection === 'chapterwise' && test.chapter) {
            badges.push(`<div class="chapter-badge">📖 ${test.chapter}</div>`);
        }

        const lastScoreHtml = isHistoryLoaded 
            ? (attempt
                ? `<div class="last-score">Last score: <strong>${attempt.score}/${attempt.maxScore}</strong></div>`
                : `<div class="last-score not-attempted">Not attempted yet</div>`)
            : `<div class="last-score" style="background: transparent; border: none; color: var(--text-muted);">Loading history...</div>`;

        // Limit animation delay to max 0.3s for faster perceived load
        const maxDelay = Math.min(index * 0.03, 0.3);

        const cardClasses = [
            'test-card',
            test.exam === 'CHSL_TOP_100_MATHS' ? 'top100-card' : '',
            `section-${currentSection}-card`
        ].filter(Boolean).join(' ');

        return `
            <article class="${cardClasses}" 
                     role="listitem" 
                     style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                ${badges.join('')}
                <h3 class="card-title">${fullTitle}</h3>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                ${lastScoreHtml}
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Test</a>
            </article>`;
    }

    // ==================== PERFORMANCE: Optimized displayTests ====================
    const displayTests = debounce(function() {
        const filteredTests = getFilteredTests(currentExam, currentSubject, currentSection);
        
        updateSectionCounts();
        updateSectionInfoBanner();
        
        // Use requestAnimationFrame for smooth rendering
        requestAnimationFrame(() => {
            elements.gridContainer.style.opacity = '0';
            
            requestAnimationFrame(() => {
                if (filteredTests.length > 0) {
                    let html = '';
                    
                    if (currentSubject === 'Top100Maths') {
                        html += `
                            <div class="section-header top100-header">
                                <h2>🔥 MATHS TOP 100 - 2025</h2>
                                <p>Master the most important 100 questions for SSC CHSL 2025</p>
                            </div>`;
                    }
                    
                    // Build HTML string (faster than multiple DOM operations)
                    html += filteredTests.map((test, i) => generateCardHTML(test, i)).join('');
                    elements.gridContainer.innerHTML = html;
                } else {
                    const sectionName = SECTION_CONFIG[currentSection].title;
                    const sectionIcon = SECTION_CONFIG[currentSection].icon;
                    
                    let message;
                    if (currentSubject === 'Top100Maths') {
                        message = `<div class="no-tests-message">
                            <div class="icon">🔥</div>
                            <h3>Maths Top 100 - Coming Soon!</h3>
                            <p>Top 100 most important Maths questions for SSC CHSL 2025 will be available soon!</p>
                        </div>`;
                    } else if (currentSection === 'fullmock') {
                        message = `<div class="no-tests-message section-fullmock">
                            <div class="icon">${sectionIcon}</div>
                            <h3>Full Mock Tests Coming Soon!</h3>
                            <p>Complete exam simulations for SSC ${currentExam} ${currentSubject} are being prepared.</p>
                            <div class="coming-soon-features">
                                <span>✓ Real exam pattern</span>
                                <span>✓ Timed sessions</span>
                                <span>✓ Detailed analysis</span>
                            </div>
                        </div>`;
                    } else if (currentSection === 'chapterwise') {
                        message = `<div class="no-tests-message section-chapterwise">
                            <div class="icon">${sectionIcon}</div>
                            <h3>Chapterwise Tests Coming Soon!</h3>
                            <p>Master each chapter of ${currentSubject} with focused practice.</p>
                            <div class="coming-soon-features">
                                <span>✓ Topic-wise practice</span>
                                <span>✓ Difficulty levels</span>
                                <span>✓ Progress tracking</span>
                            </div>
                        </div>`;
                    } else {
                        message = `<div class="no-tests-message">
                            <div class="icon">📭</div>
                            <h3>Coming Soon!</h3>
                            <p>No ${currentSubject} ${sectionName.toLowerCase()} for SSC ${currentExam} yet. Check back soon!</p>
                        </div>`;
                    }
                    elements.gridContainer.innerHTML = message;
                }

                // Fade in
                requestAnimationFrame(() => {
                    elements.gridContainer.style.opacity = '1';
                });
            });
        });
    }, 50); // 50ms debounce

    function updateTabsForExam(exam) {
        elements.tabs.forEach(tab => {
            const subject = tab.dataset.subject;
            
            if (exam === "DP" && subject === "English") {
                tab.style.display = "none";
            } else if (subject === "Top100Maths") {
                tab.style.display = exam === "CHSL" ? "block" : "none";
            } else {
                tab.style.display = "block";
            }
        });

        if ((exam === "DP" && currentSubject === "English") || 
            (exam !== "CHSL" && currentSubject === "Top100Maths")) {
            currentSubject = "Maths";
            elements.tabs.forEach(tab => {
                const isActive = tab.dataset.subject === "Maths";
                tab.classList.toggle("active", isActive);
                tab.setAttribute('aria-selected', isActive);
            });
        }
    }

    function switchExam(exam) {
        if (currentExam === exam) return; // Prevent unnecessary updates
        
        currentExam = exam;

        [elements.btnCGL, elements.btnCHSL, elements.btnDP].forEach(btn => {
            const isActive = btn.dataset.exam === exam;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive);
        });

        document.body.classList.remove('exam-chsl', 'exam-dp');
        
        const titles = {
            'CGL': 'SSC <strong>CGL</strong> Mock Tests',
            'CHSL': 'SSC <strong>CHSL</strong> Mock Tests',
            'DP': '<strong>DP Constable</strong> Mock Tests'
        };

        elements.mainTitle.innerHTML = titles[exam];

        if (exam === 'CHSL') document.body.classList.add('exam-chsl');
        if (exam === 'DP') document.body.classList.add('exam-dp');

        updateTabsForExam(exam);
        displayTests();
    }

    function switchSection(section) {
        if (currentSection === section) return; // Prevent unnecessary updates
        
        currentSection = section;
        
        elements.sectionTabs.forEach(tab => {
            const isActive = tab.dataset.section === section;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', isActive);
        });
        
        displayTests();
    }

    // ==================== EVENT LISTENERS (Optimized) ====================
    elements.btnCGL.addEventListener('click', () => switchExam('CGL'));
    elements.btnCHSL.addEventListener('click', () => switchExam('CHSL'));
    elements.btnDP.addEventListener('click', () => switchExam('DP'));

    elements.tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            if (tab.classList.contains('active')) return; // Prevent unnecessary updates
            
            elements.tabs.forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            currentSubject = tab.dataset.subject;
            displayTests();
        });
    });

    elements.sectionTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            switchSection(tab.dataset.section);
        });
    });

    // Keyboard navigation
    document.querySelectorAll('[role="tablist"]').forEach(tablist => {
        tablist.addEventListener('keydown', (e) => {
            const tabs = [...tablist.querySelectorAll('[role="tab"]:not([style*="display: none"])')];
            const currentIndex = tabs.indexOf(document.activeElement);
            
            let newIndex;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                newIndex = (currentIndex + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            } else if (e.key === 'Home') {
                newIndex = 0;
            } else if (e.key === 'End') {
                newIndex = tabs.length - 1;
            } else {
                return;
            }
            
            e.preventDefault();
            tabs[newIndex].focus();
            tabs[newIndex].click();
        });
    });

    // ==================== INITIAL LOAD ====================
    displayTests();
    
    // Load history in background (non-blocking)
    requestIdleCallback ? requestIdleCallback(loadHistory) : setTimeout(loadHistory, 100);
    
    if (window.updateNavigation) {
        updateNavigation();
    }
});
</script>

</body>
</html>
