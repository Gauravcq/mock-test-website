<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Exam-Axis - Professional SSC Mock Tests for CGL, CHSL, CPO, and more preparation">
    <meta name="theme-color" content="#6366f1">
    <title>Exam-Axis | SSC Mock Tests - Complete Preparation Portal</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CSS VARIABLES - Light & Dark Theme
           ============================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            
            /* Brand Colors */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            
            /* Exam Colors */
            --cgl-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --cgl-glow: rgba(99, 102, 241, 0.3);
            
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --chsl-glow: rgba(16, 185, 129, 0.3);
            
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --dp-glow: rgba(245, 158, 11, 0.3);
            
            /* New Exam Colors */
            --cpo-color: #dc2626;
            --cpo-gradient: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            --cpo-glow: rgba(220, 38, 38, 0.3);
            
            --extra-color: #7c3aed;
            --extra-gradient: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
            --extra-glow: rgba(124, 58, 237, 0.3);
            
            --phase-color: #0891b2;
            --phase-gradient: linear-gradient(135deg, #0891b2 0%, #22d3ee 100%);
            --phase-glow: rgba(8, 145, 178, 0.3);
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15);
            
            /* Spacing & Sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Container */
            --container-max: 1320px;
            --nav-height: 72px;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: #1e293b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
            transition: opacity var(--transition-slow);
        }

        .dark-mode::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent);
        }

        /* Exam-specific backgrounds */
        body.exam-chsl::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(16, 185, 129, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(52, 211, 153, 0.06), transparent);
        }

        body.exam-dp::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(245, 158, 11, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(251, 191, 36, 0.06), transparent);
        }

        body.exam-cpo::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(220, 38, 38, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(239, 68, 68, 0.06), transparent);
        }

        body.exam-extra::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(124, 58, 237, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(167, 139, 250, 0.06), transparent);
        }

        body.exam-phase::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(8, 145, 178, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(34, 211, 238, 0.06), transparent);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================
           NAVIGATION BAR - Enhanced Mobile Responsive
           ============================================ */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            min-height: var(--nav-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-normal);
            flex-wrap: wrap;
        }

        .dark-mode .top-nav {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: var(--border-color);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform var(--transition-normal);
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        /* Dynamic brand logo colors */
        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .brand-logo {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .brand-logo {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-extra .brand-logo {
            background: var(--extra-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-phase .brand-logo {
            background: var(--phase-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Theme Switch - Enhanced Alignment */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            transition: all var(--transition-normal);
            white-space: nowrap;
        }

        .theme-switch-wrapper:hover {
            border-color: var(--primary);
        }

        .theme-switch-wrapper span {
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: transform var(--transition-normal);
            user-select: none;
        }

        .theme-switch-wrapper:hover span:first-of-type {
            transform: rotate(-15deg) scale(1.1);
        }

        .theme-switch-wrapper:hover span:last-of-type {
            transform: rotate(15deg) scale(1.1);
        }

        .theme-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: var(--transition-normal);
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(20px);
        }

        /* Nav Buttons */
        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            white-space: nowrap;
        }

        .login-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .login-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        /* Dynamic button colors */
        body.exam-cpo .signup-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-extra .signup-btn {
            background: var(--extra-gradient);
            box-shadow: 0 4px 12px var(--extra-glow);
        }

        body.exam-phase .signup-btn {
            background: var(--phase-gradient);
            box-shadow: 0 4px 12px var(--phase-glow);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .main-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 40px 24px 100px;
        }

        /* Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Dynamic title colors */
        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .header-title-section strong {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-extra .header-title-section strong {
            background: var(--extra-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-phase .header-title-section strong {
            background: var(--phase-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .sub-heading {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub-heading::before,
        .sub-heading::after {
            content: '';
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 1px;
        }

        /* ============================================
           EXAM SELECTOR BUTTONS - Enhanced
           ============================================ */
        .exam-selector-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .exam-selector-label {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .exam-btn {
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .exam-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .exam-btn:hover::before {
            left: 100%;
        }

        .exam-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px var(--cgl-glow);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        .exam-btn.active.cpo {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 24px var(--cpo-glow);
        }

        .exam-btn.active.extra {
            background: var(--extra-gradient);
            box-shadow: 0 8px 24px var(--extra-glow);
        }

        .exam-btn.active.phase {
            background: var(--phase-gradient);
            box-shadow: 0 8px 24px var(--phase-glow);
        }

        /* Exam button badges */
        .exam-btn-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--error);
            color: white;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            animation: badgePulse 2s ease-in-out infinite;
        }

        /* ============================================
           SUBJECT TABS - Enhanced
           ============================================ */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 36px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: none;
            background: transparent;
            position: relative;
        }

        .tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        /* Dynamic tab colors */
        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        body.exam-cpo .tab.active {
            background: var(--cpo-gradient);
            box-shadow: 0 4px 12px var(--cpo-glow);
        }

        body.exam-extra .tab.active {
            background: var(--extra-gradient);
            box-shadow: 0 4px 12px var(--extra-glow);
        }

        body.exam-phase .tab.active {
            background: var(--phase-gradient);
            box-shadow: 0 4px 12px var(--phase-glow);
        }

        /* Special tabs */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .tab.chsl-only:hover {
            transform: translateY(-2px);
        }

        /* Phase-specific tab */
        .tab.phase-special {
            background: linear-gradient(135deg, #0891b2, #22d3ee);
            color: white;
        }

        /* ============================================
           TEST CARDS GRID
           ============================================ */
        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARD - Premium Design
           ============================================ */
        .test-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card hover glow effect */
        .test-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        /* Dynamic card border colors */
        body.exam-chsl .test-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-dp .test-card::before {
            background: var(--dp-gradient);
        }

        body.exam-cpo .test-card::before {
            background: var(--cpo-gradient);
        }

        body.exam-extra .test-card::before {
            background: var(--extra-gradient);
        }

        body.exam-phase .test-card::before {
            background: var(--phase-gradient);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .test-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .test-card:hover::after {
            left: 125%;
        }

        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--cgl-glow);
            border-color: transparent;
        }

        /* Dynamic card hover shadows */
        body.exam-chsl .test-card:hover {
            box-shadow: 0 20px 40px var(--chsl-glow);
        }

        body.exam-dp .test-card:hover {
            box-shadow: 0 20px 40px var(--dp-glow);
        }

        body.exam-cpo .test-card:hover {
            box-shadow: 0 20px 40px var(--cpo-glow);
        }

        body.exam-extra .test-card:hover {
            box-shadow: 0 20px 40px var(--extra-glow);
        }

        body.exam-phase .test-card:hover {
            box-shadow: 0 20px 40px var(--phase-glow);
        }

        /* Card Glow Background */
        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity var(--transition-normal);
            pointer-events: none;
            z-index: -1;
        }

        .test-card:hover .card-glow {
            opacity: 0.5;
        }

        /* Badges */
        .new-badge, .attempted-badge, .top100-badge, .phase-badge {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 10;
        }

        .new-badge {
            right: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .attempted-badge {
            right: 16px;
            background: var(--success);
            color: white;
        }

        .attempted-badge::before {
            content: "✓ ";
        }

        .top100-badge {
            left: 16px;
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: white;
        }

        .phase-badge {
            left: 16px;
            background: var(--phase-gradient);
            color: white;
        }

        /* Card Title */
        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin: 12px 0 20px;
            color: var(--text-primary);
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .test-card hr {
            width: 50%;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 0 auto 24px;
            opacity: 0.3;
        }

        /* Dynamic hr colors */
        body.exam-chsl .test-card hr {
            background: linear-gradient(90deg, transparent, var(--chsl-color), transparent);
        }

        body.exam-cpo .test-card hr {
            background: linear-gradient(90deg, transparent, var(--cpo-color), transparent);
        }

        body.exam-extra .test-card hr {
            background: linear-gradient(90deg, transparent, var(--extra-color), transparent);
        }

        body.exam-phase .test-card hr {
            background: linear-gradient(90deg, transparent, var(--phase-color), transparent);
        }

        /* Stats Grid */
        .card-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            flex: 1;
            max-width: 90px;
            padding: 14px 8px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.04));
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
            transition: all var(--transition-normal);
        }

        /* Dynamic stat item colors */
        body.exam-chsl .stat-item {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(52, 211, 153, 0.04));
            border-color: rgba(16, 185, 129, 0.1);
        }

        body.exam-dp .stat-item {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.04));
            border-color: rgba(245, 158, 11, 0.1);
        }

        body.exam-cpo .stat-item {
            background: linear-gradient(145deg, rgba(220, 38, 38, 0.08), rgba(239, 68, 68, 0.04));
            border-color: rgba(220, 38, 38, 0.1);
        }

        body.exam-extra .stat-item {
            background: linear-gradient(145deg, rgba(124, 58, 237, 0.08), rgba(167, 139, 250, 0.04));
            border-color: rgba(124, 58, 237, 0.1);
        }

        body.exam-phase .stat-item {
            background: linear-gradient(145deg, rgba(8, 145, 178, 0.08), rgba(34, 211, 238, 0.04));
            border-color: rgba(8, 145, 178, 0.1);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-item .value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        /* Dynamic stat value colors */
        body.exam-chsl .stat-item .value {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .stat-item .value {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .stat-item .value {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-extra .stat-item .value {
            background: var(--extra-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-phase .stat-item .value {
            background: var(--phase-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Last Score */
        .last-score {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 10px 18px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .last-score::before {
            content: "📊";
        }

        .last-score.not-attempted {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.15);
        }

        .last-score.not-attempted::before {
            content: "📝";
        }

        /* Attempt Button */
        .attempt-btn {
            background: var(--cgl-gradient);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            max-width: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition-normal);
            box-shadow: 0 8px 20px var(--cgl-glow);
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .attempt-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }

        .attempt-btn:hover::before {
            left: 100%;
        }

        .attempt-btn::after {
            content: "→";
            font-size: 1.1rem;
            transition: transform var(--transition-normal);
        }

        .attempt-btn:hover::after {
            transform: translateX(4px);
        }

        .attempt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px var(--cgl-glow);
        }

        /* Dynamic attempt button colors */
        body.exam-chsl .attempt-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 20px var(--chsl-glow);
        }

        body.exam-chsl .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--chsl-glow);
        }

        body.exam-dp .attempt-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 20px var(--dp-glow);
        }

        body.exam-dp .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--dp-glow);
        }

        body.exam-cpo .attempt-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 20px var(--cpo-glow);
        }

        body.exam-cpo .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--cpo-glow);
        }

        body.exam-extra .attempt-btn {
            background: var(--extra-gradient);
            box-shadow: 0 8px 20px var(--extra-glow);
        }

        body.exam-extra .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--extra-glow);
        }

        body.exam-phase .attempt-btn {
            background: var(--phase-gradient);
            box-shadow: 0 8px 20px var(--phase-glow);
        }

        body.exam-phase .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--phase-glow);
        }

        /* ============================================
           NO TESTS MESSAGE
           ============================================ */
        .no-tests-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 2px dashed var(--border-color);
        }

        .no-tests-message .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .no-tests-message h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .no-tests-message p {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ============================================
           SPECIAL SECTION HEADERS
           ============================================ */
        .section-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 36px;
            border-radius: var(--radius-xl);
            color: white;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }

        .section-header.top100-header {
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 12px 32px rgba(249, 115, 22, 0.3);
        }

        .section-header.cpo-header {
            background: var(--cpo-gradient);
            box-shadow: 0 12px 32px var(--cpo-glow);
        }

        .section-header.extra-header {
            background: var(--extra-gradient);
            box-shadow: 0 12px 32px var(--extra-glow);
        }

        .section-header.phase-header {
            background: var(--phase-gradient);
            box-shadow: 0 12px 32px var(--phase-glow);
        }

        .section-header::before {
            content: attr(data-icon);
            position: absolute;
            font-size: 8rem;
            opacity: 0.15;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
        }

        .section-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .section-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        /* Phase Information Cards */
        .phase-info-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .phase-info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            transition: all var(--transition-normal);
        }

        .phase-info-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--phase-color);
        }

        .phase-info-card .phase-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--phase-gradient);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .phase-info-card h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .phase-info-card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0;
        }

        /* ============================================
           HELP BUTTON
           ============================================ */
        .help-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            background: var(--cgl-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--cgl-glow);
            transition: all var(--transition-normal);
            z-index: 999;
            border: none;
        }

        .help-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 32px var(--cgl-glow);
        }

        /* Dynamic help button colors */
        body.exam-chsl .help-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        body.exam-dp .help-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        body.exam-cpo .help-btn {
            background: var(--cpo-gradient);
            box-shadow: 0 8px 24px var(--cpo-glow);
        }

        body.exam-extra .help-btn {
            background: var(--extra-gradient);
            box-shadow: 0 8px 24px var(--extra-glow);
        }

        body.exam-phase .help-btn {
            background: var(--phase-gradient);
            box-shadow: 0 8px 24px var(--phase-glow);
        }

        /* Footer decoration */
        .footer-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--cgl-gradient);
            z-index: 100;
        }

        /* Dynamic footer colors */
        body.exam-chsl .footer-decoration {
            background: var(--chsl-gradient);
        }

        body.exam-dp .footer-decoration {
            background: var(--dp-gradient);
        }

        body.exam-cpo .footer-decoration {
            background: var(--cpo-gradient);
        }

        body.exam-extra .footer-decoration {
            background: var(--extra-gradient);
        }

        body.exam-phase .footer-decoration {
            background: var(--phase-gradient);
        }

        /* ============================================
           ENHANCED RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1200px) {
            .exam-selector {
                padding: 0 16px;
            }
        }

        @media (max-width: 1024px) {
            .main-container {
                padding: 32px 20px 80px;
            }

            .test-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }

            .exam-btn {
                padding: 12px 20px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 768px) {
            /* Navigation improvements */
            .top-nav {
                padding: 12px 16px;
                min-height: auto;
            }

            .brand-logo {
                font-size: 1.25rem;
            }

            .brand-logo::before {
                font-size: 1.1rem;
            }

            .nav-right {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
                width: 100%;
                margin-top: 8px;
            }

            /* Theme switch mobile optimization */
            .theme-switch-wrapper {

            }

            .theme-switch-wrapper span {

            }

            .theme-switch {

            }

            .slider::before {

                width: 14px;
                left: 2px;

            }

            input:checked + .slider::before {

            }

            .nav-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }

            /* Main content adjustments */
            .main-container {
                padding: 24px 16px 80px;
            }

            .header-container {

            }

            .sub-heading {

            }

            .sub-heading::before,
            .sub-heading::after {

            }

            /* Exam selector mobile */
            .exam-selector-wrapper {
                gap: 12px;
                margin-bottom: 24px;
            }

            .exam-selector {
                gap: 8px;
                padding: 0 8px;
            }

            .exam-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
                flex: 1;
                min-width: 0;
                justify-content: center;
            }

            .exam-btn-badge {
                top: -6px;

            /* Tabs mobile optimization */
            .tabs-container {

            }

            .tab {
                padding: 10px 16px;

            }

            /* Test grid mobile */
            .test-grid-container {
                grid-template-columns: 1fr;

            }

            .test-card {

            }

            .card-title {

            }

                padding: 12px 6px;
            }

            .stat-item .value {
                font-size: 1.3rem;
            }

            .stat-item .label {
                font-size: 0.6rem;
            }

            .attempt-btn {
                padding: 12px 32px;
                font-size: 0.9rem;
            }

            /* Section headers mobile */
            .section-header {
                padding: 28px 20px;
            }

            .section-header h2 {
                font-size: 1.4rem;
            }

            .section-header p {
                font-size: 0.9rem;
            }

            .section-header::before {
                font-size: 5rem;
                right: 10px;
            }

            /* Phase info mobile */
            .phase-info-grid {
                grid-template-columns: 1fr;

            /* Help button mobile */
            .help-btn {
                width: 50px;

                font-size: 20px;

        }

        @media (max-width: 480px) {

            }

            .brand-logo {
                font-size: 1.1rem;
            }

            }

            .sub-heading {
                font-size: 0.85rem;

            .exam-btn {
                padding: 9px 12px;

            /* Test card ultra-mobile */
            .test-card {
                padding: 20px 16px;
            }

                font-size: 0.95rem;
                margin: 10px 0 16px;
            }

            .card-stats {
                gap: 8px;
            }

            .stat-item {
                padding: 10px 4px;
            }

            .stat-item .value {
                font-size: 1.2rem;
            }

            .stat-item .label {
                font-size: 0.55rem;
                letter-spacing: 0.5px;
            }

                font-size: 0.8rem;

        /* Small device landscape mode */
        @media (max-width: 768px) and (orientation: landscape) {
            .top-nav {
                padding: 8px 16px;
            }

            .main-container {
                padding: 20px 16px 60px;
            }

            .header-container {
                margin-bottom: 20px;
            }

            .exam-selector-wrapper {
                margin-bottom: 20px;
            }

            .tabs-container {
                margin-bottom: 20px;
            }
        }

        /* ============================================
           PERFORMANCE OPTIMIZATIONS
           ============================================ */
        /* Reduce animations on mobile for better performance */
        @media (max-width: 768px) {
            .test-card::after,
            .attempt-btn::before,
            .exam-btn::before {
                display: none;
            }

            .test-card:hover {
                transform: translateY(-4px);
            }

            @keyframes cardFadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Disable hover effects on touch devices */
            @media (hover: none) {
                .test-card:hover {
                    transform: none;
                }

                .exam-btn:hover,
                .tab:hover {
                    transform: none;
                }
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .test-card {
                border-width: 2px;
            }

            .tab.active,
            .exam-btn.active {
                outline: 2px solid white;
                outline-offset: 2px;
            }
        }

        /* Focus visible for keyboard navigation */
        .exam-btn:focus-visible,
        .tab:focus-visible,
        .attempt-btn:focus-visible,
        .nav-btn:focus-visible,
        .help-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        /* Touch-friendly tap targets */
        @media (pointer: coarse) {
            .exam-btn,
            .tab,
            .nav-btn {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Print styles */
        @media print {
            .top-nav,
            .help-btn,
            .footer-decoration,
            .theme-switch-wrapper {
                display: none !important;
            }

            body::before {
                display: none;
            }

            .test-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
            }

            .exam-selector,
            .tabs-container {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Footer decoration line -->
<div class="footer-decoration"></div>

<!-- Navigation Bar -->
<nav class="top-nav">
    <a href="#" class="brand-logo">EXAM-AXIS</a>
    <div class="nav-right">
        <div class="theme-switch-wrapper">
            <span>☀️</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                <span class="slider"></span>
            </label>
            <span>🌙</span>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login-btn">Login</a>
            <a href="signup.html" class="nav-btn signup-btn">Create Account</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="main-container">
    <!-- Header Section -->
    <header class="header-container">
        <div class="header-title-section">
            <h1 id="main-title">SSC <strong>CGL</strong> Mock Tests</h1>
            <p class="sub-heading">Assess Your Preparation: Start a Test Now</p>
        </div>
    </header>

    <!-- Exam Selector with New Sections -->
    <div class="exam-selector-wrapper">
        <div class="exam-selector-label">Main Exams</div>
        <div class="exam-selector" role="tablist" aria-label="Select exam type">
            <button class="exam-btn active" data-exam="CGL" id="btn-cgl" role="tab" aria-selected="true">🎓 SSC CGL</button>
            <button class="exam-btn chsl" data-exam="CHSL" id="btn-chsl" role="tab" aria-selected="false">📘 SSC CHSL</button>
            <button class="exam-btn cpo" data-exam="CPO" id="btn-cpo" role="tab" aria-selected="false">👮 SSC CPO<span class="exam-btn-badge">NEW</span></button>
        </div>
        
        <div class="exam-selector-label">Additional Tests</div>
        <div class="exam-selector" role="tablist" aria-label="Select additional exam type">
            <button class="exam-btn dp" data-exam="DP" id="btn-dp" role="tab" aria-selected="false">🚔 DP Constable</button>
            <button class="exam-btn extra" data-exam="EXTRA" id="btn-extra" role="tab" aria-selected="false">⭐ Extra Tests</button>
            <button class="exam-btn phase" data-exam="PHASE" id="btn-phase" role="tab" aria-selected="false">📋 SSC Phase<span class="exam-btn-badge">HOT</span></button>
        </div>
    </div>

    <!-- Subject Tabs -->
    <div class="tabs-container" role="tablist" aria-label="Select subject">
        <button class="tab active" data-subject="Maths" role="tab" aria-selected="true">📐 Maths</button>
        <button class="tab" data-subject="Reasoning" role="tab" aria-selected="false">🧩 Reasoning</button>
        <button class="tab" data-subject="English" role="tab" aria-selected="false">📖 English</button>
        <button class="tab" data-subject="GK" role="tab" aria-selected="false">🌍 GK</button>
        <button class="tab chsl-only" data-subject="Top100Maths" style="display: none;" role="tab" aria-selected="false">🔥 Maths Top 100</button>
        <button class="tab phase-special" data-subject="PhaseI" style="display: none;" role="tab" aria-selected="false">1️⃣ Phase I</button>
        <button class="tab phase-special" data-subject="PhaseII" style="display: none;" role="tab" aria-selected="false">2️⃣ Phase II</button>
    </div>

    <!-- Test Cards Grid -->
    <div id="test-grid-container" class="test-grid-container" role="list" aria-label="Available tests"></div>
</main>

<!-- Help Button -->
<button class="help-btn" aria-label="Get help">💬</button>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/tests-list.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // DOM Elements
    const mainTitle = document.getElementById('main-title');
    const gridContainer = document.getElementById('test-grid-container');
    const tabs = document.querySelectorAll('.tab');
    const themeToggle = document.getElementById('theme-toggle');
    const btnCGL = document.getElementById('btn-cgl');
    const btnCHSL = document.getElementById('btn-chsl');
    const btnDP = document.getElementById('btn-dp');
    const btnCPO = document.getElementById('btn-cpo');
    const btnExtra = document.getElementById('btn-extra');
    const btnPhase = document.getElementById('btn-phase');

    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';
    let historyMap = {};

    // Configuration
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 25,
        "Top100Maths": 60,
        "PhaseI": 60,
        "PhaseII": 90
    };

    // Extended test data for new sections
    const EXTRA_TESTS_DATA = [
        { id: 'extra_1', exam: 'EXTRA', subject: 'Maths', title: 'Advanced Mathematics', date: '2024', questions: 30, isNew: true },
        { id: 'extra_2', exam: 'EXTRA', subject: 'Reasoning', title: 'Logical Puzzles', date: '2024', questions: 25, isNew: true },
        { id: 'extra_3', exam: 'EXTRA', subject: 'English', title: 'Vocabulary Builder', date: '2024', questions: 40 },
        { id: 'extra_4', exam: 'EXTRA', subject: 'GK', title: 'Current Affairs Special', date: '2024', questions: 50, isNew: true }
    ];

    const CPO_TESTS_DATA = [
        { id: 'cpo_1', exam: 'CPO', subject: 'Maths', title: 'CPO Paper I - Quantitative', date: '2024', questions: 25, isNew: true },
        { id: 'cpo_2', exam: 'CPO', subject: 'Reasoning', title: 'CPO Paper I - Reasoning', date: '2024', questions: 25, isNew: true },
        { id: 'cpo_3', exam: 'CPO', subject: 'English', title: 'CPO Paper II', date: '2024', questions: 200 },
        { id: 'cpo_4', exam: 'CPO', subject: 'GK', title: 'CPO General Knowledge', date: '2024', questions: 25, isNew: true }
    ];

    const PHASE_TESTS_DATA = [
        { id: 'phase_1', exam: 'PHASE', subject: 'PhaseI', title: 'Preliminary Test', date: '2024', questions: 100, isPhase: true },
        { id: 'phase_2', exam: 'PHASE', subject: 'PhaseII', title: 'Mains Examination', date: '2024', questions: 200, isPhase: true },
        { id: 'phase_3', exam: 'PHASE', subject: 'Maths', title: 'Phase III - Skill Test', date: '2024', questions: 50 },
        { id: 'phase_4', exam: 'PHASE', subject: 'English', title: 'Typing Speed Test', date: '2024', questions: 1, isPhase: true }
    ];

    // Merge all test data
    const ALL_EXTENDED_TESTS = [
        ...(typeof ALL_TESTS !== 'undefined' ? ALL_TESTS : []),
        ...EXTRA_TESTS_DATA,
        ...CPO_TESTS_DATA,
        ...PHASE_TESTS_DATA
    ];

    // ==================== THEME MANAGEMENT ====================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        themeToggle.checked = isDark;
        
        // Update meta theme color
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0f172a' : '#6366f1');
        }
    }
    
    themeToggle.addEventListener('change', () => {
        const newTheme = themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    // Initialize theme
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            applyTheme(e.matches ? 'dark' : 'light');
        }
    });

    // ==================== LOAD USER HISTORY ====================
    async function loadHistory() {
        if (!window.ExamAxisAPI || !ExamAxisAPI.isLoggedIn()) {
            historyMap = {};
            return;
        }

        try {
            const res = await ExamAxisAPI.getTestHistory();
            historyMap = {};

            if (res.success && res.data?.attempts) {
                res.data.attempts.forEach(a => {
                    const key = String(a.testId);
                    const existing = historyMap[key];
                    if (!existing || new Date(a.createdAt) > new Date(existing.createdAt)) {
                        historyMap[key] = a;
                    }
                });
            }
        } catch (err) {
            console.error('Failed to load history:', err);
            historyMap = {};
        }
    }

    // ==================== HELPER FUNCTIONS ====================
    function getFilteredTests(exam, subject) {
        if (exam === 'CHSL' && subject === 'Top100Maths') {
            return ALL_EXTENDED_TESTS.filter(test => test.exam === 'CHSL_TOP_100_MATHS');
        }
        return ALL_EXTENDED_TESTS.filter(test => test.exam === exam && test.subject === subject);
    }

    function generateCardHTML(test, index) {
        const fullTitle = `${test.date} ${test.title}`;
        const questions = test.questions || 25;
        const time = test.exam === 'CHSL_TOP_100_MATHS' ? 60 : 
            (SUBJECT_DISPLAY_TIMES[test.subject] || SUBJECT_DISPLAY_TIMES["General"]);
        
        const attempt = historyMap[String(test.id)];
        
        const badges = [];
        if (test.isNew) badges.push('<div class="new-badge">✨ NEW</div>');
        if (test.exam === 'CHSL_TOP_100_MATHS') badges.push('<div class="top100-badge">🔥 TOP 100</div>');
        if (test.isPhase) badges.push('<div class="phase-badge">📋 PHASE</div>');
        if (attempt) badges.push('<div class="attempted-badge">Attempted</div>');

        const lastScoreHtml = attempt
            ? `<div class="last-score">Last score: <strong>${attempt.score}/${attempt.maxScore}</strong></div>`
            : `<div class="last-score not-attempted">Not attempted yet</div>`;

        const cardClass = test.exam === 'CHSL_TOP_100_MATHS' ? 'top100-card' : 
                         test.isPhase ? 'phase-card' : '';

        return `
            <article class="test-card ${cardClass}" 
                     role="listitem" 
                     style="animation-delay: ${index * 0.08}s">
                <div class="card-glow"></div>
                ${badges.join('')}
                <h3 class="card-title">${fullTitle}</h3>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                ${lastScoreHtml}
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Test</a>
            </article>`;
    }

    async function displayTests() {
        const filteredTests = getFilteredTests(currentExam, currentSubject);
        
        // Fade out
        gridContainer.style.opacity = '0';

        await new Promise(resolve => setTimeout(resolve, 150));

        if (filteredTests.length > 0) {
            let html = '';
            
            // Add section headers for special categories
            if (currentSubject === 'Top100Maths') {
                html += `
                    <div class="section-header top100-header" data-icon="🔥">
                        <h2>🔥 MATHS TOP 100 - 2025</h2>
                        <p>Master the most important 100 questions for SSC CHSL 2025</p>
                    </div>`;
            } else if (currentExam === 'CPO' && currentSubject === 'Maths') {
                html += `
                    <div class="section-header cpo-header" data-icon="👮">
                        <h2>SSC CPO - Central Police Organization</h2>
                        <p>Prepare for Sub-Inspector and Assistant Sub-Inspector positions</p>
                    </div>`;
            } else if (currentExam === 'EXTRA' && currentSubject === 'Maths') {
                html += `
                    <div class="section-header extra-header" data-icon="⭐">
                        <h2>Extra SSC Tests - Advanced Practice</h2>
                        <p>Challenge yourself with additional practice tests</p>
                    </div>`;
            } else if (currentExam === 'PHASE') {
                if (currentSubject === 'PhaseI' || currentSubject === 'PhaseII') {
                    html += `
                        <div class="section-header phase-header" data-icon="📋">
                            <h2>SSC Phase Selection Tests</h2>
                            <p>Complete phase-wise preparation for SSC examinations</p>
                        </div>`;
                    
                    // Add phase information cards
                    html += `
                        <div class="phase-info-grid">
                            <div class="phase-info-card">
                                <div class="phase-number">1</div>
                                <h4>Preliminary</h4>
                                <p>Screening Test</p>
                            </div>
                            <div class="phase-info-card">
                                <div class="phase-number">2</div>
                                <h4>Mains</h4>
                                <p>Detailed Exam</p>
                            </div>
                            <div class="phase-info-card">
                                <div class="phase-number">3</div>
                                <h4>Skill Test</h4>
                                <p>Typing/Data Entry</p>
                            </div>
                            <div class="phase-info-card">
                                <div class="phase-number">4</div>
                                <h4>Document</h4>
                                <p>Verification</p>
                            </div>
                        </div>`;
                }
            }
            
            html += filteredTests.map((test, i) => generateCardHTML(test, i)).join('');
            gridContainer.innerHTML = html;
        } else {
            const messages = {
                'CPO': `<div class="no-tests-message">
                    <div class="icon">👮</div>
                    <h3>SSC CPO Tests Coming Soon!</h3>
                    <p>Comprehensive preparation material for Central Police Organization exams will be available soon!</p>
                </div>`,
                'EXTRA': `<div class="no-tests-message">
                    <div class="icon">⭐</div>
                    <h3>Extra Tests Loading...</h3>
                    <p>Additional practice tests and advanced materials are being prepared for you!</p>
                </div>`,
                'PHASE': `<div class="no-tests-message">
                    <div class="icon">📋</div>
                    <h3>Phase-wise Tests Coming!</h3>
                    <p>Complete phase selection test series will be available shortly!</p>
                </div>`,
                'default': `<div class="no-tests-message">
                    <div class="icon">📭</div>
                    <h3>Coming Soon!</h3>
                    <p>No ${currentSubject} tests for SSC ${currentExam} yet. Check back soon!</p>
                </div>`
            };
            
            gridContainer.innerHTML = messages[currentExam] || messages['default'];
        }

        // Fade in
        gridContainer.style.opacity = '1';
    }

    function updateTabsForExam(exam) {
        tabs.forEach(tab => {
            const subject = tab.dataset.subject;
            
            // Hide/show tabs based on exam
            if (exam === "DP" && subject === "English") {
                tab.style.display = "none";
            } else if (subject === "Top100Maths") {
                tab.style.display = exam === "CHSL" ? "block" : "none";
            } else if (subject === "PhaseI" || subject === "PhaseII") {
                tab.style.display = exam === "PHASE" ? "block" : "none";
            } else {
                tab.style.display = "block";
            }
        });

        // Reset to appropriate default subject
        const visibleTabs = [...tabs].filter(tab => tab.style.display !== "none");
        if (!visibleTabs.find(tab => tab.dataset.subject === currentSubject)) {
            currentSubject = exam === "PHASE" ? "PhaseI" : "Maths";
            tabs.forEach(tab => {
                const isActive = tab.dataset.subject === currentSubject;
                tab.classList.toggle("active", isActive);
                tab.setAttribute('aria-selected', isActive);
            });
        }
    }

    function switchExam(exam) {
        currentExam = exam;

        // Update button states
        [btnCGL, btnCHSL, btnDP, btnCPO, btnExtra, btnPhase].forEach(btn => {
            if (btn) {
                const isActive = btn.dataset.exam === exam;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive);
            }
        });

        // Update body classes
        document.body.classList.remove('exam-chsl', 'exam-dp', 'exam-cpo', 'exam-extra', 'exam-phase');
        
        const titles = {
            'CGL': 'SSC <strong>CGL</strong> Mock Tests',
            'CHSL': 'SSC <strong>CHSL</strong> Mock Tests',
            'DP': '<strong>DP Constable</strong> Mock Tests',
            'CPO': 'SSC <strong>CPO</strong> Mock Tests',
            'EXTRA': '<strong>Extra SSC</strong> Tests',
            'PHASE': 'SSC <strong>Phase</strong> Selection Tests'
        };

        mainTitle.innerHTML = titles[exam];

        const examClasses = {
            'CHSL': 'exam-chsl',
            'DP': 'exam-dp',
            'CPO': 'exam-cpo',
            'EXTRA': 'exam-extra',
            'PHASE': 'exam-phase'
        };

        if (examClasses[exam]) {
            document.body.classList.add(examClasses[exam]);
        }

        updateTabsForExam(exam);
        displayTests();
    }

    // ==================== EVENT LISTENERS ====================
    btnCGL.addEventListener('click', () => switchExam('CGL'));
    btnCHSL.addEventListener('click', () => switchExam('CHSL'));
    btnDP.addEventListener('click', () => switchExam('DP'));
    if (btnCPO) btnCPO.addEventListener('click', () => switchExam('CPO'));
    if (btnExtra) btnExtra.addEventListener('click', () => switchExam('EXTRA'));
    if (btnPhase) btnPhase.addEventListener('click', () => switchExam('PHASE'));

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            currentSubject = tab.dataset.subject;
            displayTests();
        });
    });

    // Keyboard navigation for tabs
    document.querySelectorAll('[role="tablist"]').forEach(tablist => {
        tablist.addEventListener('keydown', (e) => {
            const tabs = [...tablist.querySelectorAll('[role="tab"]:not([style*="display: none"])')];
            const currentIndex = tabs.indexOf(document.activeElement);
            
            let newIndex;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                newIndex = (currentIndex + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            } else if (e.key === 'Home') {
                newIndex = 0;
            } else if (e.key === 'End') {
                newIndex = tabs.length - 1;
            } else {
                return;
            }
            
            e.preventDefault();
            tabs[newIndex].focus();
            tabs[newIndex].click();
        });
    });

    // ==================== INITIAL LOAD ====================
    await loadHistory();
    displayTests();
    
    if (window.updateNavigation) {
        updateNavigation();
    }
});
</script>

</body>
</html>
