<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Exam-Axis - Professional SSC Mock Tests for CGL, CHSL, and DP Constable preparation">
    <meta name="theme-color" content="#6366f1">
    <title>Exam-Axis | SSC Mock Tests</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Add font-display=swap for faster render -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">    
    <style>
        /* ============================================
           CSS VARIABLES - Light & Dark Theme
           ============================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            
            /* Brand Colors */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            
            /* Exam Colors */
            --cgl-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --cgl-glow: rgba(99, 102, 241, 0.3);
            
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --chsl-glow: rgba(16, 185, 129, 0.3);
            
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --dp-glow: rgba(245, 158, 11, 0.3);
            /* CPO Colors - Add these */
            --cpo-color: #ec4899;
            --cpo-gradient: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
           --cpo-glow: rgba(236, 72, 153, 0.3);
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15);
            
            /* Spacing & Sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Container */
            --container-max: 1320px;
            --nav-height: 72px;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: #1e293b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
            transition: opacity var(--transition-slow);
        }

        .dark-mode::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent);
        }

        body.exam-chsl::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(16, 185, 129, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(52, 211, 153, 0.06), transparent);
        }

        body.exam-dp::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(245, 158, 11, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(251, 191, 36, 0.06), transparent);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            height: var(--nav-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-normal);
        }

        .dark-mode .top-nav {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: var(--border-color);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform var(--transition-normal);
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .brand-logo {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Theme Switch */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            transition: all var(--transition-normal);
        }

        .theme-switch-wrapper:hover {
            border-color: var(--primary);
        }

        .theme-switch-wrapper span {
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: transform var(--transition-normal);
        }

        .theme-switch-wrapper:hover span:first-of-type {
            transform: rotate(-15deg) scale(1.1);
        }

        .theme-switch-wrapper:hover span:last-of-type {
            transform: rotate(15deg) scale(1.1);
        }

        .theme-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: var(--transition-normal);
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(20px);
        }

        /* Nav Buttons */
        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }

        .login-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .login-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        body.exam-chsl .login-btn {
            color: var(--chsl-color);
            border-color: var(--chsl-color);
        }

        body.exam-chsl .login-btn:hover {
            background: var(--chsl-color);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-chsl .signup-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .main-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 40px 24px 100px;
        }

        /* Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .sub-heading {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub-heading::before,
        .sub-heading::after {
            content: '';
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 1px;
        }

        /* ============================================
           EXAM SELECTOR BUTTONS
           ============================================ */
        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .exam-btn {
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exam-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px var(--cgl-glow);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        /* ============================================
           SUBJECT TABS
           ============================================ */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 36px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: none;
            background: transparent;
        }

        .tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* Top 100 Tab Special */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .tab.chsl-only:hover {
            transform: translateY(-2px);
        }

        /* ============================================
           TEST CARDS GRID
           ============================================ */
        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARD - Premium Design
           ============================================ */
        .test-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card hover glow effect */
    .test-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 2px;
  background: var(--cgl-gradient);

  /* 🔹 THIS LINE IS ALREADY THERE */
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;

  /* 🔹 ADD THESE 2 LINES JUST BELOW */
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask-composite: exclude;

  opacity: 0;
  transition: opacity var(--transition-normal);
}



        body.exam-chsl .test-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-dp .test-card::before {
            background: var(--dp-gradient);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .test-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .test-card:hover::after {
            left: 125%;
        }

        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--cgl-glow);
            border-color: transparent;
        }

        body.exam-chsl .test-card:hover {
            box-shadow: 0 20px 40px var(--chsl-glow);
        }

        body.exam-dp .test-card:hover {
            box-shadow: 0 20px 40px var(--dp-glow);
        }

        /* Card Glow Background */
        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity var(--transition-normal);
            pointer-events: none;
            z-index: -1;
        }

        .test-card:hover .card-glow {
            opacity: 0.5;
        }

        /* Badges */
        .new-badge, .attempted-badge, .top100-badge {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 10;
        }

        .new-badge {
            right: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .attempted-badge {
            right: 16px;
            background: var(--success);
            color: white;
        }

        .attempted-badge::before {
            content: "✓ ";
        }

        .top100-badge {
            left: 16px;
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: white;
        }

        /* Card Title */
        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin: 12px 0 20px;
            color: var(--text-primary);
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .test-card hr {
            width: 50%;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 0 auto 24px;
            opacity: 0.3;
        }

        body.exam-chsl .test-card hr {
            background: linear-gradient(90deg, transparent, var(--chsl-color), transparent);
        }

        /* Stats Grid */
        .card-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            flex: 1;
            max-width: 90px;
            padding: 14px 8px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.04));
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
            transition: all var(--transition-normal);
        }

        body.exam-chsl .stat-item {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(52, 211, 153, 0.04));
            border-color: rgba(16, 185, 129, 0.1);
        }

        body.exam-dp .stat-item {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.04));
            border-color: rgba(245, 158, 11, 0.1);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-item .value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        body.exam-chsl .stat-item .value {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .stat-item .value {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Last Score */
        .last-score {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 10px 18px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .last-score::before {
            content: "📊";
        }

        .last-score.not-attempted {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.15);
        }

        .last-score.not-attempted::before {
            content: "📝";
        }

        /* Attempt Button */
        .attempt-btn {
            background: var(--cgl-gradient);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            max-width: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition-normal);

        /* ============================================
           CHAPTER CARD - Premium Design
           ============================================ */
        .chapter-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        /* Chapter card hover glow effect */
        .chapter-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        body.exam-chsl .chapter-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-cpo .chapter-card::before {
            background: var(--cpo-gradient);
        }

        body.exam-dp .chapter-card::before {
            background: var(--dp-gradient);
        }

        .chapter-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .chapter-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .chapter-card:hover::after {
            left: 125%;

            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .chapterwise-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .chapterwise-header h2 {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-cpo .chapterwise-header h2 {
            background: var(--cpo-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .chapterwise-header h2 {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .chapterwise-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ============================================
           RESPONSIVE - MODE SELECTOR & CHAPTERWISE
           ============================================ */
        @media (max-width: 768px) {
            .mode-selector {
                max-width: 100%;
                gap: 6px;
                padding: 5px;
            }

            .mode-btn {
                padding: 12px 16px;
                font-size: 0.8rem;
                gap: 6px;
            }

            .chapterwise-subjects {
                padding: 6px;
                gap: 6px;
                justify-content: flex-start;
            }

            .chapter-subject-btn {
                padding: 10px 18px;
                font-size: 0.8rem;
            }

            .chapters-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 16px;
            }

            .chapter-card {
                padding: 24px 20px;
            }

            .chapter-icon {
                font-size: 2.5rem;
            }

            .chapter-title {
                font-size: 1.05rem;
            }

            .chapter-card .attempt-btn {
                padding: 10px 24px;
                font-size: 0.85rem;
            }

            .chapterwise-header {
                padding: 24px 20px;
            }

            .chapterwise-header h2 {
                font-size: 1.25rem;
            }

            .chapterwise-header::before {
                font-size: 4rem;
            }
        }

        @media (max-width: 480px) {
            .mode-selector {
                flex-direction: column;
            }

            .mode-btn {
                width: 100%;
            }

            .chapterwise-subjects {
                flex-wrap: nowrap;
                justify-content: flex-start;
            }

            .chapter-subject-btn {
                padding: 10px 16px;
                font-size: 0.75rem;
                min-width: max-content;
            }

            .chapters-grid {
                grid-template-columns: 1fr;
            }

            .chapter-card {
                padding: 20px 16px;
            }

            .chapter-icon {
                font-size: 2.2rem;
                margin-bottom: 12px;
            }

            .chapter-title {
                font-size: 1rem;
            }

            .chapter-test-count {
                font-size: 0.8rem;
                padding: 6px 12px;
            }

            .progress-text {
                font-size: 0.7rem;
            }
        }

        /* Reduce animations on mobile */
        @media (max-width: 768px) {
            .chapter-card::after {
                display: none;
            }

            .chapter-card:hover {
                transform: translateY(-4px);
            }

            .chapter-card:hover .chapter-icon {
                transform: scale(1.1);
            }

            .progress-fill::after {
                display: none;
            }
        }

        /* ============================================
           CPO THEME - CHAPTER CARDS
           ============================================ */
        body.exam-cpo .chapter-card .card-glow {
            background: radial-gradient(circle, var(--cpo-glow), transparent 70%);
        }

        /* ============================================
           FOCUS STATES FOR NEW ELEMENTS
           ============================================ */
        .mode-btn:focus-visible,
        .chapter-subject-btn:focus-visible,
        .chapter-card .attempt-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        body.exam-cpo .mode-btn:focus-visible,
        body.exam-cpo .chapter-subject-btn:focus-visible {
            outline-color: var(--cpo-color);
        }

        /* ============================================
           PRINT STYLES - CHAPTERWISE
           ============================================ */
        @media print {
            .mode-selector,
            .chapterwise-subjects {
                display: none !important;
            }

            .chapter-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
            }

            .chapter-card::before,
            .chapter-card::after {
                display: none;
            }
        }

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
            .test-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
    </style>

<!-- Footer decoration line -->
<div class="footer-decoration"></div>

<!-- Navigation Bar -->
<nav class="top-nav">
    <a href="#" class="brand-logo">EXAM-AXIS</a>
    <div class="nav-right">
        <div class="theme-switch-wrapper">
            <span>☀️</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
                <span class="slider"></span>
            </label>
            <span>🌙</span>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login-btn">Login</a>
            <a href="signup.html" class="nav-btn signup-btn">Create Account</a>

<!-- Main Content -->
<main class="main-container">
    <!-- Header Section -->
    <header class="header-container">
        <div class="header-title-section">
            <h1 id="main-title">SSC <strong>CGL</strong> Mock Tests</h1>
            <p class="sub-heading">Assess Your Preparation: Start a Test Now</p>

    <!-- Exam Selector -->
    <div class="exam-selector" role="tablist" aria-label="Select exam type">
        <button class="exam-btn active" data-exam="CGL" id="btn-cgl" role="tab" aria-selected="true">🎓 SSC CGL</button>
        <button class="exam-btn chsl" data-exam="CHSL" id="btn-chsl" role="tab" aria-selected="false">📘 SSC CHSL</button>
        <button class="exam-btn cpo" data-exam="CPO" id="btn-cpo" role="tab" aria-selected="false">🚔 SSC CPO</button>

    <!-- Test Mode Selector -->

    <!-- Subject Tabs (for Mock Tests) -->
    <div class="tabs-container" id="mock-tabs" role="tablist" aria-label="Select subject">
        <button class="tab active" data-subject="Maths" role="tab" aria-selected="true">📐 Maths</button>
        <button class="tab" data-subject="Reasoning" role="tab" aria-selected="false">🧩 Reasoning</button>
        <button class="tab" data-subject="English" role="tab" aria-selected="false">📖 English</button>
        <button class="tab" data-subject="GK" role="tab" aria-selected="false">🌍 GK</button>
        <button class="tab chsl-only" data-subject="Top100Maths" style="display: none;" role="tab" aria-selected="false">🔥 Maths Top 100</button>
    </div>

    <!-- Chapterwise Tests Section -->
    <section class="chapterwise-container" id="chapterwise-section" style="display: none;" aria-label="Chapterwise Tests">
        
        <!-- Subject Selection for Chapterwise -->
        <div class="chapterwise-subjects" role="tablist" aria-label="Select subject for chapterwise tests">
            <button class="chapter-subject-btn active" data-chapter-subject="Maths" role="tab" aria-selected="true">
                📐 Maths
            </button>
            <button class="chapter-subject-btn" data-chapter-subject="Reasoning" role="tab" aria-selected="false">
                🧩 Reasoning
            </button>
            <button class="chapter-subject-btn" data-chapter-subject="English" role="tab" aria-selected="false">
                📖 English
            </button>
            <button class="chapter-subject-btn" data-chapter-subject="GK" role="tab" aria-selected="false">
                🌍 GK
            </button>
        </div>

        <!-- Chapters Grid -->
        <div class="chapters-grid" id="chapters-grid" role="list" aria-label="Available chapters">
            <!-- Chapters will be dynamically loaded -->
        </div>
    </section>

    <!-- Test Cards Grid -->
    <div id="test-grid-container" class="test-grid-container" role="list" aria-label="Available tests"></div>
</main>

<!-- Help Button -->
<button class="help-btn" aria-label="Get help">💬</button>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/tests-list.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM Elements
    const mainTitle = document.getElementById('main-title');
    const gridContainer = document.getElementById('test-grid-container');
    const tabs = document.querySelectorAll('.tab');
    const themeToggle = document.getElementById('theme-toggle');
    const btnCGL = document.getElementById('btn-cgl');
    const btnCHSL = document.getElementById('btn-chsl');
    const btnCPO = document.getElementById('btn-cpo');
    const btnDP = document.getElementById('btn-dp');
    
    // Mode selector elements
    const btnMockMode = document.getElementById('btn-mock-mode');
    const btnChapterwiseMode = document.getElementById('btn-chapterwise-mode');
    const mockTabs = document.getElementById('mock-tabs');
    const chapterwiseSection = document.getElementById('chapterwise-section');
    const chaptersGrid = document.getElementById('chapters-grid');
    const chapterSubjectBtns = document.querySelectorAll('.chapter-subject-btn');

    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';
    let currentMode = 'mock'; // 'mock' or 'chapterwise'
    let currentChapterSubject = 'Maths';
    let historyMap = {};
    let isHistoryLoaded = false;

    // Configuration
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 25,
        "Top100Maths": 60
    };

    // Chapterwise Test Data Configuration
    const CHAPTERWISE_DATA = {
        Maths: [
            { id: 'percentage', name: 'Percentage', icon: '📊', tests: 12 },
            { id: 'profit-loss', name: 'Profit & Loss', icon: '💰', tests: 10 },
            { id: 'si-ci', name: 'SI & CI', icon: '🏦', tests: 8 },
            { id: 'ratio-proportion', name: 'Ratio & Proportion', icon: '⚖️', tests: 9 },
            { id: 'time-work', name: 'Time & Work', icon: '⏱️', tests: 11 },
            { id: 'time-distance', name: 'Time & Distance', icon: '🚗', tests: 10 },
            { id: 'number-system', name: 'Number System', icon: '🔢', tests: 14 },
            { id: 'algebra', name: 'Algebra', icon: '📈', tests: 12 },
            { id: 'geometry', name: 'Geometry', icon: '📐', tests: 15 },
            { id: 'trigonometry', name: 'Trigonometry', icon: '📏', tests: 10 },
            { id: 'mensuration', name: 'Mensuration', icon: '📦', tests: 8 },
            { id: 'dI', name: 'Data Interpretation', icon: '📉', tests: 7 }
        ],
        Reasoning: [
            { id: 'analogy', name: 'Analogy', icon: '🔗', tests: 10 },
            { id: 'classification', name: 'Classification', icon: '📁', tests: 8 },
            { id: 'series', name: 'Series', icon: '🔢', tests: 12 },
            { id: 'coding-decoding', name: 'Coding-Decoding', icon: '🔐', tests: 11 },
            { id: 'blood-relation', name: 'Blood Relation', icon: '👨‍👩‍👧', tests: 7 },
            { id: 'direction', name: 'Direction', icon: '🧭', tests: 6 },
            { id: 'syllogism', name: 'Syllogism', icon: '🎯', tests: 9 },
            { id: 'puzzle', name: 'Puzzle', icon: '🧩', tests: 10 },
            { id: 'venn-diagram', name: 'Venn Diagram', icon: '⭕', tests: 5 },
            { id: 'mirror-image', name: 'Mirror & Water Image', icon: '🪞', tests: 8 },
            { id: 'paper-folding', name: 'Paper Folding', icon: '📄', tests: 6 },
            { id: 'dice', name: 'Dice & Cube', icon: '🎲', tests: 7 }
        ],
        English: [
            { id: 'vocab', name: 'Vocabulary', icon: '📖', tests: 15 },
            { id: 'synonyms', name: 'Synonyms', icon: '🔤', tests: 10 },
            { id: 'antonyms', name: 'Antonyms', icon: '🔡', tests: 10 },
            { id: 'idioms', name: 'Idioms & Phrases', icon: '💬', tests: 12 },
            { id: 'one-word', name: 'One Word Substitution', icon: '✏️', tests: 11 },
            { id: 'error-spotting', name: 'Error Spotting', icon: '🔍', tests: 14 },
            { id: 'fill-blanks', name: 'Fill in the Blanks', icon: '📝', tests: 10 },
            { id: 'cloze-test', name: 'Cloze Test', icon: '📋', tests: 8 },
            { id: 'reading-comp', name: 'Reading Comprehension', icon: '📚', tests: 9 },
            { id: 'sentence-improve', name: 'Sentence Improvement', icon: '✨', tests: 12 },
            { id: 'active-passive', name: 'Active-Passive Voice', icon: '🔄', tests: 7 },
            { id: 'direct-indirect', name: 'Direct-Indirect Speech', icon: '💭', tests: 7 }
        ],
        GK: [
            { id: 'history', name: 'History', icon: '🏛️', tests: 15 },
            { id: 'geography', name: 'Geography', icon: '🌍', tests: 14 },
            { id: 'polity', name: 'Polity', icon: '⚖️', tests: 12 },
            { id: 'economy', name: 'Economy', icon: '💹', tests: 10 },
            { id: 'science', name: 'General Science', icon: '🔬', tests: 16 },
            { id: 'physics', name: 'Physics', icon: '⚡', tests: 8 },
            { id: 'chemistry', name: 'Chemistry', icon: '🧪', tests: 8 },
            { id: 'biology', name: 'Biology', icon: '🧬', tests: 10 },
            { id: 'current-affairs', name: 'Current Affairs', icon: '📰', tests: 20 },
            { id: 'static-gk', name: 'Static GK', icon: '📌', tests: 12 },
            { id: 'computer', name: 'Computer Knowledge', icon: '💻', tests: 6 },
            { id: 'awards', name: 'Awards & Honours', icon: '🏆', tests: 5 }
        ]
    };

    // ==================== THEME MANAGEMENT ====================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        themeToggle.checked = isDark;
        
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0f172a' : '#6366f1');
        }
    }
    
    themeToggle.addEventListener('change', () => {
        const newTheme = themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            applyTheme(e.matches ? 'dark' : 'light');
        }
    });

    // ==================== DATA VALIDATION ====================
    if (typeof ALL_TESTS === 'undefined' || !Array.isArray(ALL_TESTS)) {
        mainTitle.innerHTML = `Tests are currently <strong>Unavailable</strong>`;
        gridContainer.innerHTML = `
            <div class="no-tests-message">
                <div class="icon">⚠️</div>
                <h3>Data Not Found</h3>
                <p>The test data file is missing or invalid. Please try again later.</p>
            </div>`;
        return;
    }

    // ==================== LOAD USER HISTORY (NON-BLOCKING) ====================
    function loadHistory() {
        if (!window.ExamAxisAPI || !ExamAxisAPI.isLoggedIn()) {
            historyMap = {};
            isHistoryLoaded = true;
            return Promise.resolve();
        }

        return ExamAxisAPI.getTestHistory()
            .then(res => {
                historyMap = {};
                if (res.success && res.data?.attempts) {
                    res.data.attempts.forEach(a => {
                        const key = String(a.testId);
                        const existing = historyMap[key];
                        if (!existing || new Date(a.createdAt) > new Date(existing.createdAt)) {
                            historyMap[key] = a;
                        }
                    });
                }
                isHistoryLoaded = true;
                displayTests();
            })
            .catch(err => {
                console.error('Failed to load history:', err);
                historyMap = {};
                isHistoryLoaded = true;
            });
    }

    // ==================== MODE SWITCHING ====================
    function switchMode(mode) {
        currentMode = mode;
        
        // Update mode buttons
        btnMockMode.classList.toggle('active', mode === 'mock');
        btnChapterwiseMode.classList.toggle('active', mode === 'chapterwise');
        btnMockMode.setAttribute('aria-selected', mode === 'mock');
        btnChapterwiseMode.setAttribute('aria-selected', mode === 'chapterwise');
        
        // Update title
        updateTitle();
        
        if (mode === 'mock') {
            mockTabs.style.display = 'flex';
            chapterwiseSection.style.display = 'none';
            gridContainer.style.display = 'grid';
            displayTests();
        } else {
            mockTabs.style.display = 'none';
            chapterwiseSection.style.display = 'block';
            gridContainer.style.display = 'none';
            displayChapters();
        }
    }

    // ==================== CHAPTERWISE FUNCTIONS ====================
    function displayChapters() {
        const chapters = CHAPTERWISE_DATA[currentChapterSubject] || [];
        
        chaptersGrid.style.opacity = '0';
        
        requestAnimationFrame(() => {
            if (chapters.length > 0) {
                const html = chapters.map((chapter, index) => generateChapterCardHTML(chapter, index)).join('');
                chaptersGrid.innerHTML = html;
            } else {
                chaptersGrid.innerHTML = `
                    <div class="no-tests-message">
                        <div class="icon">📚</div>
                        <h3>Coming Soon!</h3>
                        <p>Chapterwise tests for ${currentChapterSubject} will be available soon!</p>
                    </div>`;
            }
            
            requestAnimationFrame(() => {
                chaptersGrid.style.opacity = '1';
            });
        });
    }

    function generateChapterCardHTML(chapter, index) {
        const maxDelay = Math.min(index * 0.05, 0.4);
        
        return `
            <article class="chapter-card" role="listitem" style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                <div class="chapter-icon">${chapter.icon}</div>
                <h3 class="chapter-title">${chapter.name}</h3>
                <div class="chapter-stats">
                    <span class="chapter-test-count">${chapter.tests} Tests Available</span>
                </div>
                <div class="chapter-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <span class="progress-text">0/${chapter.tests} Completed</span>
                </div>
                <a href="chapterwise.html?exam=${currentExam}&subject=${currentChapterSubject}&chapter=${chapter.id}" 
                   class="attempt-btn">
                    Start Practice
                </a>
            </article>`;
    }

    function updateChapterSubjectTabs() {
        // Hide English for DP exam in chapterwise mode too
        chapterSubjectBtns.forEach(btn => {
            const subject = btn.dataset.chapterSubject;
            if (currentExam === "DP" && subject === "English") {
                btn.style.display = "none";
            } else {
                btn.style.display = "block";
            }
        });

        // Reset to Maths if current subject is hidden
        if (currentExam === "DP" && currentChapterSubject === "English") {
            currentChapterSubject = "Maths";
            chapterSubjectBtns.forEach(btn => {
                const isActive = btn.dataset.chapterSubject === "Maths";
                btn.classList.toggle("active", isActive);
                btn.setAttribute('aria-selected', isActive);
            });
        }
    }

    // ==================== HELPER FUNCTIONS ====================
    function getFilteredTests(exam, subject) {
        if (exam === 'CHSL' && subject === 'Top100Maths') {
            return ALL_TESTS.filter(test => test.exam === 'CHSL_TOP_100_MATHS');
        }
        return ALL_TESTS.filter(test => test.exam === exam && test.subject === subject);
    }

    function generateCardHTML(test, index) {
        const fullTitle = `${test.date} ${test.title}`;
        const questions = test.questions || 25;
        const time = test.exam === 'CHSL_TOP_100_MATHS' ? 60 : 
            (SUBJECT_DISPLAY_TIMES[test.subject] || SUBJECT_DISPLAY_TIMES["General"]);
        
        const attempt = historyMap[String(test.id)];
        
        const badges = [];
        if (test.isNew) badges.push('<div class="new-badge">✨ NEW</div>');
        if (test.exam === 'CHSL_TOP_100_MATHS') badges.push('<div class="top100-badge">🔥 TOP 100</div>');
        if (attempt && isHistoryLoaded) badges.push('<div class="attempted-badge">Attempted</div>');

        const lastScoreHtml = isHistoryLoaded 
            ? (attempt
                ? `<div class="last-score">Last score: <strong>${attempt.score}/${attempt.maxScore}</strong></div>`
                : `<div class="last-score not-attempted">Not attempted yet</div>`)
            : `<div class="last-score" style="background: transparent; border: none; color: var(--text-muted);">Loading history...</div>`;

        const maxDelay = Math.min(index * 0.05, 0.4);

        return `
            <article class="test-card ${test.exam === 'CHSL_TOP_100_MATHS' ? 'top100-card' : ''}" 
                     role="listitem" 
                     style="animation-delay: ${maxDelay}s">
                <div class="card-glow"></div>
                ${badges.join('')}
                <h3 class="card-title">${fullTitle}</h3>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                ${lastScoreHtml}
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Test</a>
            </article>`;
    }

    function displayTests() {
        const filteredTests = getFilteredTests(currentExam, currentSubject);
        
        gridContainer.style.opacity = '0';

        requestAnimationFrame(() => {
            if (filteredTests.length > 0) {
                let html = '';
                
                if (currentSubject === 'Top100Maths') {
                    html += `
                        <div class="section-header top100-header">
                            <h2>🔥 MATHS TOP 100 - 2025</h2>
                            <p>Master the most important 100 questions for SSC CHSL 2025</p>
                        </div>`;
                }
                
                html += filteredTests.map((test, i) => generateCardHTML(test, i)).join('');
                gridContainer.innerHTML = html;
            } else {
                const message = currentSubject === 'Top100Maths' 
                    ? `<div class="no-tests-message">
                        <div class="icon">🔥</div>
                        <h3>Maths Top 100 - Coming Soon!</h3>
                        <p>Top 100 most important Maths questions for SSC CHSL 2025 will be available soon!</p>
                    </div>`
                    : `<div class="no-tests-message">
                        <div class="icon">📭</div>
                        <h3>Coming Soon!</h3>
                        <p>No ${currentSubject} tests for SSC ${currentExam} yet. Check back soon!</p>
                    </div>`;
                gridContainer.innerHTML = message;
            }

            requestAnimationFrame(() => {
                gridContainer.style.opacity = '1';
            });
        });
    }

    function updateTitle() {
        const examNames = {
            'CGL': 'SSC <strong>CGL</strong>',
            'CHSL': 'SSC <strong>CHSL</strong>',
            'CPO': 'SSC <strong>CPO</strong>',
            'DP': '<strong>DP Constable</strong>'
        };
        
        const modeText = currentMode === 'mock' ? 'Mock Tests' : 'Chapterwise Tests';
        mainTitle.innerHTML = `${examNames[currentExam]} ${modeText}`;
    }

    function updateTabsForExam(exam) {
        tabs.forEach(tab => {
            const subject = tab.dataset.subject;
            
            if (exam === "DP" && subject === "English") {
                tab.style.display = "none";
            } else if (subject === "Top100Maths") {
                tab.style.display = exam === "CHSL" ? "block" : "none";
            } else {
                tab.style.display = "block";
            }
        });

        if ((exam === "DP" && currentSubject === "English") || 
            (exam !== "CHSL" && currentSubject === "Top100Maths")) {
            currentSubject = "Maths";
            tabs.forEach(tab => {
                const isActive = tab.dataset.subject === "Maths";
                tab.classList.toggle("active", isActive);
                tab.setAttribute('aria-selected', isActive);
            });
        }
        
        // Update chapterwise subject tabs too
        updateChapterSubjectTabs();
    }

    function switchExam(exam) {
        currentExam = exam;

        [btnCGL, btnCHSL, btnCPO, btnDP].forEach(btn => {
            const isActive = btn.dataset.exam === exam;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive);
        });

        document.body.classList.remove('exam-chsl', 'exam-cpo', 'exam-dp');

        if (exam === 'CHSL') document.body.classList.add('exam-chsl');
        if (exam === 'CPO') document.body.classList.add('exam-cpo');
        if (exam === 'DP') document.body.classList.add('exam-dp');

        updateTitle();
        updateTabsForExam(exam);
        
        if (currentMode === 'mock') {
            displayTests();
        } else {
            displayChapters();
        }
    }

    // ==================== EVENT LISTENERS ====================
    btnCGL.addEventListener('click', () => switchExam('CGL'));
    btnCHSL.addEventListener('click', () => switchExam('CHSL'));
    btnCPO.addEventListener('click', () => switchExam('CPO'));
    btnDP.addEventListener('click', () => switchExam('DP'));
    
    // Mode switching
    btnMockMode.addEventListener('click', () => switchMode('mock'));
    btnChapterwiseMode.addEventListener('click', () => switchMode('chapterwise'));

    // Subject tabs for mock tests
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            currentSubject = tab.dataset.subject;
            displayTests();
        });
    });

    // Subject tabs for chapterwise tests
    chapterSubjectBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            chapterSubjectBtns.forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');
            currentChapterSubject = btn.dataset.chapterSubject;
            displayChapters();
        });
    });

    // Keyboard navigation
    document.querySelectorAll('[role="tablist"]').forEach(tablist => {
        tablist.addEventListener('keydown', (e) => {
            const tabs = [...tablist.querySelectorAll('[role="tab"]:not([style*="display: none"])')];
            const currentIndex = tabs.indexOf(document.activeElement);
            
            let newIndex;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                newIndex = (currentIndex + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            } else if (e.key === 'Home') {
                newIndex = 0;
            } else if (e.key === 'End') {
                newIndex = tabs.length - 1;
            } else {
                return;
            }
            
            e.preventDefault();
            tabs[newIndex].focus();
            tabs[newIndex].click();
        });
    });

    // ==================== INITIAL LOAD (OPTIMIZED) ====================
    displayTests();
    loadHistory();
    
    if (window.updateNavigation) {
        updateNavigation();
    }
});
</script>

</body>
</html>
