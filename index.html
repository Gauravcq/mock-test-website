    <style>
        /* ============================================
           CSS VARIABLES - Light & Dark Theme
           ============================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;

            html.dark-mode body,
            body.dark-mode {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-card: #1e293b;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: #334155;
    --border-light: #1e293b;
}
            
            /* Brand Colors */
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            
            /* Exam Colors */
            --cgl-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --cgl-glow: rgba(99, 102, 241, 0.3);
            
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --chsl-glow: rgba(16, 185, 129, 0.3);
            
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --dp-glow: rgba(245, 158, 11, 0.3);
            
            /* Section Colors */
            --sectional-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --sectional-glow: rgba(99, 102, 241, 0.3);
            
            --fullmock-gradient: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            --fullmock-glow: rgba(245, 158, 11, 0.3);
            
            --chapterwise-gradient: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
            --chapterwise-glow: rgba(16, 185, 129, 0.3);
            
            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15);
            
            /* Spacing & Sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Container */
            --container-max: 1320px;
            --nav-height: 72px;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: #1e293b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            max-width: 100vw;
            position: relative;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: none;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: -1;
            transition: opacity var(--transition-slow);
        }

        .dark-mode::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent);
        }

        body.exam-chsl::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(16, 185, 129, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(52, 211, 153, 0.06), transparent);
        }

        body.exam-dp::before {
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(245, 158, 11, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(251, 191, 36, 0.06), transparent);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            min-height: var(--nav-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            transition: all var(--transition-normal);
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
        }

        .dark-mode .top-nav {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: var(--border-color);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform var(--transition-normal);
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        .nav-brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .brand-logo {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-width: 0;
            justify-content: flex-end;
        }

        /* Theme Switch - defined in style.css */
        .theme-switch {
            position: relative;
            width: 54px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: var(--transition-normal);
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(28px);
        }

        /* Nav Buttons */
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }

        .login-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .login-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        body.exam-chsl .login-btn {
            color: var(--chsl-color);
            border-color: var(--chsl-color);
        }

        body.exam-chsl .login-btn:hover {
            background: var(--chsl-color);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-chsl .signup-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .main-container {
            max-width: var(--container-max);
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            padding: 40px 24px 100px;
            overflow-x: hidden;
        }

        /* Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .sub-heading {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sub-heading::before,
        .sub-heading::after {
            content: '';
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 1px;
        }

        /* ============================================
           EXAM SELECTOR BUTTONS
           ============================================ */
        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .exam-btn {
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exam-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px var(--cgl-glow);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }
        /* ============================================
   PERFORMANCE OPTIMIZATIONS
   ============================================ */

/* GPU acceleration for animated elements */
.test-card,
.tab,
.section-tab,
.exam-btn,
.attempt-btn {
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
}

/* Reduce repaints on hover */
.test-card {
    contain: layout style paint;
}

/* Faster transitions */
.test-grid-container {
    transition: opacity 0.15s ease-out;
}

/* Optimize card animations - faster */
@keyframes cardFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.test-card {
    animation: cardFadeIn 0.3s ease forwards;
}

/* Theme toggle styles defined in style.css */

.theme-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    transition: border-color 0.15s ease;
    flex-shrink: 0;
}

/* Disable heavy effects on mobile - prevent shake and improve performance */
@media (max-width: 768px) {
    .test-card::after,
    .attempt-btn::before,
    .card-glow {
        display: none !important;
    }
    
    .test-card {
        will-change: auto;
        animation-duration: 0.2s;
        transform: translateZ(0);
        backface-visibility: hidden;
    }
    
    .test-card:hover {
        transform: translateY(-4px) translateZ(0);
    }
    
    /* Faster mobile transitions - reduces jank */
    .test-card,
    .tab,
    .section-tab,
    .exam-btn {
        transition-duration: 0.15s;
        transition-property: transform, box-shadow, background, border-color, color;
    }
    
    .top-nav {
        transform: translateZ(0);
        backface-visibility: hidden;
    }
}

/* Reduce motion for users who prefer it */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    
    .test-card {
        animation: none;
        opacity: 1;
    }
}

/* Content visibility for off-screen cards */
.test-card {
    content-visibility: auto;
    contain-intrinsic-size: 400px;
}

        /* ============================================
           SUBJECT TABS
           ============================================ */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            padding: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            border: none;
            background: transparent;
        }

        .tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--cgl-glow);
        }

        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 12px var(--chsl-glow);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 12px var(--dp-glow);
        }

        /* Top 100 Tab Special */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .tab.chsl-only:hover {
            transform: translateY(-2px);
        }

        /* ============================================
           SECTION TABS (NEW - Sectional/Full Mock/Chapterwise)
           ============================================ */
        .section-tabs-wrapper {
            margin-bottom: 24px;
        }

        .section-tabs-container {
            display: flex;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .section-tabs-container::-webkit-scrollbar {
            display: none;
        }

        .section-tab {
            flex: 1;
            min-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            white-space: nowrap;
            position: relative;
        }

        .section-tab:hover:not(.active) {
            background: var(--border-light);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .section-tab.active {
            color: white;
            border-color: transparent;
        }

        .section-tab.active[data-section="sectional"] {
            background: var(--sectional-gradient);
            box-shadow: 0 6px 20px var(--sectional-glow);
        }

        .section-tab.active[data-section="fullmock"] {
            background: var(--fullmock-gradient);
            box-shadow: 0 6px 20px var(--fullmock-glow);
        }

        .section-tab.active[data-section="chapterwise"] {
            background: var(--chapterwise-gradient);
            box-shadow: 0 6px 20px var(--chapterwise-glow);
        }

        .section-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .section-text {
            font-weight: 700;
        }

        .section-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }

        .section-tab:not(.active) .section-count {
            background: var(--border-light);
            color: var(--text-muted);
        }

        /* ============================================
           SECTION INFO BANNER
           ============================================ */
        .section-info-banner {
            margin-bottom: 28px;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-info-content {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            border-radius: var(--radius-lg);
            border-left: 5px solid;
        }

        .section-info-banner.section-sectional .section-info-content {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.05));
            border-left-color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-left: 5px solid var(--primary);
        }

        .section-info-banner.section-fullmock .section-info-content {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(249, 115, 22, 0.05));
            border-left-color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-left: 5px solid #f59e0b;
        }

        .section-info-banner.section-chapterwise .section-info-content {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(20, 184, 166, 0.05));
            border-left-color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-left: 5px solid var(--success);
        }

        .section-info-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .section-info-text h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .section-info-text p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }

        /* ============================================
           TEST CARDS GRID
           ============================================ */
        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            transition: opacity var(--transition-normal);
        }

        /* ============================================
           TEST CARD - Premium Design
           ============================================ */
        .test-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: cardFadeIn 0.5s ease forwards;
            opacity: 0;
            overflow: hidden;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card hover glow effect */
        .test-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--cgl-gradient);
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        body.exam-chsl .test-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-dp .test-card::before {
            background: var(--dp-gradient);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* Shine effect */
        .test-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .test-card:hover::after {
            left: 125%;
        }

        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--cgl-glow);
            border-color: transparent;
        }

        body.exam-chsl .test-card:hover {
            box-shadow: 0 20px 40px var(--chsl-glow);
        }

        body.exam-dp .test-card:hover {
            box-shadow: 0 20px 40px var(--dp-glow);
        }

        /* Section-specific card styles */
        .test-card.section-fullmock-card::before {
            background: var(--fullmock-gradient);
        }

        .test-card.section-fullmock-card:hover {
            box-shadow: 0 20px 40px var(--fullmock-glow);
        }

        .test-card.section-chapterwise-card::before {
            background: var(--chapterwise-gradient);
        }

        .test-card.section-chapterwise-card:hover {
            box-shadow: 0 20px 40px var(--chapterwise-glow);
        }

        /* Card Glow Background */
        .card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity var(--transition-normal);
            pointer-events: none;
            z-index: -1;
        }

        .test-card:hover .card-glow {
            opacity: 0.5;
        }

        /* Badges */
        .new-badge, .attempted-badge, .top100-badge, .fullmock-badge, .chapter-badge {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 10;
        }

        .new-badge {
            right: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .attempted-badge {
            right: 16px;
            background: var(--success);
            color: white;
        }

        .attempted-badge::before {
            content: "✓ ";
        }

        .top100-badge {
            left: 16px;
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: white;
        }

        .fullmock-badge {
            left: 4px;
            background: var(--fullmock-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--fullmock-glow);
        }

        .chapter-badge {
            left: 16px;
            background: var(--chapterwise-gradient);
            color: white;
            box-shadow: 0 4px 12px var(--chapterwise-glow);
            text-transform: none;
            font-weight: 600;
        }

        /* Card Title */
        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin: 12px 0 20px;
            color: var(--text-primary);
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .test-card hr {
            width: 50%;
            height: 2px;
            border: none;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 0 auto 24px;
            opacity: 0.3;
        }

        body.exam-chsl .test-card hr {
            background: linear-gradient(90deg, transparent, var(--chsl-color), transparent);
        }

        .section-fullmock-card hr {
            background: linear-gradient(90deg, transparent, #f59e0b, transparent) !important;
        }

        .section-chapterwise-card hr {
            background: linear-gradient(90deg, transparent, var(--success), transparent) !important;
        }

        /* Stats Grid */
        .card-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            flex: 1;
            max-width: 90px;
            padding: 14px 8px;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.04));
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
            transition: all var(--transition-normal);
        }

        body.exam-chsl .stat-item {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(52, 211, 153, 0.04));
            border-color: rgba(16, 185, 129, 0.1);
        }

        body.exam-dp .stat-item {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.04));
            border-color: rgba(245, 158, 11, 0.1);
        }

        .section-fullmock-card .stat-item {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.08), rgba(249, 115, 22, 0.04));
            border-color: rgba(245, 158, 11, 0.1);
        }

        .section-chapterwise-card .stat-item {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(20, 184, 166, 0.04));
            border-color: rgba(16, 185, 129, 0.1);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-item .value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        body.exam-chsl .stat-item .value {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        body.exam-dp .stat-item .value {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .section-fullmock-card .stat-item .value {
            background: var(--fullmock-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .section-chapterwise-card .stat-item .value {
            background: var(--chapterwise-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Last Score */
        .last-score {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 10px 18px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.15);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .last-score::before {
            content: "📊";
        }

        .last-score.not-attempted {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.15);
        }

        .last-score.not-attempted::before {
            content: "📝";
        }

        /* Test card animations */
        .attempt-btn {
            background: var(--cgl-gradient);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            max-width: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition-normal);
            box-shadow: 0 8px 20px var(--cgl-glow);
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .attempt-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }

        .attempt-btn:hover::before {
            left: 100%;
        }

        .attempt-btn::after {
            content: "→";
            font-size: 1.1rem;
            transition: transform var(--transition-normal);
        }

        .attempt-btn:hover::after {
            transform: translateX(4px);
        }

        .attempt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px var(--cgl-glow);
        }

        body.exam-chsl .attempt-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 20px var(--chsl-glow);
        }

        body.exam-chsl .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--chsl-glow);
        }

        body.exam-dp .attempt-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 20px var(--dp-glow);
        }

        .section-fullmock-card .attempt-btn {
            background: var(--fullmock-gradient);
            box-shadow: 0 8px 20px var(--fullmock-glow);
        }

        .section-fullmock-card .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--fullmock-glow);
        }

        .section-chapterwise-card .attempt-btn {
            background: var(--chapterwise-gradient);
            box-shadow: 0 8px 20px var(--chapterwise-glow);
        }

        .section-chapterwise-card .attempt-btn:hover {
            box-shadow: 0 12px 28px var(--chapterwise-glow);
        }

        /* ============================================
           NO TESTS MESSAGE
           ============================================ */
        .no-tests-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 2px dashed var(--border-color);
        }

        .no-tests-message .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .no-tests-message h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .no-tests-message p {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Section-specific no tests messages */
        .no-tests-message.section-fullmock {
            border-color: rgba(245, 158, 11, 0.3);
        }

        .no-tests-message.section-fullmock .icon {
            color: #f59e0b;
        }

        .no-tests-message.section-chapterwise {
            border-color: rgba(16, 185, 129, 0.3);
        }

        .no-tests-message.section-chapterwise .icon {
            color: var(--success);
        }

        .coming-soon-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .coming-soon-features span {
            background: var(--border-light);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        /* ============================================
           TOP 100 SECTION HEADER
           ============================================ */
        .section-header.top100-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 36px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: var(--radius-xl);
            color: white;
            margin-bottom: 8px;
            box-shadow: 0 12px 32px rgba(249, 115, 22, 0.3);
            position: relative;
            overflow: hidden;
        }

        .section-header.top100-header::before {
            content: "🔥";
            position: absolute;
            font-size: 8rem;
            opacity: 0.15;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
        }

        .section-header.top100-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .section-header.top100-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .test-card.top100-card {
            border-color: #f97316;
        }

        .test-card.top100-card::before {
            background: linear-gradient(135deg, #f97316, #ea580c);
            opacity: 1;
        }

        /* ============================================
           HELP BUTTON
           ============================================ */
        .help-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            background: var(--cgl-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--cgl-glow);
            transition: all var(--transition-normal);
            z-index: 999;
            border: none;
        }

        .help-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 32px var(--cgl-glow);
        }

        body.exam-chsl .help-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 24px var(--chsl-glow);
        }

        body.exam-dp .help-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 24px var(--dp-glow);
        }

        /* Footer decoration */
        .footer-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--cgl-gradient);
            z-index: 100;
        }

        body.exam-chsl .footer-decoration {
            background: var(--chsl-gradient);
        }

        body.exam-dp .footer-decoration {
            background: var(--dp-gradient);
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .main-container {
                padding: 32px 20px 80px;
            }

            .test-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                min-width: 0;
                contain: layout;
            }
            .test-grid-container {
                min-width: 0;
                overflow: hidden;
            }
            .test-card {
                min-width: 0;
                max-width: 100%;
            }
            .top-nav {
                padding: 0 16px;
                min-height: 56px;
                height: auto;
                max-width: 100vw;
                align-items: center;
                gap: 12px;
            }

                flex-shrink: 0;
            }

            .brand-logo::before {
                font-size: 1.1rem;
            }

            .nav-right {
                gap: 8px;
                align-items: center;
                flex-shrink: 0;
            }

            .theme-switch-wrapper {
                padding: 5px 8px;
                align-items: center;
                flex-shrink: 0;
            }

            .theme-switch-wrapper .theme-icon {
                font-size: 0.9rem;
            }

            .theme-switch {
                width: 44px;

            }

            .slider::before {
                height: 16px;

            }

            input:checked + .slider::before {
                transform: translateX(22px);
            }

            .nav-btn {
                padding: 7px 12px;
                font-size: 0.8rem;
            }

            .main-container {
                padding: 24px 16px 80px;
            }

            .header-container {
                margin-bottom: 28px;
            }

            .sub-heading::before,
            .sub-heading::after {

            }

            .exam-selector {
                gap: 8px;
                margin-bottom: 24px;
            }

            .exam-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
                flex: 1;

                justify-content: center;
            }

            .tabs-container {

            .section-info-content {

            .section-info-icon {

            }

            .section-info-text h3 {

            }

            .section-info-text p {
                font-size: 0.85rem;
            }

            .test-grid-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .test-card {
                padding: 24px 20px;
            }

            .card-title {
                font-size: 1.05rem;
            }

            .stat-item .value {

            }

            .attempt-btn {

                font-size: 0.9rem;
            }

            .help-btn {
                width: 50px;

        @media (max-width: 480px) {

        /* ============================================
           PERFORMANCE OPTIMIZATIONS
           ============================================ */
        @media (max-width: 768px) {
            .test-card::after,
            .attempt-btn::before {
                display: none;
            }

            .test-card:hover {
                transform: translateY(-4px);
            }

            @keyframes cardFadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-contrast: high) {
            .test-card {
                border-width: 2px;
            }

            .tab.active,
            .exam-btn.active,
            .section-tab.active {
                outline: 2px solid white;
                outline-offset: 2px;
            }
        }

        .exam-btn:focus-visible,
        .tab:focus-visible,
        .section-tab:focus-visible,
        .attempt-btn:focus-visible,

<script>
// Global DOM Elements - Cache all at once
const elements = {
    mainTitle: document.getElementById('main-title'),
    gridContainer: document.getElementById('test-grid-container'),
    tabs: document.querySelectorAll('.tab'),
    sectionTabs: document.querySelectorAll('.section-tab'),
    themeToggle: document.getElementById('themeToggle'),
    btnCGL: document.getElementById('btn-cgl'),
    btnCHSL: document.getElementById('btn-chsl'),
    btnDP: document.getElementById('btn-dp'),
    sectionInfoBanner: document.getElementById('section-info-banner'),
    sectionInfoIcon: document.getElementById('section-info-icon'),
    sectionInfoTitle: document.getElementById('section-info-title'),
    sectionInfoDesc: document.getElementById('section-info-desc')
};

document.addEventListener('DOMContentLoaded', () => {
    try {
        const currentVersion = '2';
        const storedVersion = localStorage.getItem('attemptsStoreVersion');
        if (storedVersion !== currentVersion) {
            localStorage.removeItem('testResults');
            localStorage.removeItem('testResult');
            localStorage.removeItem('viewAttempt');
            localStorage.removeItem('testId');
            localStorage.setItem('attemptsStoreVersion', currentVersion);
        }
    } catch (_) {}
    // ==================== PERFORMANCE: Apply theme BEFORE paint ====================
    (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    // ==================== INITIALIZATION =====================
    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';
    let currentSection = 'sectional';
    let historyMap = {};
    let isHistoryLoaded = false;
    const BATCH_SIZE = 24;
    let currentFilteredTests = [];
    let renderIndex = 0;
    let io = null;
    let sentinel = null;
    let lastAttemptsMap = {};
    const lastAttemptsCache = {};
    
    // ==================== PERFORMANCE: Debounce function ====================
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // ==================== PERFORMANCE: Throttle for scroll events ====================
    function throttle(func, limit) {
        let inThrottle;
        return function(...args) {
            if (!inThrottle) {
                func.apply(this, args);
                inThrottle = true;
                setTimeout(() => inThrottle = false, limit);
            }
        };
    }

    // Configuration
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 25,
        "Top100Maths": 60
    };

    const SECTION_CONFIG = {
        sectional: {
            icon: '📋',
            title: 'Sectional Tests',
            description: 'Practice topic-wise questions to strengthen your fundamentals'
        },
        fullmock: {
            icon: '📝',
            title: 'Full Mock Tests',
            description: 'Complete exam simulation with all subjects and real exam pattern'
        },
        chapterwise: {
            icon: '📚',
            title: 'Chapterwise Tests',
            description: 'Master each chapter with focused practice tests'
        }
    };

    const CHAPTERWISE_CATALOG = {
        Maths: {
            Arithmetic: [
                'Number System','Percentage','Profit & Loss','Simple Interest','Compound Interest',
                'Ratio & Proportion','Averages','Mixture & Alligation','Time & Work','Pipes & Cisterns',
                'Time, Speed & Distance','Boats & Streams','Trains'
            ],
            Advanced: [
                'Algebra','Geometry','Mensuration','Trigonometry','Coordinate Geometry'
            ]
        },
        Reasoning: [
            'Analogy','Classification','Series','Coding-Decoding','Blood Relations','Direction Sense',
            'Syllogism','Venn Diagrams','Seating Arrangement','Puzzles','Clocks & Calendars','Non-Verbal'
        ],
        English: [
            'Grammar','Spotting Errors','Sentence Improvement','Fill in the Blanks','Cloze Test',
            'Synonyms & Antonyms','One Word Substitution','Idioms & Phrases','Para Jumbles','Reading Comprehension'
        ],
        GK: [
            'History','Polity','Geography','Economics','Science','Static GK','Current Affairs','Computer Awareness'
        ]
    };

    function slugify(s) {
        return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    }

    function buildChapterwiseTests(exam, subject) {
        const out = [];
        if (subject === 'Maths' && CHAPTERWISE_CATALOG.Maths) {
            const groups = CHAPTERWISE_CATALOG.Maths;
            Object.keys(groups).forEach(group => {
                groups[group].forEach(ch => {
                    out.push({
                        id: `${exam}_CH_${subject}_${slugify(ch)}`,
                        title: `${ch} (${group})`,
                        subject: subject,
                        section: 'chapterwise',
                        exam: exam,
                        chapter: ch,
                        questions: 25
                    });
                });
            });
            return out;
        }
        const arr = CHAPTERWISE_CATALOG[subject];
        if (Array.isArray(arr)) {
            arr.forEach(ch => {
                out.push({
                    id: `${exam}_CH_${subject}_${slugify(ch)}`,
                    title: ch,
                    subject: subject,
                    section: 'chapterwise',
                    exam: exam,
                    chapter: ch,
                    questions: 25
                });
            });
        }
        return out;
    }

    function getChapterCount(subject) {
        if (subject === 'Maths' && CHAPTERWISE_CATALOG.Maths) {
            const g = CHAPTERWISE_CATALOG.Maths;
            return (g.Arithmetic?.length || 0) + (g.Advanced?.length || 0);
        }
        const arr = CHAPTERWISE_CATALOG[subject];
        return Array.isArray(arr) ? arr.length : 0;
    }

    // ==================== THEME MANAGEMENT (Optimized) ====================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        
        // Use requestAnimationFrame to prevent layout thrashing
        requestAnimationFrame(() => {
            document.body.classList.toggle('dark-mode', isDark);
            elements.themeToggle.checked = isDark;
            
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) {
                metaTheme.setAttribute('content', isDark ? '#0f172a' : '#6366f1');
            }
        });
    }
    
    elements.themeToggle.addEventListener('change', () => {
        const newTheme = elements.themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // ==================== DATA VALIDATION ====================
    if (typeof ALL_TESTS === 'undefined' || !Array.isArray(ALL_TESTS)) {
        elements.mainTitle.innerHTML = `Tests are currently <strong>Unavailable</strong>`;
        elements.gridContainer.innerHTML = `
            <div class="no-tests-message">
                <div class="icon">⚠️</div>
                <h3>Data Not Found</h3>
                <p>The test data file is missing or invalid. Please try again later.</p>
            </div>`;
        return;
    }

    // ==================== LOAD USER HISTORY (NON-BLOCKING) ====================
    function loadHistory() {
        if (!window.ExamAxisAPI || !ExamAxisAPI.isLoggedIn()) {
            historyMap = {};
            isHistoryLoaded = true;
            return;
        }
        
        // First, try to load from localStorage as fallback
        try {
            const savedResults = localStorage.getItem('testResults');
            if (savedResults) {
                const results = JSON.parse(savedResults);
                historyMap = results;
                console.log('📦 Loaded test results from localStorage:', Object.keys(results).length, 'tests');
            }
        } catch (e) {
            console.warn('⚠️ Failed to load from localStorage:', e);
        }
        
        isHistoryLoaded = true;
    }

    // ==================== HELPER FUNCTIONS ====================
    function getFilteredTests(exam, subject, section) {
        // DEBUG: Check if ALL_TESTS is loaded
        console.log('🔍 FILTER DEBUG:', {
            exam,
            subject, 
            section,
            allTestsCount: typeof ALL_TESTS !== 'undefined' ? ALL_TESTS.length : 'undefined',
            hasTests: typeof ALL_TESTS !== 'undefined' && ALL_TESTS.length > 0
        });
        
        if (typeof ALL_TESTS === 'undefined' || ALL_TESTS.length === 0) {
            console.error('❌ ALL_TESTS not loaded! Check tests-list.js');
            return [];
        }
        
        // DEBUG: Check for chapterwise tests specifically
        if (section === 'chapterwise') {
            const chapterwiseTests = ALL_TESTS.filter(test => test.section === 'chapterwise');
            console.log('📚 CHAPTERWISE DEBUG:', {
                totalChapterwise: chapterwiseTests.length,
                exam,
                subject,
                sampleTests: chapterwiseTests.slice(0, 3).map(t => ({
                    id: t.id,
                    title: t.title,
                    subject: t.subject,
                    exam: t.exam
                }))
            });
        }
        
        if (exam === 'CHSL' && subject === 'Top100Maths') {
            const filtered = ALL_TESTS.filter(test => 
                test.exam === 'CHSL_TOP_100_MATHS' && 
                (test.section === section || (!test.section && section === 'sectional'))
            );
            console.log('✅ Top100Maths filtered:', filtered.length, 'tests');
            return filtered;
        }
        
        const filtered = ALL_TESTS.filter(test => {
            const examMatch = test.exam === exam;
            const subjectMatch = (section === 'fullmock' && test.subject === 'All') 
                                 || test.subject === subject;
            const sectionMatch = (test.section === section) || 
                                 (!test.section && section === 'sectional');
            return examMatch && subjectMatch && sectionMatch;
        });
        
        console.log('✅ Standard filtered:', filtered.length, 'tests for', exam, subject, section);
        return filtered;
    }

    function getTestCountBySection(exam, subject) {
        const counts = { sectional: 0, fullmock: 0, chapterwise: 0 };

        if (exam === 'CHSL' && subject === 'Top100Maths') {
            ALL_TESTS.filter(test => test.exam === 'CHSL_TOP_100_MATHS').forEach(test => {
                const section = test.section || 'sectional';
                if (counts[section] !== undefined) counts[section]++;
            });
        } else {
            ALL_TESTS.filter(test => {
                const examMatch = test.exam === exam;
                const subjectMatch = (test.section === 'fullmock' && test.subject === 'All') 
                                     || test.subject === subject;
                return examMatch && subjectMatch;
            }).forEach(test => {
                const section = test.section || 'sectional';
                if (counts[section] !== undefined) counts[section]++;
            });
        }

        // counts reflect only tests present in ALL_TESTS

        return counts;
    }

    function updateSectionCounts() {
        const counts = getTestCountBySection(currentExam, currentSubject);
        document.getElementById('sectional-count').textContent = counts.sectional;
        document.getElementById('fullmock-count').textContent = counts.fullmock;
        document.getElementById('chapterwise-count').textContent = counts.chapterwise;
    }

    function updateSectionInfoBanner() {
        const config = SECTION_CONFIG[currentSection];
        elements.sectionInfoIcon.textContent = config.icon;
        elements.sectionInfoTitle.textContent = config.title;
        elements.sectionInfoDesc.textContent = config.description;
        elements.sectionInfoBanner.className = `section-info-banner section-${currentSection}`;
    }

    // (removed subject quick-switch for chapterwise placeholder)

    // ==================== PERFORMANCE: Use DocumentFragment for batch DOM updates ====================
    function generateCardHTML(test, index) {
        const fullTitle = test.date ? `${test.date} ${test.title}` : test.title;
        const isChapter = (test.section === 'chapterwise' || currentSection === 'chapterwise');
        const la = lastAttemptsMap[String(test.id)];
        // For chapterwise tests, don't rely on test.questions (backend decides count)
        const questions = isChapter 
            ? (typeof la?.totalQuestions === 'number' ? la.totalQuestions : null)
            : (test.questions || 25);
        
        let time;

    // ==================== PERFORMANCE: Optimized displayTests ====================
    function loadLastAttemptsForTests(tests) {
        lastAttemptsMap = {};
        const ids = tests.map(t => t.id).filter(Boolean);
        const cacheKey = ids.sort().join(',');
        const token = (typeof ExamAxisAPI !== 'undefined' && ExamAxisAPI.getToken) ? ExamAxisAPI.getToken() : localStorage.getItem('token');
        if (!token || !ids.length) return Promise.resolve();
        const attemptsDirty = localStorage.getItem('attemptsDirty') === '1';
        if (!attemptsDirty && lastAttemptsCache[cacheKey]) {
            lastAttemptsMap = lastAttemptsCache[cacheKey];
            console.log('📦 Using cached last attempts for', ids.length, 'tests');
            return Promise.resolve();
        }
        const qs = encodeURIComponent(cacheKey);
        console.log('🔄 Fetching last attempts for testIds:', qs);
        return ExamAxisAPI.request(`/api/tests/last-attempts?testIds=${qs}`).then(({ response, data }) => {
            if (response && response.ok && data && data.data && data.data.lastAttempts) {
                lastAttemptsMap = data.data.lastAttempts || {};
                lastAttemptsCache[cacheKey] = lastAttemptsMap;
                try { localStorage.removeItem('attemptsDirty'); } catch (_) {}
                console.log('✅ Last attempts loaded:', Object.keys(lastAttemptsMap).length, 'tests have attempts');
                // Debug: Log each testId with its attempt data
                Object.entries(lastAttemptsMap).forEach(([testId, attempt]) => {
                    console.log(`📝 Test ${testId}:`, attempt ? 'has attempt' : 'no attempt');
                });
            } else {
                console.warn('⚠️ Failed to load last attempts:', response?.status, data?.message);
                lastAttemptsMap = {};
            }
        }).catch((error) => {
            console.error('❌ Error loading last attempts:', error);
            lastAttemptsMap = {};
        });
    }

    const displayTests = debounce(function() {

        updateSectionCounts();
        updateSectionInfoBanner();
        loadLastAttemptsForTests(filteredTests).then(() => {
            updateLastAttemptsUI(filteredTests);
        });
        
        // Use requestAnimationFrame for smooth rendering
        requestAnimationFrame(() => {
            elements.gridContainer.style.opacity = '0';
            
            requestAnimationFrame(() => {
                // cleanup previous infinite scroll
                if (io) { try { io.disconnect(); } catch(_){} io = null; }
                if (sentinel && sentinel.parentNode) { try { sentinel.parentNode.removeChild(sentinel); } catch(_){} }
                elements.gridContainer.innerHTML = '';

                if (filteredTests.length > 0) {
                    // optional header for Top100Maths
                    if (currentSubject === 'Top100Maths') {
                        elements.gridContainer.insertAdjacentHTML('beforeend', `
                            <div class="section-header top100-header">
                                <h2>🔥 MATHS TOP 100 - 2025</h2>
                                <p>Master the most important 100 questions for SSC CHSL 2025</p>
                            </div>`);
                    }
                    currentFilteredTests = filteredTests;
                    renderIndex = 0;
                    // initial batch
                    try { appendBatch(); } catch (e) { renderIndex = 0; }
                    // setup sentinel
                    sentinel = document.createElement('div');
                    sentinel.style.height = '1px';
                    sentinel.style.width = '100%';
                    elements.gridContainer.appendChild(sentinel);
                    io = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                try { appendBatch(); } catch (_) {}
                            }
                        });
                    }, { rootMargin: '200px 0px' });
                    io.observe(sentinel);
                    // fallback: if nothing was rendered, use original full render
                    if (renderIndex === 0 && currentFilteredTests.length > 0) {
                        let html = '';
                        if (currentSubject === 'Top100Maths') {
                            html += `
                                <div class="section-header top100-header">
                                    <h2>🔥 MATHS TOP 100 - 2025</h2>
                                    <p>Master the most important 100 questions for SSC CHSL 2025</p>
                                </div>`;
                        }
                        html += currentFilteredTests.map((test, i) => generateCardHTML(test, i)).join('');
                        elements.gridContainer.innerHTML = html;
                        if (io) { try { io.disconnect(); } catch(_){} io = null; }
                        sentinel = null;
                    }
                } else {
                    const sectionName = SECTION_CONFIG[currentSection].title;
                    const sectionIcon = SECTION_CONFIG[currentSection].icon;
                    
                    let message;

                                <span>✓ Detailed analysis</span>
                            </div>
                        </div>`;
                    } else if (currentSection === 'chapterwise') {
                        message = `<div class="no-tests-message section-chapterwise">
                            <div class="icon">${sectionIcon}</div>
                            <h3>Chapterwise Tests Coming Soon!</h3>
                            <p>Master each chapter of ${currentSubject} with focused practice.</p>
                            <div class="coming-soon-features">
                                <span>✓ Topic-wise practice</span>
                                <span>✓ Difficulty levels</span>

                            <h3>Coming Soon!</h3>

    function appendBatch() {
        if (!currentFilteredTests.length) return;
        const end = Math.min(renderIndex + BATCH_SIZE, currentFilteredTests.length);
        if (renderIndex >= end) return;
        const frag = document.createDocumentFragment();
        for (let i = renderIndex; i < end; i++) {
            const div = document.createElement('div');
            div.innerHTML = generateCardHTML(currentFilteredTests[i], i);
            frag.appendChild(div.firstElementChild);
        }
        elements.gridContainer.insertBefore(frag, sentinel);
        updateLastAttemptsUI(currentFilteredTests.slice(renderIndex, end));
        renderIndex = end;
        if (renderIndex >= currentFilteredTests.length && io) {
            try { io.disconnect(); } catch(_) {}
            io = null;
            if (sentinel && sentinel.parentNode) { try { sentinel.parentNode.removeChild(sentinel); } catch(_){} }
            sentinel = null;
        }
    }

            const minutes = Math.round(((data.timeTaken ?? 0) / 60));

            const correct = data.correctAnswers ?? data.correct ?? 0;
            const wrong = data.wrongAnswers ?? data.incorrect ?? 0;
            const unans = data.unanswered ?? data.unattempted ?? 0;
            if (titleEl) titleEl.textContent = test ? (test.date ? `${test.date} ${test.title}` : test.title) : `Test ${testId}`;

            if (timeEl) timeEl.textContent = `${minutes}m • ${submitted}`;
            if (detailsEl) detailsEl.textContent = `Correct: ${correct} • Wrong: ${wrong} • Unanswered: ${unans}`;
            try {
                localStorage.setItem('testId', String(testId));
                localStorage.setItem('viewAttempt', JSON.stringify({ testId: String(testId), lastAttempt: data }));
            } catch (_) {}
            if (viewBtn) viewBtn.setAttribute('href', `result.html?testId=${encodeURIComponent(testId)}&viewOnly=1`);

            const tabs = [...tablist.querySelectorAll('[role="tab"]:not([style*="display: none"])')];
            const currentIndex = tabs.indexOf(document.activeElement);
            
            let newIndex;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                newIndex = (currentIndex + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            } else if (e.key === 'Home') {
                newIndex = 0;
            } else if (e.key === 'End') {
                newIndex = tabs.length - 1;

    // Get user data from localStorage (same logic as other functions)
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const isPremium = 
        user.plan === 'premium' || 
        user.isPremium === true || 
        user.subscription === 'premium' ||
        user.premium === true ||
        user.role === 'premium' ||
        user.role === 'admin' ||  // Admin is also premium
        user.userType === 'premium' ||
        user.membership === 'premium' ||
        user.access === 'premium' ||
        (user.plan && user.plan.toLowerCase().includes('premium')) ||
        (user.subscription && user.subscription.toLowerCase().includes('premium'));
    
    if (isPremium) {
        const btn = document.getElementById('goPremiumBtn');
        if (btn) {
            btn.innerHTML = '<i class="fas fa-crown"></i> Premium User';
            btn.style.background = 'linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)';
            btn.style.cursor = 'default';
            btn.onclick = (e) => {
                e.preventDefault();
                return false;
            };
        }
    }
}

async function initTelegramPopup() {
    const popup = document.getElementById('telegramPopup');
    const joinBtn = document.getElementById('telegramPopupJoin');
    const closeBtn = document.getElementById('telegramPopupClose');
    if (!popup || !joinBtn || !closeBtn) return;
    const userId = localStorage.getItem('userId') || localStorage.getItem('user_id');
    const token = localStorage.getItem('token');
    if (!userId || !token) return;
    const key = `telegramJoined:${userId}`;
    let isPremium = false;
    try {
        if (typeof PremiumAccess !== 'undefined' && PremiumAccess.checkPremiumStatus) {
            isPremium = await PremiumAccess.checkPremiumStatus();
        } else if (typeof ExamAxisAPI !== 'undefined') {
            const { data } = await ExamAxisAPI.request('/api/payment/premium-status');
            isPremium = !!(data && data.data && data.data.isPremium);
        }
    } catch (_) {}
    if (!isPremium) return;
    let joined = localStorage.getItem(key) === 'true';
    if (!joined && typeof ExamAxisAPI !== 'undefined') {
        try {
            const { data } = await ExamAxisAPI.request('/api/support/telegram/status');
            joined = data && data.data && data.data.joined === true;
            if (joined) localStorage.setItem(key, 'true'); else localStorage.removeItem(key);
        } catch (_) {}
    }
    if (joined) return;
    popup.style.display = 'flex';
    closeBtn.onclick = function(e) {
        e.preventDefault();
        popup.style.display = 'none';
    };
    joinBtn.onclick = async function(e) {
        e.preventDefault();
        joinBtn.disabled = true;
        const inviteLink = 'https://t.me/+wkVQs6V5sEkyODI9';
        window.open(inviteLink, '_blank', 'noopener');
        try {
            localStorage.setItem(key, 'true');
            if (typeof ExamAxisAPI !== 'undefined') {
                await ExamAxisAPI.request('/api/support/telegram/mark-joined', { method: 'POST' });
            }
        } catch (_) {}
        popup.style.display = 'none';
    };
}
</script>
