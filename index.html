<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam-Axis | SSC Mock Tests</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Variables and Global Reset --- */
        :root {
            --light-bg: #f0f4f8;
            --light-card-bg: #ffffff;
            --light-text-primary: #1a202c;
            --light-text-secondary: #64748b;
            --light-border: #e2e8f0;
            --light-shadow: rgba(26, 32, 44, 0.08);
            --light-hover-bg: #f8fafc;

            --dark-bg: #0a0f1a;
            --dark-card-bg: #141b2d;
            --dark-text-primary: #f1f5f9;
            --dark-text-secondary: #94a3b8;
            --dark-border: #1e293b;
            --dark-shadow: rgba(0, 0, 0, 0.5);
            --dark-hover-bg: #1e293b;

            --primary-brand: #6366f1;
            --primary-brand-light: #818cf8;
            --secondary-brand: #a855f7;
            --accent-new: #ef4444;
            --accent-new-light: #fca5a5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            
            --cgl-color: #6366f1;
            --cgl-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --chsl-color: #10b981;
            --chsl-gradient: linear-gradient(135deg, #10b981, #34d399);
            --dp-color: #f59e0b;
            --dp-gradient: linear-gradient(135deg, #f59e0b, #fbbf24);
            
            --card-radius: 20px;
            --btn-radius: 12px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.4s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--light-bg);
            color: var(--light-text-primary);
            margin: 0;
            padding: 0;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            min-height: 100vh;
            line-height: 1.6;
        }

        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--dark-text-primary);
        }

        /* --- Scrollbar Styling --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light-bg);
        }

        body.dark-mode ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-brand);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-brand);
        }

        /* --- TOP NAV BAR --- */
        .top-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all var(--transition-normal);
        }

        body.dark-mode .top-nav {
            background: rgba(20, 27, 45, 0.9);
            border-bottom-color: rgba(30, 41, 59, 0.8);
        }

        .brand-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo::before {
            content: "📚";
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
        }

        body.exam-chsl .brand-logo {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 22px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: var(--btn-radius);
            text-decoration: none;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .login-btn {
            border: 2px solid var(--primary-brand);
            color: var(--primary-brand);
            background-color: transparent;
        }

        .login-btn:hover {
            background: var(--primary-brand);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .signup-btn {
            background: var(--cgl-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        body.exam-chsl .login-btn {
            border-color: var(--chsl-color);
            color: var(--chsl-color);
        }

        body.exam-chsl .login-btn:hover {
            background: var(--chsl-color);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        body.exam-chsl .signup-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* --- THEME SWITCH --- */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 50px;
            background: linear-gradient(145deg, #f8fafc, #e2e8f0);
            border: 1px solid var(--light-border);
            transition: all var(--transition-normal);
        }

        body.dark-mode .theme-switch-wrapper {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-color: var(--dark-border);
        }

        .theme-switch-wrapper span {
            font-size: 1.1rem;
            line-height: 1;
            transition: transform var(--transition-fast);
        }

        .theme-switch-wrapper:hover span:first-child {
            transform: rotate(-20deg);
        }

        .theme-switch-wrapper:hover span:last-child {
            transform: rotate(20deg);
        }

        .theme-switch {
            display: inline-block;
            height: 26px;
            position: relative;
            width: 50px;
        }

        .theme-switch input {
            display: none;
        }

        .slider {
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: var(--transition-normal);
            border-radius: 34px;
        }

        .slider:before {
            background-color: white;
            bottom: 3px;
            content: "";
            height: 20px;
            left: 3px;
            position: absolute;
            transition: var(--transition-normal);
            width: 20px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input:checked + .slider {
            background: var(--cgl-gradient);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* --- MAIN CONTAINER --- */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        /* --- HEADER --- */
        .header-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .header-title-section h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .header-title-section strong {
            background: var(--cgl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-chsl .header-title-section strong {
            background: var(--chsl-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.exam-dp .header-title-section strong {
            background: var(--dp-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title-section .sub-heading {
            font-size: 1.15rem;
            color: var(--light-text-secondary);
            margin: 0;
            font-weight: 500;
        }

        body.dark-mode .header-title-section .sub-heading {
            color: var(--dark-text-secondary);
        }

        /* --- EXAM SELECTOR --- */
        .exam-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .exam-btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid var(--light-border);
            border-radius: 14px;
            background: var(--light-card-bg);
            color: var(--light-text-secondary);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .exam-btn {
            background: var(--dark-card-bg);
            border-color: var(--dark-border);
            color: var(--dark-text-secondary);
        }

        .exam-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .exam-btn.active {
            background: var(--cgl-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }

        .exam-btn.active.chsl {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
        }

        .exam-btn.active.dp {
            background: var(--dp-gradient);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
        }

        /* Ripple effect on click */
        .exam-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s, opacity 0.3s;
        }

        .exam-btn:active::after {
            transform: scale(2);
            opacity: 1;
            transition: 0s;
        }

        /* --- TABS --- */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
            padding: 8px;
            background: var(--light-card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
            justify-content: center;
            border: 1px solid var(--light-border);
        }

        body.dark-mode .tabs-container {
            background: var(--dark-card-bg);
            border-color: var(--dark-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .tab {
            padding: 12px 28px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--light-text-secondary);
            border-radius: 10px;
            transition: all var(--transition-normal);
            white-space: nowrap;
            position: relative;
        }

        body.dark-mode .tab {
            color: var(--dark-text-secondary);
        }

        .tab:hover:not(.active) {
            background: var(--light-hover-bg);
            color: var(--primary-brand);
        }

        body.dark-mode .tab:hover:not(.active) {
            background: var(--dark-hover-bg);
        }

        body.exam-chsl .tab:hover:not(.active) {
            color: var(--chsl-color);
        }

        .tab.active {
            background: var(--cgl-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        body.exam-chsl .tab.active {
            background: var(--chsl-gradient);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        body.exam-dp .tab.active {
            background: var(--dp-gradient);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        /* --- GRID & CARDS --- */
        @keyframes card-fade-in {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .test-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            transition: opacity var(--transition-normal);
        }

        .test-card {
            position: relative;
            background: var(--light-card-bg);
            border: 1px solid var(--light-border);
            border-radius: var(--card-radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-normal);
            animation: card-fade-in 0.5s ease-out forwards;
            opacity: 0;
            overflow: hidden;
        }

        body.dark-mode .test-card {
            background: var(--dark-card-bg);
            border-color: var(--dark-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        body.exam-chsl .test-card:hover {
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
        }

        body.exam-dp .test-card:hover {
            box-shadow: 0 20px 50px rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
        }

        /* Card top accent line */
        .test-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--cgl-gradient);
            border-radius: var(--card-radius) var(--card-radius) 0 0;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        body.exam-chsl .test-card::before {
            background: var(--chsl-gradient);
        }

        body.exam-dp .test-card::before {
            background: var(--dp-gradient);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* Badges */
        .new-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .attempted-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .attempted-badge::before {
            content: "✓";
            font-weight: 900;
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 10px;
            text-align: center;
            color: var(--light-text-primary);
            width: 100%;
            letter-spacing: -0.3px;
            line-height: 1.4;
        }

        body.dark-mode .card-title {
            color: var(--dark-text-primary);
        }

        .test-card hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--light-border), transparent);
            width: 100%;
            margin: 0 0 24px 0;
        }

        body.dark-mode .test-card hr {
            background: linear-gradient(90deg, transparent, var(--dark-border), transparent);
        }

        .card-stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            gap: 15px;
        }

        .stat-item {
            flex: 1;
            padding: 12px 8px;
            background: var(--light-bg);
            border-radius: 12px;
            transition: all var(--transition-fast);
        }

        body.dark-mode .stat-item {
            background: rgba(30, 41, 59, 0.5);
        }

        .stat-item:hover {
            transform: scale(1.05);
        }

        .stat-item .value {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-brand);
            line-height: 1.1;
            margin-bottom: 4px;
        }

        body.exam-chsl .stat-item .value {
            color: var(--chsl-color);
        }

        body.exam-dp .stat-item .value {
            color: var(--dp-color);
        }

        body.dark-mode .stat-item .value {
            color: var(--primary-brand-light);
        }

        .stat-item .label {
            font-size: 0.7rem;
            color: var(--light-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        body.dark-mode .stat-item .label {
            color: var(--dark-text-secondary);
        }

        /* Last Score */
        .last-score {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--light-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .last-score::before {
            content: "📊";
        }

        body.dark-mode .last-score {
            color: var(--dark-text-secondary);
            background: rgba(16, 185, 129, 0.15);
        }

        .last-score.not-attempted {
            background: rgba(148, 163, 184, 0.1);
            border-color: rgba(148, 163, 184, 0.2);
        }

        .last-score.not-attempted::before {
            content: "📝";
        }

        /* --- ATTEMPT BUTTON --- */
        .attempt-btn {
            background: var(--cgl-gradient);
            color: white;
            text-align: center;
            padding: 16px 50px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: auto;
            transition: all var(--transition-normal);
            white-space: nowrap;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
            width: 100%;
            max-width: 260px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .attempt-btn::before {
            content: "→";
            font-size: 1.2rem;
            transition: transform var(--transition-normal);
        }

        .attempt-btn:hover::before {
            transform: translateX(5px);
        }

        body.exam-chsl .attempt-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
        }

        body.exam-dp .attempt-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
        }

        .attempt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.45);
        }

        body.exam-chsl .attempt-btn:hover {
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.45);
        }

        body.exam-dp .attempt-btn:hover {
            box-shadow: 0 12px 35px rgba(245, 158, 11, 0.45);
        }

        /* --- NO TESTS MESSAGE --- */
        .no-tests-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 30px;
            background: var(--light-card-bg);
            border-radius: var(--card-radius);
            border: 2px dashed var(--light-border);
        }

        body.dark-mode .no-tests-message {
            background: var(--dark-card-bg);
            border-color: var(--dark-border);
        }

        .no-tests-message .icon {
            font-size: 4.5rem;
            margin-bottom: 20px;
            display: block;
        }

        .no-tests-message h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: var(--light-text-primary);
            font-weight: 700;
        }

        body.dark-mode .no-tests-message h3 {
            color: var(--dark-text-primary);
        }

        .no-tests-message p {
            color: var(--light-text-secondary);
            font-size: 1.05rem;
        }

        body.dark-mode .no-tests-message p {
            color: var(--dark-text-secondary);
        }
        
        /* --- HELP BUTTON --- */
        .help-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--cgl-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
            transition: all var(--transition-normal);
            z-index: 999;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        body.exam-chsl .help-btn {
            background: var(--chsl-gradient);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }

        body.exam-dp .help-btn {
            background: var(--dp-gradient);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
        }

        .help-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .help-btn {
            animation: float 3s ease-in-out infinite;
        }

        .help-btn:hover {
            animation: none;
        }

        /* --- TOP 100 MATHS SPECIAL STYLES --- */
        .tab.chsl-only {
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .tab.chsl-only:hover {
            background: linear-gradient(135deg, #ea580c, #f97316);
            transform: translateY(-2px);
        }

        .tab.chsl-only.active {
            background: linear-gradient(135deg, #ea580c, #f97316);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }

        .section-header.top100-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            border-radius: var(--card-radius);
            margin-bottom: 10px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .section-header.top100-header::before {
            content: "🔥";
            position: absolute;
            font-size: 8rem;
            opacity: 0.1;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .section-header.top100-header h2 {
            margin: 0 0 10px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 800;
        }

        .section-header.top100-header p {
            margin: 0;
            opacity: 0.95;
            font-size: 1.05rem;
        }

        .top100-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .test-card.top100-card {
            border: 2px solid #f97316;
            background: linear-gradient(145deg, #fffbf5, #ffffff);
        }

        .test-card.top100-card::before {
            background: linear-gradient(135deg, #f97316, #fb923c);
            opacity: 1;
        }

        body.dark-mode .test-card.top100-card {
            background: linear-gradient(145deg, #1f1a15, #141b2d);
            border-color: #f97316;
        }

        body.dark-mode .section-header.top100-header {
            background: linear-gradient(135deg, #c2410c, #ea580c);
        }

        /* --- FOOTER WAVE DECORATION --- */
        .footer-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--cgl-gradient);
            z-index: 100;
        }

        body.exam-chsl .footer-decoration {
            background: var(--chsl-gradient);
        }

        body.exam-dp .footer-decoration {
            background: var(--dp-gradient);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .top-nav {
                padding: 14px 20px;
                flex-wrap: wrap;
                gap: 12px;
            }
            
            .nav-right {
                gap: 12px;
                width: 100%;
                justify-content: flex-end;
            }
            
            .main-container {
                padding: 30px 20px 80px;
            }

            .header-title-section h1 {
                font-size: 2.2rem;
            }

            .exam-selector {
                gap: 8px;
            }

            .exam-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            .tabs-container {
                justify-content: flex-start;
                padding: 6px;
            }

            .tab {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 600px) {
            .brand-logo {
                font-size: 1.3rem;
            }

            .brand-logo::before {
                font-size: 1.2rem;
            }
            
            .nav-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            
            .theme-switch-wrapper {
                padding: 6px 10px;
            }
            
            .header-title-section h1 {
                font-size: 1.8rem;
            }
            
            .header-title-section .sub-heading {
                font-size: 0.95rem;
            }
            
            .test-grid-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .help-btn {
                width: 55px;
                height: 55px;
                font-size: 24px;
                bottom: 20px;
                right: 20px;
            }
            
            .test-card {
                padding: 24px 20px;
            }
            
            .card-title {
                font-size: 1.15rem;
            }
            
            .stat-item .value {
                font-size: 1.5rem;
            }

            .attempt-btn {
                padding: 14px 40px;
                font-size: 0.95rem;
            }

            .section-header.top100-header h2 {
                font-size: 1.5rem;
            }

            .section-header.top100-header p {
                font-size: 0.9rem;
            }
        }

        /* --- LOADING SKELETON (Optional Enhancement) --- */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 8px;
        }

        body.dark-mode .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="footer-decoration"></div>

<nav class="top-nav">
    <a href="#" class="brand-logo">EXAM-AXIS</a>
    <div class="nav-right">
        <div class="theme-switch-wrapper">
            <span>☀️</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
            <span>🌙</span>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="nav-btn login-btn">Login</a>
            <a href="signup.html" class="nav-btn signup-btn">Create Account</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="header-container">
        <div class="header-title-section">
            <h1 id="main-title">SSC <strong>CGL</strong> Mock Tests</h1>
            <p class="sub-heading">Assess Your Preparation: Start a Test Now</p>
        </div>
    </div>

    <!-- EXAM SELECTOR -->
    <div class="exam-selector">
        <button class="exam-btn active" data-exam="CGL" id="btn-cgl">🎓 SSC CGL</button>
        <button class="exam-btn chsl" data-exam="CHSL" id="btn-chsl">📘 SSC CHSL</button>
        <button class="exam-btn dp" data-exam="DP" id="btn-dp">👮 DP Constable</button>
    </div>

    <div class="tabs-container">
        <div class="tab active" data-subject="Maths">📐 Maths</div>
        <div class="tab" data-subject="Reasoning">🧩 Reasoning</div>
        <div class="tab" data-subject="English">📖 English</div>
        <div class="tab" data-subject="GK">🌍 GK</div>
        <div class="tab chsl-only" data-subject="Top100Maths" style="display: none;">🔥 Maths Top 100</div>
    </div>

    <div id="test-grid-container" class="test-grid-container"></div>
</div>

<div class="help-btn">💬</div>

<!-- 1. API helper (defines ExamAxisAPI, updateNavigation, etc.) -->
<script src="js/api.js"></script>

<!-- 2. Tests list (defines ALL_TESTS) -->
<script src="js/tests-list.js"></script>

<!-- 3. Main page logic -->
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const mainTitle = document.getElementById('main-title');
    const gridContainer = document.getElementById('test-grid-container');
    const tabs = document.querySelectorAll('.tab');
    const themeToggle = document.getElementById('theme-toggle');
    const btnCGL = document.getElementById('btn-cgl');
    const btnCHSL = document.getElementById('btn-chsl');
    const btnDP = document.getElementById('btn-dp');

    // State
    let currentExam = 'CGL';
    let currentSubject = 'Maths';

    // Map: testId -> last attempt object
    let historyMap = {};

    // Config
    const SUBJECT_DISPLAY_TIMES = {
        "Maths": 25,
        "Reasoning": 20,
        "English": 15,
        "GK": 10,
        "General": 25,
        "Top100Maths": 60
    };

    // --- DARK MODE LOGIC ---
    function applyTheme(theme) {
        document.body.classList.toggle('dark-mode', theme === 'dark');
        themeToggle.checked = theme === 'dark';
    }
    
    themeToggle.addEventListener('change', () => {
        const newTheme = themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // --- DATA CHECK ---
    if (typeof ALL_TESTS === 'undefined' || !Array.isArray(ALL_TESTS)) {
        mainTitle.innerHTML = `Tests are currently <strong>Unavailable</strong>`;
        gridContainer.innerHTML = `
            <div class="no-tests-message">
                <div class="icon">⚠️</div>
                <h3>Data Not Found</h3>
                <p>The file <strong>js/tests-list.js</strong> is missing or invalid.</p>
            </div>`;
        return;
    }

    // --- LOAD USER HISTORY (if logged in) ---
    async function loadHistory() {
        if (!window.ExamAxisAPI || !ExamAxisAPI.isLoggedIn()) {
            historyMap = {};
            return;
        }

        try {
            const res = await ExamAxisAPI.getTestHistory();
            historyMap = {};

            if (res.success && res.data && Array.isArray(res.data.attempts)) {
                res.data.attempts.forEach(a => {
                    const key = String(a.testId);
                    const existing = historyMap[key];

                    if (!existing || new Date(a.createdAt) > new Date(existing.createdAt)) {
                        historyMap[key] = a;
                    }
                });
            }
        } catch (err) {
            console.error('Failed to load history:', err);
            historyMap = {};
        }
    }

    // --- HELPER FUNCTIONS ---
    function getFilteredTests(exam, subject) {
        // Special handling for CHSL Top 100 Maths
        if (exam === 'CHSL' && subject === 'Top100Maths') {
            return ALL_TESTS.filter(test => test.exam === 'CHSL_TOP_100_MATHS');
        }
        return ALL_TESTS.filter(test => test.exam === exam && test.subject === subject);
    }

    // --- CARD HTML ---
    function generateCardHTML(test) {
        const fullTitle = `${test.date} ${test.title}`;
        const newBadge = test.isNew ? '<div class="new-badge">NEW</div>' : '';

        const questions = test.questions || 25;
        
        // Special time for CHSL_TOP_100_MATHS (50 questions = 60 mins)
        let time;
        if (test.exam === 'CHSL_TOP_100_MATHS') {
            time = 60;
        } else {
            time = SUBJECT_DISPLAY_TIMES[test.subject] || SUBJECT_DISPLAY_TIMES["General"];
        }

        const attempt = historyMap[String(test.id)];
        const attemptedBadge = attempt
            ? '<div class="attempted-badge">Attempted</div>'
            : '';
        const lastScoreHtml = attempt
            ? `<div class="last-score">Last score: <strong>${attempt.score}/${attempt.maxScore}</strong></div>`
            : `<div class="last-score not-attempted">Not attempted yet</div>`;

        // Special badge for CHSL_TOP_100_MATHS tests
        const top100Badge = test.exam === 'CHSL_TOP_100_MATHS' 
            ? '<div class="top100-badge">🔥 TOP 100</div>' 
            : '';

        return `
            <div class="test-card ${test.exam === 'CHSL_TOP_100_MATHS' ? 'top100-card' : ''}">
                ${newBadge}
                ${top100Badge}
                ${attemptedBadge}
                <div class="card-title">${fullTitle}</div>
                <hr>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="value">${questions}</div>
                        <div class="label">Questions</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${questions * 2}</div>
                        <div class="label">Marks</div>
                    </div>
                    <div class="stat-item">
                        <div class="value">${time}</div>
                        <div class="label">Minutes</div>
                    </div>
                </div>
                ${lastScoreHtml}
                <a href="test.html?testId=${test.id}" class="attempt-btn">Start Test</a>
            </div>`;
    }

    function animateCards() {
        const cards = gridContainer.querySelectorAll('.test-card');
        cards.forEach((card, index) => {
            card.style.animationDelay = `${index * 0.08}s`;
        });
    }

    async function displayTests() {
        const filteredTests = getFilteredTests(currentExam, currentSubject);

        gridContainer.style.opacity = 0;

        setTimeout(() => {
            if (filteredTests.length > 0) {
                // Add section header for Top 100 Maths
                let headerHTML = '';
                if (currentSubject === 'Top100Maths') {
                    headerHTML = `
                        <div class="section-header top100-header">
                            <h2>🔥 MATHS TOP 100 - 2025</h2>
                            <p>Master the most important 100 questions for SSC CHSL 2025</p>
                        </div>
                    `;
                }
                
                gridContainer.innerHTML = headerHTML + filteredTests.map(test => generateCardHTML(test)).join('');
                setTimeout(() => {
                    gridContainer.style.opacity = 1;
                    animateCards();
                }, 50);
            } else {
                let message = currentSubject === 'Top100Maths' 
                    ? `<div class="no-tests-message">
                        <div class="icon">🔥</div>
                        <h3>Maths Top 100 - Coming Soon!</h3>
                        <p>Top 100 most important Maths questions for SSC CHSL 2025 will be available soon!</p>
                    </div>`
                    : `<div class="no-tests-message">
                        <div class="icon">📭</div>
                        <h3>Coming Soon!</h3>
                        <p>No ${currentSubject} tests for SSC ${currentExam} yet. Check back soon!</p>
                    </div>`;
                
                gridContainer.innerHTML = message;
                gridContainer.style.opacity = 1;
            }
        }, 200);
    }

    function updateTabsForExam(exam) {
        tabs.forEach(tab => {
            const subject = tab.dataset.subject;
            
            // Hide English for DP
            if (exam === "DP" && subject === "English") {
                tab.style.display = "none";
            } 
            // Show Top 100 Maths only for CHSL
            else if (subject === "Top100Maths") {
                tab.style.display = exam === "CHSL" ? "block" : "none";
            }
            else {
                tab.style.display = "block";
            }
        });

        // Reset to Maths if current subject is hidden
        if (exam === "DP" && currentSubject === "English") {
            currentSubject = "Maths";
            tabs.forEach(tab => {
                tab.classList.toggle("active", tab.dataset.subject === "Maths");
            });
        }
        
        if (exam !== "CHSL" && currentSubject === "Top100Maths") {
            currentSubject = "Maths";
            tabs.forEach(tab => {
                tab.classList.toggle("active", tab.dataset.subject === "Maths");
            });
        }
    }

    function switchExam(exam) {
        currentExam = exam;

        btnCGL.classList.remove('active');
        btnCHSL.classList.remove('active');
        btnDP.classList.remove('active');

        document.body.classList.remove('exam-chsl', 'exam-dp');

        if (exam === 'CGL') {
            btnCGL.classList.add('active');
            mainTitle.innerHTML = `SSC <strong>CGL</strong> Mock Tests`;
        } else if (exam === 'CHSL') {
            btnCHSL.classList.add('active');
            document.body.classList.add('exam-chsl');
            mainTitle.innerHTML = `SSC <strong>CHSL</strong> Mock Tests`;
        } else if (exam === 'DP') {
            btnDP.classList.add('active');
            document.body.classList.add('exam-dp');
            mainTitle.innerHTML = `<strong>DP Constable</strong> Mock Tests`;
        }

        updateTabsForExam(exam);
        displayTests();
    }

    // Exam buttons
    btnCGL.addEventListener('click', () => switchExam('CGL'));
    btnCHSL.addEventListener('click', () => switchExam('CHSL'));
    btnDP.addEventListener('click', () => switchExam('DP'));

    // Subject tabs
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentSubject = tab.dataset.subject;
            displayTests();
        });
    });

    // --- INITIAL LOAD ---
    await loadHistory();
    displayTests();
    if (window.updateNavigation) {
        updateNavigation();
    }
});
</script>

</body>
</html>
