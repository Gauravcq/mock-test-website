<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
</head>
<body>
    <div id="questions-container">
        <!-- JavaScript will dynamically insert question cards here -->
    </div>

    <script>
        // Fixed createQuestionCard function to handle all question types
        function createQuestionCard(question) {
            const card = document.createElement('div');
            card.classList.add('question-card');

            const title = document.createElement('h3');
            title.textContent = question.title;
            card.appendChild(title);

            const description = document.createElement('p');
            description.textContent = question.description;
            card.appendChild(description);

            // Display options based on the question type
            if (question.type === 'multiple-choice' && Array.isArray(question.options)) {
                question.options.forEach(option => {
                    const optionElement = document.createElement('div');
                    optionElement.textContent = option;
                    card.appendChild(optionElement);
                });
            } else if (question.type === 'true-false') {
                const trueOption = document.createElement('div');
                trueOption.textContent = 'True';
                card.appendChild(trueOption);
                const falseOption = document.createElement('div');
                falseOption.textContent = 'False';
                card.appendChild(falseOption);
            }

            const explanation = document.createElement('p');
            explanation.textContent = question.explanation;
            card.appendChild(explanation);

            return card;
        }

        // Example usage
        const exampleQuestion = { 
            title: 'What is the capital of France?', 
            description: 'Choose the correct answer.', 
            type: 'multiple-choice', 
            options: ['Paris', 'London', 'Rome'], 
            explanation: 'Paris is the capital of France.'
        };
        document.getElementById('questions-container').appendChild(createQuestionCard(exampleQuestion));
    </script>
</body>
</html>
