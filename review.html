<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Review - Exam Axis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="js/api.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --info: #0891b2;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title-section h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .title-section p {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .controls-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .language-toggle {
            background: var(--light);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #6b7280;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            color: #6b7280;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stats-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .rank-card {
            background: white;
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .rank-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary);
            font-weight: 900;
        }

        .rank-title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--dark);
        }

        .rank-subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .rank-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .rank-metric {
            text-align: right;
            min-width: 120px;
        }

        .rank-metric .value {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .rank-metric .label {
            color: #6b7280;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .percentile-bar {
            width: 220px;
            height: 10px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .percentile-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--success));
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .questions-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-lg);
        }

        .question-card {
            background: var(--light);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid var(--border);
            transition: all 0.3s ease;
        }

        .question-card.correct {
            border-left-color: var(--success);
            background: rgba(16, 163, 74, 0.05);
        }

        .question-card.incorrect {
            border-left-color: var(--danger);
            background: rgba(220, 38, 38, 0.05);
        }

        .question-card.unattempted {
            border-left-color: #6b7280;
            background: rgba(107, 114, 128, 0.05);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .question-status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-correct {
            background: var(--success);
            color: white;
        }

        .status-incorrect {
            background: var(--danger);
            color: white;
        }

        .status-unattempted {
            background: #6b7280;
            color: white;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .option-item.selected {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary);
        }

        .option-item.correct {
            background: rgba(16, 163, 74, 0.1);
            border-color: var(--success);
        }

        .option-item.incorrect {
            background: rgba(220, 38, 38, 0.1);
            border-color: var(--danger);
        }

        .option-label {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-item.correct .option-label {
            background: var(--success);
            color: white;
        }

        .option-item.incorrect .option-label {
            background: var(--danger);
            color: white;
        }

        .option-item.selected .option-label {
            background: var(--primary);
            color: white;
        }

        .option-text {
            flex: 1;
            line-height: 1.5;
        }

        .explanation {
            background: rgba(37, 99, 235, 0.1);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-text {
            line-height: 1.6;
            color: var(--dark);
        }

        .navigation-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.primary {
            background: var(--primary);
            color: white;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .question-jump {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .jump-input {
            width: 60px;
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls-section {
                width: 100%;
                justify-content: space-between;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .question-header {
                flex-direction: column;
                gap: 10px;
            }

            .navigation-bar {
                flex-direction: column;
            }

            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="title-section">
                    <h1 id="pageTitle">Test Review</h1>
                    <p id="pageSubtitle">Detailed analysis of your test performance</p>
                </div>
                <div class="controls-section">
                    <div class="language-toggle">
                        <button class="lang-btn active" onclick="setLanguage('en')">English</button>
                        <button class="lang-btn" onclick="setLanguage('hi')">हिंदी</button>
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="filterQuestions('all')">
                            <i class="fas fa-list"></i> <span data-en="All" data-hi="सभी">All</span>
                        </button>
                        <button class="filter-btn" onclick="filterQuestions('correct')">
                            <i class="fas fa-check"></i> <span data-en="Correct" data-hi="सही">Correct</span>
                        </button>
                        <button class="filter-btn" onclick="filterQuestions('incorrect')">
                            <i class="fas fa-times"></i> <span data-en="Incorrect" data-hi="गलत">Incorrect</span>
                        </button>
                        <button class="filter-btn" onclick="filterQuestions('unattempted')">
                            <i class="fas fa-minus"></i> <span data-en="Unattempted" data-hi="नहीं दिया">Unattempted</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalQuestions">--</div>
                <div class="stat-label"><span data-en="Total Questions" data-hi="कुल प्रश्न">Total Questions</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correctCount">--</div>
                <div class="stat-label"><span data-en="Correct" data-hi="सही">Correct</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="incorrectCount">--</div>
                <div class="stat-label"><span data-en="Incorrect" data-hi="गलत">Incorrect</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="unattemptedCount">--</div>
                <div class="stat-label"><span data-en="Unattempted" data-hi="नहीं दिया">Unattempted</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracyRate">--</div>
                <div class="stat-label"><span data-en="Accuracy" data-hi="सटीकता">Accuracy</span></div>
            </div>
        </div>

        <div class="rank-card" id="rankCard" style="display:none;">
            <div class="rank-left">
                <div class="rank-badge">#</div>
                <div>
                    <div class="rank-title">Rank & Percentile</div>
                    <div class="rank-subtitle" id="rankSubtitle">--</div>
                </div>
            </div>
            <div class="rank-right">
                <div class="rank-metric">
                    <div class="value" id="rankReviewNumber">--</div>
                    <div class="label">Rank</div>
                </div>
                <div>
                    <div class="rank-metric" style="text-align:left;min-width:220px;">
                        <div class="value" id="percentileReviewValue">--</div>
                        <div class="label">Percentile</div>
                    </div>
                    <div class="percentile-bar" aria-label="Percentile">
                        <div class="percentile-fill" id="percentileReviewFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="questions-container">
            <div id="loadingIndicator" class="loading">
                <i class="fas fa-spinner"></i>
                <p><span data-en="Loading questions..." data-hi="प्रश्न लोड हो रहे हैं...">Loading questions...</span></p>
            </div>
            <div id="questionsList"></div>
        </div>

        <div class="rank-card" id="attemptsSection" style="display:none;">
            <div style="width:100%;">
                <div class="rank-title">Attempts History</div>
                <div id="attemptsList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px;"></div>
            </div>
        </div>

        <div class="navigation-bar">
            <div class="nav-buttons">
                <button class="nav-btn primary" onclick="previousQuestion()" id="prevBtn">
                    <i class="fas fa-chevron-left"></i>
                    <span data-en="Previous" data-hi="पिछला">Previous</span>
                </button>
                <button class="nav-btn primary" onclick="nextQuestion()" id="nextBtn">
                    <span data-en="Next" data-hi="अगला">Next</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <div class="question-jump">
                <span data-en="Jump to Question:" data-hi="प्रश्न पर जाएं:">Jump to Question:</span>
                <input type="number" class="jump-input" id="jumpInput" min="1" onchange="jumpToQuestion()">
                <button class="nav-btn primary" onclick="jumpToQuestion()">
                    <i class="fas fa-arrow-right"></i>
                    <span data-en="Go" data-hi="जाएं">Go</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Translation data
        const translations = {
            en: {
                pageTitle: "Test Review",
                pageSubtitle: "Detailed analysis of your test performance",
                question: "Question",
                yourAnswer: "Your Answer",
                correctAnswer: "Correct Answer",
                explanation: "Explanation",
                notAttempted: "Not Attempted",
                loadingQuestions: "Loading questions...",
                noQuestionsFound: "No questions found for this filter."
            },
            hi: {
                pageTitle: "टेस्ट समीक्षा",
                pageSubtitle: "आपके टेस्ट प्रदर्शन का विस्तृत विश्लेषण",
                question: "प्रश्न",
                yourAnswer: "आपका उत्तर",
                correctAnswer: "सही उत्तर",
                explanation: "स्पष्टीकरण",
                notAttempted: "नहीं दिया गया",
                loadingQuestions: "प्रश्न लोड हो रहे हैं...",
                noQuestionsFound: "इस फिल्टर के लिए कोई प्रश्न नहीं मिला।"
            }
        };

        let currentLanguage = 'en';
        let currentFilter = 'all';
        let currentQuestionIndex = 0;
        let allQuestions = [];
        let filteredQuestions = [];

        // Sample question data (replace with actual data from your test)
        const sampleQuestions = [
            {
                id: 1,
                question: {
                    en: "What is the capital of France?",
                    hi: "फ्रांस की राजधानी क्या है?"
                },
                options: {
                    en: ["London", "Berlin", "Paris", "Madrid"],
                    hi: ["लंदन", "बर्लिन", "पेरिस", "मैड्रिड"]
                },
                correctAnswer: 2,
                userAnswer: 2,
                explanation: {
                    en: "Paris is the capital and largest city of France. It has been the political and cultural center of France since the 12th century.",
                    hi: "पेरिस फ्रांस की राजधानी और सबसे बड़ा शहर है। यह 12वीं शताब्दी से फ्रांस का राजनीतिक और सांस्कृतिक केंद्र रहा है।"
                },
                status: 'correct'
            },
            {
                id: 2,
                question: {
                    en: "Which planet is known as the Red Planet?",
                    hi: "कौन सा ग्रह लाल ग्रह के रूप में जाना जाता है?"
                },
                options: {
                    en: ["Venus", "Mars", "Jupiter", "Saturn"],
                    hi: ["शुक्र", "मंगल", "बृहस्पति", "शनि"]
                },
                correctAnswer: 1,
                userAnswer: 0,
                explanation: {
                    en: "Mars is known as the Red Planet because of its reddish appearance, which is due to iron oxide (rust) on its surface.",
                    hi: "मंगल को लाल ग्रह के रूप में जाना जाता है क्योंकि इसकी लालिम दिखाई देती है, जो इसकी सतह पर आयरन ऑक्साइड (जंग) के कारण है।"
                },
                status: 'incorrect'
            },
            {
                id: 3,
                question: {
                    en: "What is 2 + 2?",
                    hi: "2 + 2 कितना होता है?"
                },
                options: {
                    en: ["3", "4", "5", "6"],
                    hi: ["3", "4", "5", "6"]
                },
                correctAnswer: 1,
                userAnswer: null,
                explanation: {
                    en: "2 + 2 = 4. This is basic arithmetic addition.",
                    hi: "2 + 2 = 4। यह बुनियादी अंकगणित जोड़ है।"
                },
                status: 'unattempted'
            }
        ];

        // Initialize the review page
        async function initializeReview() {
            await loadTestData();
            updateStats();
            renderQuestions();
            updateNavigation();
        }

        // Load test data from localStorage or URL parameters (fetch real last attempt)
        async function loadTestData() {
            // Try to get test result data from localStorage
            const testResult = localStorage.getItem('testResult');
            const params = new URLSearchParams(window.location.search);
            const testId = params.get('testId') || (() => {
                try { const r = JSON.parse(testResult || '{}'); return r?.testId; } catch { return null; }
            })() || localStorage.getItem('testId');
            
            if (testId) {
                try {
                    const { response, data } = await ExamAxisAPI.request(`/api/tests/last-attempt/${encodeURIComponent(testId)}`);
                    const la = (response && response.ok && data && (data.data || data.lastAttempt)) ? (data.data?.lastAttempt || data.data || data.lastAttempt) : null;
                    let questions = Array.isArray(la?.questions) && la.questions.length ? la.questions : [];
                    if (!questions.length) {
                        try {
                            const q = await ExamAxisAPI.request(`/api/questions/${encodeURIComponent(testId)}`);
                            questions = (q.data && (q.data.data?.questions || q.data.questions || q.data)) || [];
                        } catch (_) {}
                    }
                    if (la && Array.isArray(questions) && questions.length) {
                        const answers = la.answers || {};
                        const normalize = (str) => String(str || '').normalize('NFKC').replace(/\s+/g, ' ').trim().toLowerCase();
                        const letterToIndex = (s) => {
                            const m = String(s || '').trim().toUpperCase();
                            return {A:0,B:1,C:2,D:3}[m];
                        };
                        const getOptionText = (opts, idxOrText) => {
                            if (idxOrText == null) return null;
                            if (typeof idxOrText === 'number') {
                                if (Array.isArray(opts)) return opts[idxOrText];
                                if (Array.isArray(opts?.en)) return opts.en[idxOrText];
                                return null;
                            }
                            const letterIdx = letterToIndex(idxOrText);
                            if (letterIdx != null) {
                                if (Array.isArray(opts)) return opts[letterIdx];
                                if (Array.isArray(opts?.en)) return opts.en[letterIdx];
                            }
                            return String(idxOrText);
                        };
                        const getCorrectText = (q) => {
                            if (typeof q.correctAnswer === 'number') return getOptionText(q.options, q.correctAnswer);
                            if (typeof q.correctAnswer === 'string') return q.correctAnswer;
                            if (q.correctAnswer?.en) return q.correctAnswer.en;
                            return '';
                        };
                        const pickAnswer = (q, idx) => {
                            const keys = [
                                q.id != null ? String(q.id) : null,
                                q.qid != null ? String(q.qid) : null,
                                String(idx+1)
                            ].filter(Boolean);
                            for (const k of keys) {
                                if (answers[k] != null) return answers[k];
                            }
                            return null;
                        };
                        allQuestions = questions.map((q, idx) => {
                            const rawSel = pickAnswer(q, idx);
                            const userText = getOptionText(q.options, rawSel);
                            const corrText = getCorrectText(q);
                            const status = (userText == null || userText === '') ? 'unattempted' : (normalize(userText) === normalize(corrText) ? 'correct' : 'incorrect');
                            return {
                                id: q.id ?? idx + 1,
                                question: q.question || q,
                                options: q.options || [],
                                correctAnswer: corrText,
                                userAnswer: userText,
                                explanation: q.explanation || {},
                                status
                            };
                        });
                        filteredQuestions = [...allQuestions];
                        return;
                    }
                } catch (_) {}
            }
            
            if (testResult) {
                try {
                    const result = JSON.parse(testResult);
                    
                    const questions = result.questions || [];
                    const questionStates = result.questionStates || [];

                    // Helper: normalize text and compare like test page
                    const textsMatch = (a, b) => {
                        if (!a || !b) return false;
                        const normalize = (str) => String(str).normalize('NFKC').replace(/\s+/g, ' ').trim().toLowerCase();
                        return normalize(a) === normalize(b);
                    };
                    const getCorrectAnswer = (q) => {
                        if (q.correctAnswer?.en) return String(q.correctAnswer.en).trim();
                        if (typeof q.correctAnswer === 'string') return String(q.correctAnswer).trim();
                        return '';
                    };
                    
                    // Map questions with their states
                    allQuestions = questions.map((question, index) => {
                        const state = questionStates[index] || {};
                        const userAnswer = state.userAnswer ?? null;
                        let correctAnswer = getCorrectAnswer(question);
                        if (!correctAnswer && Array.isArray(question.options) && question.options.length) {
                            // Try to infer correct from options via index stored in question.correctIndex or matching text
                            const optTexts = question.options.map(o => (o?.en ?? o)?.toString?.() ?? '');
                            const probable = optTexts.find(t => textsMatch(t, userAnswer));
                            correctAnswer = probable || optTexts.find(t => t) || '';
                        }
                        const status = state.resultCategory || (userAnswer == null ? 'unattempted' : (textsMatch(userAnswer, correctAnswer) ? 'correct' : 'incorrect'));
                        
                        return {
                            id: index + 1,
                            question: question.question || question, // Handle different structures
                            options: question.options || [],
                            correctAnswer: correctAnswer,
                            userAnswer: userAnswer,
                            status: status,
                            explanation: question.explanation || {}
                        };
                    });
                    
                } catch (e) {
                    allQuestions = sampleQuestions;
                }
            } else {
                // Fallback to sample data for demo
                allQuestions = sampleQuestions;
            }
            
            filteredQuestions = [...allQuestions];
        }

        // Update statistics
        function updateStats() {
            const total = allQuestions.length;
            const correct = allQuestions.filter(q => q.status === 'correct').length;
            const incorrect = allQuestions.filter(q => q.status === 'incorrect').length;
            const unattempted = allQuestions.filter(q => q.status === 'unattempted').length;
            const accuracy = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

            document.getElementById('totalQuestions').textContent = total;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('unattemptedCount').textContent = unattempted;
            document.getElementById('accuracyRate').textContent = accuracy + '%';
        }

        // Render questions
        function renderQuestions() {
            const container = document.getElementById('questionsList');
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            if (filteredQuestions.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-search"></i>
                        <p>${translations[currentLanguage].noQuestionsFound}</p>
                    </div>
                `;
                return;
            }

            loadingIndicator.style.display = 'none';
            container.innerHTML = '';

            filteredQuestions.forEach((question, index) => {
                const questionCard = createQuestionCard(question, index);
                container.appendChild(questionCard);
            });

            // Scroll to current question
            if (currentQuestionIndex < filteredQuestions.length) {
                const currentCard = container.children[currentQuestionIndex];
                if (currentCard) {
                    currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Create question card
        function createQuestionCard(question, index) {
            const card = document.createElement('div');
            card.className = `question-card ${question.status}`;
            card.id = `question-${index}`;

            const statusText = {
                correct: translations[currentLanguage].correctAnswer || 'Correct',
                incorrect: translations[currentLanguage].incorrect || 'Incorrect',
                unattempted: translations[currentLanguage].notAttempted || 'Not Attempted'
            };

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">
                        ${translations[currentLanguage].question || 'Question'} ${index + 1}
                    </div>
                    <div class="question-status status-${question.status}">
                        ${statusText[question.status]}
                    </div>
                </div>
                <div class="question-text">
                    ${question.question[currentLanguage]}
                </div>
                <div class="options-grid">
                    ${question.options[currentLanguage].map((option, optIndex) => {
                        let optionClass = 'option-item';
                        if (optIndex === question.correctAnswer) optionClass += ' correct';
                        if (optIndex === question.userAnswer) optionClass += ' selected';
                        if (optIndex === question.userAnswer && optIndex !== question.correctAnswer) optionClass += ' incorrect';

                        return `
                            <div class="${optionClass}">
                                <div class="option-label">${String.fromCharCode(65 + optIndex)}</div>
                                <div class="option-text">${option}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
                ${question.explanation[currentLanguage] ? `
                    <div class="explanation">
                        <div class="explanation-title">
                            <i class="fas fa-lightbulb"></i>
                            ${translations[currentLanguage].explanation || 'Explanation'}
                        </div>
                        <div class="explanation-text">
                            ${question.explanation[currentLanguage]}
                        </div>
                    </div>
                ` : ''}
            `;

            return card;
        }

        // Set language
        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update all translatable elements
            document.querySelectorAll('[data-en]').forEach(element => {
                const key = element.getAttribute('data-' + lang);
                if (key) {
                    element.textContent = key;
                }
            });

            // Update page title and subtitle
            document.getElementById('pageTitle').textContent = translations[lang].pageTitle;
            document.getElementById('pageSubtitle').textContent = translations[lang].pageSubtitle;

            // Re-render questions with new language
            renderQuestions();
        }

        // Filter questions
        function filterQuestions(filter) {
            currentFilter = filter;
            currentQuestionIndex = 0;

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter questions
            if (filter === 'all') {
                filteredQuestions = [...allQuestions];
            } else {
                filteredQuestions = allQuestions.filter(q => q.status === filter);
            }

            renderQuestions();
            updateNavigation();
        }

        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                scrollToCurrentQuestion();
                updateNavigation();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                scrollToCurrentQuestion();
                updateNavigation();
            }
        }

        function jumpToQuestion() {
            const jumpInput = document.getElementById('jumpInput');
            const questionNumber = parseInt(jumpInput.value) - 1;
            
            if (questionNumber >= 0 && questionNumber < filteredQuestions.length) {
                currentQuestionIndex = questionNumber;
                scrollToCurrentQuestion();
                updateNavigation();
            }
        }

        function scrollToCurrentQuestion() {
            const currentCard = document.getElementById(`question-${currentQuestionIndex}`);
            if (currentCard) {
                currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const jumpInput = document.getElementById('jumpInput');

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === filteredQuestions.length - 1;
            jumpInput.value = currentQuestionIndex + 1;
            jumpInput.max = filteredQuestions.length;
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            initializeReview();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAbNjrfIO19ZZqqOHcFFXkCF_Nz9vMCJrU",
            authDomain: "exam-axis.firebaseapp.com",
            databaseURL: "https://exam-axis-default-rtdb.firebaseio.com",
            projectId: "exam-axis",
            storageBucket: "exam-axis.firebasestorage.app",
            messagingSenderId: "285879641284",
            appId: "1:285879641284:web:10a1800c5e579e68ee1591",
            measurementId: "G-2ML43R0G1X"
        };

        let reviewDb = null;
        const RANKING_ENABLED = true;
        const FIREBASE_CONFIG = firebaseConfig;
        function initFirebaseSafely() {
            try {
                if (!window.firebase) {
                    return { enabled: false, reason: 'SDK missing' };
                }
                if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
                    return { enabled: false, reason: 'Missing config' };
                }
                const app = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
                const auth = firebase.auth();
                const db = firebase.database();
                return { enabled: true, app, auth, db };
            } catch (e) {
                return { enabled: false, reason: e.message };
            }
        }
        const FB = RANKING_ENABLED ? initFirebaseSafely() : { enabled: false, reason: 'Ranking disabled' };
        async function startAnonymousIfEnabled() {
            if (!FB.enabled) return null;
            try {
                const cred = await FB.auth.signInAnonymously();
                return cred.user;
            } catch (_) {
                return null;
            }
        }

        function initReviewFirebase() {
            reviewDb = FB.enabled ? FB.db : null;
            startAnonymousIfEnabled().then(()=>{});
        }

        function updateReviewRankUI(rank, totalUsers, percentile) {
            const card = document.getElementById('rankCard');
            if (!card) return;

            const rankEl = document.getElementById('rankReviewNumber');
            const percEl = document.getElementById('percentileReviewValue');
            const fillEl = document.getElementById('percentileReviewFill');
            const subtitle = document.getElementById('rankSubtitle');

            if (rankEl) rankEl.textContent = String(rank);
            if (percEl) percEl.textContent = `${percentile}%`;
            if (fillEl) fillEl.style.width = `${percentile}%`;
            if (subtitle) subtitle.textContent = `#${rank} of ${totalUsers} students`;
            card.style.display = '';
        }

        function loadReviewRanking() {
            if (!reviewDb) return;

            const userId = localStorage.getItem('userId') || localStorage.getItem('user_id');
            const testId = localStorage.getItem('testId') || localStorage.getItem('test_id');
            if (!userId || !testId) return;

            reviewDb.ref('testResults/' + testId).once('value')
                .then((snapshot) => {
                    const allResults = snapshot.val() || {};
                    const resultsArray = Object.values(allResults);
                    if (!resultsArray.length) return;

                    resultsArray.sort((a, b) => (b.score || 0) - (a.score || 0));
                    const idx = resultsArray.findIndex(r => String(r.userId) === String(userId));
                    if (idx < 0) return;

                    const rank = idx + 1;
                    const totalUsers = resultsArray.length;
                    const percentile = Number((((totalUsers - rank + 1) / totalUsers) * 100).toFixed(1));
                    updateReviewRankUI(rank, totalUsers, percentile);
                })
                .catch(() => {});
        }

        function loadAttemptsHistory() {
            if (!reviewDb) return;
            const userId = localStorage.getItem('userId') || localStorage.getItem('user_id');
            const testId = localStorage.getItem('testId') || localStorage.getItem('test_id');
            if (!userId || !testId) return;
            reviewDb.ref('userAttempts/' + userId + '/' + testId).once('value')
                .then((snapshot) => {
                    const attempts = Object.values(snapshot.val() || {});
                    if (!attempts.length) return;
                    attempts.sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));
                    const listEl = document.getElementById('attemptsList');
                    const secEl = document.getElementById('attemptsSection');
                    if (!listEl || !secEl) return;
                    const html = attempts.map(a => {
                        const when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '—';
                        const total = a.totalQuestions ? a.totalQuestions * 2 : (a.totalMarks || 50);
                        const mins = (typeof a.timeTaken === 'number') ? Math.round(a.timeTaken/60) : (a.timeTaken?.mins ?? 0);
                        return `<div style="background:white;border:1px solid #e5e7eb;border-radius:12px;padding:12px;">
                            <div style="font-weight:700;color:#111827;margin-bottom:4px;">${a.testTitle || 'Attempt'}</div>
                            <div style="color:#374151;font-weight:600;">${a.score || 0}/${total}</div>
                            <div style="color:#6b7280;font-size:12px;">${mins}m • ${when}</div>
                            <div style="color:#6b7280;font-size:12px;margin-top:6px;">Correct: ${a.correct || 0} • Wrong: ${a.incorrect || 0} • Unanswered: ${a.unattempted || 0}</div>
                        </div>`;
                    }).join('');
                    listEl.innerHTML = html;
                    secEl.style.display = '';
                })
                .catch(()=>{});
        }

        document.addEventListener('DOMContentLoaded', function() {
            initReviewFirebase();
            loadReviewRanking();
            loadAttemptsHistory();
        });
    </script>
