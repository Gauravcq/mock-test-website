<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Exam-Axis</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#f7f8fc;
    --card:#ffffff;
    --brand:#4A00E0;
}
body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    margin:0;
}
header{
    background:var(--card);
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo{
    font-size:1.8rem;
    font-weight:900;
    color:var(--brand);
}
.logout{
    padding:10px 18px;
    background:var(--brand);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.dashboard{
    padding:40px;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}
.card{
    background:var(--card);
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.card h3{margin-bottom:10px}
</style>
</head>

<body>

<header>
    <div class="logo">EXAM-AXIS</div>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<section class="dashboard">
<h2>Welcome back 👋</h2>

<div class="cards">
    <div class="card">
        <h3>📘 Practice Tests</h3>
        <p>Attempt full-length mock exams</p>
    </div>
    <div class="card">
        <h3>📊 Performance</h3>
        <p>Track your accuracy & scores</p>
    </div>
    <div class="card">
        <h3>🧠 Study Plan</h3>
        <p>Daily targets & revision</p>
    </div>
    <div class="card">
        <h3>🏆 Achievements</h3>
        <p>Your milestones</p>
    </div>
</div>
</section>

<script src="js/api.js"></script>
<script>
if(!ExamAxisAPI.isLoggedIn()){
    window.location.href="login.html";
}
function logout(){
    ExamAxisAPI.logout();
    window.location.href="login.html";
}
</script>

</body>
</html>
