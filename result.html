<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results</title>
    <script>
        // Function to handle test results
        function handleTestResults(score) {
            const formattedScore = score > 0 ? `Score: ${score}` : 'No test score available';
            document.getElementById('scoreDisplay').innerText = formattedScore;
            localStorage.setItem('testScore', score);
        }

        // Function to load score from localStorage
        function loadScore() {
            const savedScore = localStorage.getItem('testScore');
            if (savedScore) {
                handleTestResults(savedScore);
            }
        }

        // Call loadScore on page load
        window.onload = loadScore;
    </script>
</head>
<body>
    <h1>Test Results</h1>
    <div id="scoreDisplay">Loading score...</div>
</body>
</html>
