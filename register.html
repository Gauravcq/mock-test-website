<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Exam-Axis</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* SAME CSS VARIABLES AS LOGIN */
:root {
    --light-bg:#f7f8fc;
    --light-card-bg:#fff;
    --light-text-primary:#1a202c;
    --light-text-secondary:#4a5568;
    --light-border:#e2e8f0;

    --dark-bg:#0f172a;
    --dark-card-bg:#1e293b;
    --dark-text-primary:#f8fafc;
    --dark-text-secondary:#94a3b8;
    --dark-border:#334155;

    --primary-brand:#4A00E0;
    --secondary-brand:#8E2DE2;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Inter',sans-serif;
    background:var(--light-bg);
    min-height:100vh;
}
body.dark-mode{background:var(--dark-bg)}

.top-nav{
    background:var(--light-card-bg);
    padding:12px 30px;
    border-bottom:1px solid var(--light-border);
    display:flex;
    justify-content:space-between;
}
body.dark-mode .top-nav{
    background:var(--dark-card-bg);
    border-color:var(--dark-border);
}
.brand-logo{
    font-size:1.8rem;
    font-weight:900;
    color:var(--primary-brand);
    text-decoration:none;
}
.theme-toggle{
    border:1px solid var(--light-border);
    padding:8px 14px;
    border-radius:50px;
    cursor:pointer;
}

.auth-container{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}
.auth-card{
    width:100%;
    max-width:460px;
    background:var(--light-card-bg);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(74,0,224,0.15);
}
body.dark-mode .auth-card{background:var(--dark-card-bg)}

.auth-header{
    background:linear-gradient(135deg,var(--primary-brand),var(--secondary-brand));
    padding:40px;
    color:#fff;
    text-align:center;
}
.auth-header h1{font-size:26px;font-weight:800}

.auth-form{padding:35px}

.form-group{margin-bottom:20px}
label{font-size:14px;font-weight:600}
.input-wrapper{position:relative}
.input-wrapper i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
}
.form-control{
    width:100%;
    padding:14px 16px 14px 48px;
    border:2px solid var(--light-border);
    border-radius:12px;
}

.btn-submit{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--primary-brand),var(--secondary-brand));
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.auth-footer{
    text-align:center;
    padding-bottom:30px;
}
.auth-footer a{color:var(--primary-brand);font-weight:600;text-decoration:none}
</style>
</head>

<body>

<nav class="top-nav">
    <a href="index.html" class="brand-logo">EXAM-AXIS</a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</nav>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
    <h1>Create Account</h1>
    <p>Start your exam preparation today 🚀</p>
</div>

<form class="auth-form" id="registerForm">

<div class="form-group">
<label>Username</label>
<div class="input-wrapper">
<i class="fas fa-user"></i>
<input class="form-control" id="username" required>
</div>
</div>

<div class="form-group">
<label>Email</label>
<div class="input-wrapper">
<i class="fas fa-envelope"></i>
<input type="email" class="form-control" id="email" required>
</div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input-wrapper">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" id="password" required>
</div>
</div>

<button class="btn-submit">Create Account</button>

</form>

<div class="auth-footer">
<p>Already have an account? <a href="login.html">Login</a></p>
</div>

</div>
</div>

<script src="js/api.js"></script>
<script>
function toggleTheme(){
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme',
        document.body.classList.contains('dark-mode')?'dark':'light');
}

if(localStorage.getItem('theme')==='dark'){
    document.body.classList.add('dark-mode');
}

document.getElementById('registerForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const res = await ExamAxisAPI.register(
        username.value, email.value, password.value
    );
    if(res.success){
        alert("Account created successfully!");
        window.location.href="login.html";
    }else{
        alert(res.message);
    }
});
</script>

</body>
</html>
