<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Exam-Axis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Copy your CSS variables from index.html */
        :root {
            --light-bg: #f7f8fc;
            --light-card-bg: #ffffff;
            --light-text-primary: #1a202c;
            --light-text-secondary: #4a5568;
            --light-border: #e2e8f0;
            --dark-bg: #0f172a;
            --dark-card-bg: #1e293b;
            --dark-text-primary: #f8fafc;
            --dark-text-secondary: #94a3b8;
            --dark-border: #334155;
            --primary-brand: #4A00E0;
            --secondary-brand: #8E2DE2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-bg);
            color: var(--light-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body.dark-mode { background: var(--dark-bg); color: var(--dark-text-primary); }

        .top-nav {
            background: var(--light-card-bg);
            border-bottom: 1px solid var(--light-border);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.dark-mode .top-nav { background: var(--dark-card-bg); border-color: var(--dark-border); }
        .brand-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary-brand); text-decoration: none; }
        .theme-toggle {
            background: var(--light-bg); border: 1px solid var(--light-border);
            padding: 8px 14px; border-radius: 50px; cursor: pointer; font-size: 16px;
        }
        body.dark-mode .theme-toggle { background: var(--dark-bg); border-color: var(--dark-border); }

        .auth-container {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }
        .auth-card {
            background: var(--light-card-bg); border-radius: 20px;
            box-shadow: 0 20px 60px rgba(74, 0, 224, 0.1);
            width: 100%; max-width: 440px; overflow: hidden;
        }
        body.dark-mode .auth-card { background: var(--dark-card-bg); }

        .auth-header {
            background: linear-gradient(135deg, var(--primary-brand), var(--secondary-brand));
            padding: 40px; text-align: center; color: white;
        }
        .auth-header .icon { font-size: 48px; margin-bottom: 15px; }
        .auth-header h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
        .auth-header p { opacity: 0.9; }

        .auth-form { padding: 35px; }
        
        .alert {
            padding: 14px 16px; border-radius: 10px; margin-bottom: 20px;
            font-size: 14px; display: none; align-items: center; gap: 10px;
        }
        .alert.show { display: flex; }
        .alert-error { background: rgba(220,53,69,0.1); color: #c0392b; border: 1px solid rgba(220,53,69,0.2); }
        .alert-success { background: rgba(0,184,148,0.1); color: #00a884; border: 1px solid rgba(0,184,148,0.2); }

        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; font-size: 14px; font-weight: 600;
            color: var(--light-text-secondary); margin-bottom: 8px;
        }
        body.dark-mode .form-group label { color: var(--dark-text-secondary); }
        .required { color: #e74c3c; }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); color: var(--light-text-secondary);
        }
        body.dark-mode .input-wrapper i { color: var(--dark-text-secondary); }

        .form-control {
            width: 100%; padding: 14px 16px 14px 48px; font-size: 15px; font-family: inherit;
            border: 2px solid var(--light-border); border-radius: 12px;
            background: var(--light-bg); color: var(--light-text-primary); transition: all 0.3s;
        }
        body.dark-mode .form-control {
            background: var(--dark-bg); border-color: var(--dark-border); color: var(--dark-text-primary);
        }
        .form-control:focus { outline: none; border-color: var(--primary-brand); }

        .password-toggle {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--light-text-secondary); cursor: pointer;
        }

        .form-options {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; font-size: 14px;
        }
        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--primary-brand); }
        .forgot-link { color: var(--primary-brand); text-decoration: none; }

        .btn-submit {
            width: 100%; padding: 16px; font-size: 16px; font-weight: 700; font-family: inherit;
            color: white; background: linear-gradient(135deg, var(--primary-brand), var(--secondary-brand));
            border: none; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 25px rgba(74,0,224,0.35); transition: all 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-submit .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: none;
        }
        .btn-submit.loading .spinner { display: block; }
        .btn-submit.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .auth-footer {
            text-align: center; padding: 0 35px 35px; color: var(--light-text-secondary);
        }
        body.dark-mode .auth-footer { color: var(--dark-text-secondary); }
        .auth-footer a { color: var(--primary-brand); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html" class="brand-logo">EXAM-AXIS</a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon">🎓</div>
            <h1>Welcome Back!</h1>
            <p>Sign in to continue your preparation</p>
        </div>
        
        <form class="auth-form" id="loginForm">
            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>
            
            <div class="alert alert-success" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span id="successMessage"></span>
            </div>
            
            <div class="form-group">
                <label>Username or Email <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" id="identifier" 
                           placeholder="Enter username or email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password" 
                           placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
                <span class="spinner"></span>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Create Account</a></p>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    // Theme toggle
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.querySelector('.theme-toggle').textContent = 
            document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    
    // Password toggle
    function togglePassword() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            pw.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
    
    // Apply saved theme
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.querySelector('.theme-toggle').textContent = '☀️';
    }
    
    // Redirect if already logged in
    if (ExamAxisAPI.isLoggedIn()) {
        window.location.href = 'dashboard.html';
    }
    
    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        
        // Hide alerts
        errorAlert.classList.remove('show');
        successAlert.classList.remove('show');
        
        // Show loading
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;
        
        const result = await ExamAxisAPI.login(identifier, password);
        
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        
        if (result.success) {
            document.getElementById('successMessage').textContent = result.message;
            successAlert.classList.add('show');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        } else {
            document.getElementById('errorMessage').textContent = result.message;
            errorAlert.classList.add('show');
        }
    });
</script>
</body>
</html>
